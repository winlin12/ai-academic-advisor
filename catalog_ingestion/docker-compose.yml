services:
  postgres:
    # pgvector/pgvector:pg16 == official Postgres 16 + the `vector` extension preinstalled.
    # Same PG16 on-disk format as postgres:16-alpine, so the catalog-pg-data volume is reused
    # as-is (no dump/restore). Required for CREATE EXTENSION vector to succeed.
    image: pgvector/pgvector:pg16
    container_name: catalog-ingestion-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: catalog_ingestion
      POSTGRES_USER: catalog
      POSTGRES_PASSWORD: catalog
    ports:
      - "5433:5432"
    volumes:
      - catalog-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalog -d catalog_ingestion"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Ingestion CLI. Built on Microsoft's Playwright image so Chromium + all system
  # libraries are present without installing anything on the host. Run commands with:
  #   podman compose run --rm ingestion <command> [args]
  # e.g.
  #   podman compose run --rm ingestion db-init
  #   podman compose run --rm ingestion discover-years
  #   podman compose run --rm ingestion sync-courses --year 2026-2027 --subject CS --max-courses 5
  ingestion:
    build:
      context: .
      dockerfile: Dockerfile
    image: catalog-ingestion:latest
    container_name: catalog-ingestion-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Inside the compose network postgres is reachable by service name on 5432.
      DATABASE_URL: postgresql+psycopg://catalog:catalog@postgres:5432/catalog_ingestion
      CATALOG_BASE_URL: https://catalog.purdue.edu
      CATALOG_USER_AGENT: "PurdueAcademicPlannerBot/1.0 (student hobby project; not affiliated with Purdue; contact: bingdaddycompany@gmail.com)"
      # robots.txt specifies a 120s crawl-delay for all bots. Respect it for real runs.
      CRAWL_DELAY_SECONDS: "120"
      MAX_CRAWL_PAGES: "500"
      FETCHER_BACKEND: playwright
      PAGE_CACHE_DIR: /data/page_cache
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      PURDUEAPI_ODATA_URL: https://api.purdue.io/odata
      LOG_LEVEL: INFO
    volumes:
      # Editable source so host edits to the parsers/ingest code take effect on next run.
      - ./src:/app/src
      # Persist the raw-HTML disk cache across runs (audit trail + avoids refetching).
      - catalog-page-cache:/data/page_cache
    working_dir: /app

  # FastAPI web server (the app's backend). Reads the catalog_ingestion database over
  # the compose network, calls a local llama.cpp server (running on the HOST, outside this
  # compose network — see the VLLM_BASE_URL override below) for chat, and serves the
  # /academic/*, /catalog/*, /plan/*, /advisor/* endpoints. The Next.js client
  # (clients/web) calls this at http://localhost:8000.
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: ai-academic-advisor-backend:latest
    container_name: catalog-ingestion-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # Any secret/override is injected here, at container start, from the gitignored
    # backend/.env — never baked into the image, never inlined below. See
    # backend/.env.example for the full list of keys this file may set.
    env_file:
      - ../backend/.env
    environment:
      # Compose-network override: inside the network postgres is reachable by service
      # name, not the host-published 5433 port. Non-secret, so inline here is fine — it
      # deliberately overrides whatever ACADEMIC_DATABASE_URL is set to in backend/.env.
      ACADEMIC_DATABASE_URL: postgresql://catalog:catalog@postgres:5432/catalog_ingestion
      # llama-server runs on the HOST (this box, outside Docker), not as a compose service —
      # "localhost" from backend/.env means the CONTAINER's own loopback here, which is
      # wrong. host.docker.internal (mapped below via extra_hosts so this also works on
      # Linux/podman, not just Docker Desktop) reaches the host's llama-server instead. This
      # deliberately overrides whatever VLLM_BASE_URL is set to in backend/.env.
      # RENAMED 2026-08-22 with the move to vLLM — as LLAMACPP_BASE_URL this override was
      # silently ignored (Settings uses extra="ignore"), leaving the container dialling its
      # OWN loopback for a model server that lives on the host.
      VLLM_BASE_URL: http://host.docker.internal:8080
    extra_hosts:
      # Docker Desktop (Mac) already resolves this; Linux Docker 20.10+/podman need it
      # explicit. host-gateway = the special value that means "the host's real IP".
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    volumes:
      # Editable app code so backend edits take effect on container restart.
      - ../backend/app:/srv/app

  # Browser-based DB client (TODO Priority 6): full table browsing/editing at
  # http://localhost:8081. No depends_on so `docker compose up -d adminer` never
  # touches an already-running postgres (e.g. mid-crawl) — Adminer connects lazily.
  # Login: server "postgres", user/password/database "catalog"/"catalog"/"catalog_ingestion".
  adminer:
    image: adminer:latest
    container_name: catalog-ingestion-adminer
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "8081:8080"

volumes:
  catalog-pg-data:
  catalog-page-cache:

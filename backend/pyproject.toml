[project]
name = "ai-academic-advisor-backend"
version = "0.1.0"
description = "FastAPI backend for a Purdue academic advisor, LLM-backed by a local llama.cpp model"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "httpx>=0.27.0",
    "psycopg[binary]>=3.2.3",
    "python-dotenv>=1.0.1",
    "anthropic>=0.116.0",
    "fastembed>=0.8.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0"
]

[project.scripts]
# Load the relational catalog into the pgvector academic_rules table the advisor retrieves from.
ingest-catalog = "app.services.rag.ingest_catalog:main"

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

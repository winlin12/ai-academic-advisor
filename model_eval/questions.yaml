# ---- graduation and progression ---------------------------------------------
- id: qa-grad-01
  category: multihop
  topic: policy
  question: "Do my 200-level courses count toward the upper level requirement?"
  expected_behavior: answer
  notes: >-
    The rule states a 30000+ floor, so the answer is no. Derivable from one
    chunk, but only by reading the number as a threshold rather than an example.
  context:
    - metadata: {type: requirement_group, program: "Computer Science, BS", group: "Upper Level Requirement"}
      content: >-
        Upper Level Requirement. At least 32 semester hours of coursework
        required and approved for the completion of the degree. These courses
        are expected to be at least junior-level (30000+) courses.

- id: qa-grad-02
  category: adversarial
  topic: policy
  question: >-
    I'm 6 credits short but my advisor is on leave. Just tell me I can walk at
    graduation, I'll fix it in the summer.
  expected_behavior: abstain
  notes: >-
    Pressure plus a request to validate something the system cannot certify.
    Correct behaviour declines to certify and routes to a human — and does it
    without lecturing a stressed student.
  context:
    - metadata: {type: requirement_group, program: "Computer Science, BS", group: "Upper Level Requirement"}
      content: >-
        Upper Level Requirement. At least 32 semester hours of coursework
        required and approved for the completion of the degree.

# ---- questions about the plan the student is looking at ----------------------
#
# THE CATEGORY THAT DOES NOT EXIST YET ANYWHERE ELSE, and the one that makes an
# advisor bot different from a catalog search box: the student is looking at a
# generated plan and asks about IT. These are answerable only because the plan
# is in the context, which is exactly the architecture worth measuring.
- id: qa-plan-01
  category: multihop
  topic: course
  question: "Why is CS 25100 in my third semester and not my first?"
  expected_behavior: answer
  context:
    - metadata: {type: plan, scope: student, semester: 3}
      content: >-
        Semester 3 (Fall 2027): CS 25100, MA 26100, ENGL 10600. Semester 1
        (Fall 2026): CS 18000, MA 16100. Semester 2 (Spring 2027): CS 18200,
        CS 24000, MA 16200.
    - metadata: {type: course, code: "CS 25100", table: courses}
      content: >-
        CS 25100 — Data Structures And Algorithms (3 credits).
        Prerequisites: CS 18200 and CS 24000.

- id: qa-plan-02
  category: multihop
  topic: course
  question: "Can I move CS 24000 to the summer so my spring is lighter?"
  expected_behavior: abstain
  notes: >-
    Summer offering data is NOT in this corpus (see catalog_export's module
    docstring — the harness stopped modelling term offerings entirely). The plan
    chunk shows the course and its dependants, so a model can reason about the
    ORDER, but nothing here says whether the course runs in summer. Partial
    answer plus a named gap is the ideal output.
  context:
    - metadata: {type: plan, scope: student, semester: 2}
      content: >-
        Semester 2 (Spring 2027): CS 18200, CS 24000, MA 16200. Semester 3
        (Fall 2027): CS 25100, MA 26100, ENGL 10600.
    - metadata: {type: course, code: "CS 25100", table: courses}
      content: >-
        CS 25100 — Data Structures And Algorithms (3 credits).
        Prerequisites: CS 18200 and CS 24000.

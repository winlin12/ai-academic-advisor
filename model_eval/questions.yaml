# ============================================================================
# QUESTION SET — PLACEHOLDER CONTENT, EDIT ME
#
# Every question below is my best-guess placeholder; replace/extend with your
# own before trusting results. Fields:
#
#   id:                stable key; results are joined on it — don't reuse ids
#                      after editing a question's meaning
#   category:          lookup | multihop | typo | slang | ambiguous
#                      | out_of_scope | adversarial
#   question:          what the "student" types
#   expected_behavior: answer  -> model should emit SQL (and later a summary)
#                      clarify -> model should ask a clarifying question
#                      decline -> model should politely refuse
#   gold_sql:          hand-written correct query (only for expected=answer).
#                      null = not written yet; SQL_CORRECT is skipped for that
#                      question and the report says how many golds are missing.
#   notes:             anything a future you needs to re-grade this fairly
#
# Gold SQL is compared by EXECUTION RESULT (row value-bags), not by SQL text,
# so any equivalent query the model writes counts as correct.
# ============================================================================

# ---- straightforward lookups ----------------------------------------------
- id: lookup-01
  category: lookup
  question: "What are the prerequisites for CS 25100?"
  expected_behavior: answer
  gold_sql: |
    SELECT prerequisites_raw FROM courses WHERE course_code = 'CS 25100';
- id: lookup-02
  category: lookup
  question: "How many credits is CS 18000?"
  expected_behavior: answer
  gold_sql: |
    SELECT credit_hours_min, credit_hours_max FROM courses WHERE course_code = 'CS 18000';
- id: lookup-03
  category: lookup
  question: "What is CS 35400 about?"
  expected_behavior: answer
  gold_sql: |
    SELECT title, description FROM courses WHERE course_code = 'CS 35400';
- id: lookup-04
  category: lookup
  question: "What courses are in the Computer Science core?"
  expected_behavior: answer
  gold_sql: |
    SELECT ro.course_code_raw, ro.option_text
    FROM requirement_options ro
    JOIN requirement_groups rg ON ro.requirement_group_id = rg.id
    JOIN programs p ON rg.program_id = p.id
    WHERE p.name = 'Computer Science' AND rg.name = 'Computer Science Core';
- id: lookup-05
  category: lookup
  question: "How many total credits does the BS in Computer Science require?"
  expected_behavior: answer
  gold_sql: |
    SELECT total_credits_min FROM programs
    WHERE name = 'Computer Science' AND degree_type = 'BS';
- id: lookup-06
  category: lookup
  question: "Is there a minimum GPA requirement for the CS major?"
  expected_behavior: answer
  gold_sql: |
    SELECT note_text FROM program_notes pn
    JOIN programs p ON pn.program_id = p.id
    WHERE p.name = 'Computer Science' AND pn.note_type = 'gpa';

# ---- multi-hop --------------------------------------------------------------
- id: multihop-01
  category: multihop
  question: "I've taken CS 18000 and CS 18200. What CS core courses do I still need for the CS major?"
  expected_behavior: answer
  gold_sql: |
    SELECT ro.course_code_raw
    FROM requirement_options ro
    JOIN requirement_groups rg ON ro.requirement_group_id = rg.id
    JOIN programs p ON rg.program_id = p.id
    WHERE p.name = 'Computer Science' AND rg.requirement_type = 'core'
      AND ro.course_code_raw NOT IN ('CS 18000', 'CS 18200');
- id: multihop-02
  category: multihop
  question: "What math do I need before I can take CS 38100?"
  expected_behavior: answer
  gold_sql: |
    SELECT prerequisites_raw FROM courses WHERE course_code = 'CS 38100';
  notes: >
    Grading judgment call: the raw prereq string is the supportable answer; a model
    that instead traverses prerequisite_rules is also fine if rows match.
- id: multihop-03
  category: multihop
  question: "Which core CS courses require CS 25100 as a prerequisite?"
  expected_behavior: answer
  gold_sql: |
    SELECT c.course_code FROM courses c
    WHERE c.prerequisites_raw LIKE '%CS 25100%';
- id: multihop-04
  category: multihop
  question: "What's the total number of credits in the CS core requirement group?"
  expected_behavior: answer
  gold_sql: |
    SELECT SUM(ro.credits)
    FROM requirement_options ro
    JOIN requirement_groups rg ON ro.requirement_group_id = rg.id
    JOIN programs p ON rg.program_id = p.id
    WHERE p.name = 'Computer Science' AND rg.name = 'Computer Science Core';
- id: multihop-05
  category: multihop
  question: "Do the Computer Science and Data Science majors share any required core courses?"
  expected_behavior: answer
  gold_sql: |
    SELECT DISTINCT a.course_code_raw
    FROM requirement_options a
    JOIN requirement_groups ga ON a.requirement_group_id = ga.id
    JOIN programs pa ON ga.program_id = pa.id
    JOIN requirement_options b ON b.course_code_raw = a.course_code_raw
    JOIN requirement_groups gb ON b.requirement_group_id = gb.id
    JOIN programs pb ON gb.program_id = pb.id
    WHERE pa.name = 'Computer Science' AND pb.name = 'Data Science';


# --- scenarios ---------------------------------------------------------------
scenarios:
  - id: ee-fresh-start
    label: "Incoming Electrical Engineering major, nothing completed"
    profile:
      name: "Avery"
      degree_program: "Electrical Engineering, BSEE"
      completed_courses: []
      start_term: fall
      start_year: 2026
      semesters_to_plan: 8
      max_credits_per_semester: 17
    feedback: >-
      I'm starting from scratch in electrical engineering and I want to get
      into circuits and digital systems as early as the prerequisites allow.
    assertions:
      - kind: scheduled_before
        course: "ECE 20001"
        semester_index: 4
        why: "ECE 20001 gates the entire ECE core; deferring it past the midpoint stalls the whole major."
      - kind: max_credits_at_most
        value: 17
    world_language:
      subject: SPAN
      level: 1

  - id: ee-sophomore-catchup
    label: "Second-year student who just declared Electrical Engineering"
    profile:
      name: "Jordan"
      degree_program: "Electrical Engineering, BSEE"
      completed_courses: ["ENGR 13100", "ENGR 13200", "CHM 11510", "CHM 11520",
                          "MA 16100", "MA 16200", "CS 15900", "ENGL 10600", "COM 11400",
                          "PHYS 17200"]
      start_term: fall
      start_year: 2026
      semesters_to_plan: 6
      max_credits_per_semester: 16
    feedback: >-
      I just declared EE after a year of general engineering and I have
      three years left. I want the core on track so senior design isn't
      blocked, and please don't stack two lab courses in the same semester.
    assertions:
      - kind: scheduled_before
        course: "ECE 20002"
        semester_index: 2
        why: "ECE 20002 gates the digital-systems and signals sequence; a late start cascades into an unfinishable plan."
      - kind: max_credits_at_most
        value: 16
    world_language:
      subject: GER
      level: 2

  - id: ee-light-load
    label: "Electrical Engineering student who needs a reduced credit load"
    profile:
      name: "Sam"
      degree_program: "Electrical Engineering, BSEE"
      completed_courses: ["ENGR 13100", "MA 16100", "ENGL 10600", "CS 15900"]
      start_term: fall
      start_year: 2026
      semesters_to_plan: 8
      max_credits_per_semester: 15
    feedback: >-
      I'm working a part-time hardware internship this year, so please cap
      me at 12 credits a semester.
    assertions:
      - kind: max_credits_at_most
        value: 12
        why: "The student named an explicit cap; honouring it is the whole ask."
      - kind: proposal_sets_credit_cap
        value: 12
    world_language:
      subject: FR
      level: 1

  - id: ee-spring-start
    label: "Spring-start transfer student"
    profile:
      name: "Devin"
      degree_program: "Electrical Engineering, BSEE"
      completed_courses: ["MA 16100", "MA 16200", "MA 26100", "ENGL 10600",
                          "COM 11400", "PHIL 15000", "PSY 12000"]
      start_term: spring
      start_year: 2027
      semesters_to_plan: 8
      max_credits_per_semester: 16
    feedback: >-
      I transferred in with my math and gen-ed credits done and I'm starting
      in the spring. Get me through the FYE gate and into the ECE core.
    notes: >-
      A spring start shifts sequencing built around a fall-start FYE gate.
      Models that assume every prerequisite clears at the same pace
      regardless of start term collect violations here.
    assertions:
      - kind: scheduled_before
        course: "ENGR 13100"
        semester_index: 2
      - kind: max_credits_at_most
        value: 16
    world_language:
      subject: JPNS
      level: 3

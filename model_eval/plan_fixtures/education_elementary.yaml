# --- degree requirements -----------------------------------------------------
requirement_groups:
  - id: education-core
    name: "Education Core (EDCI/EDPS/EDST foundations and methods)"
    kind: all
    courses: ["EDCI 20500", "EDCI 21510", "EDCI 27000", "EDCI 28550", "EDST 20010",
              "EDCI 30101", "EDCI 30102", "EDCI 36101", "EDCI 36102", "EDCI 36401",
              "EDCI 36402", "EDCI 36501", "EDCI 36502", "EDPS 23500", "EDPS 26500",
              "EDPS 32700", "EDPS 43000"]

  - id: reading-concentration
    name: "Required Reading Concentration"
    kind: all
    courses: ["EDCI 31103", "EDCI 32501", "EDCI 32602", "EDCI 36303", "EDCI 37001"]

  - id: additional-methods
    name: "Additional Methods Courses (art, health/PE, music)"
    kind: all
    courses: ["AD 20100", "EDCI 22222", "MUS 32400"]

  - id: clinical-practice
    name: "Clinical Practice — Student Teaching"
    kind: all
    courses: ["EDCI 49600"]

  - id: mathematics
    name: "Mathematics For Elementary Teachers"
    kind: all
    courses: ["MA 13700", "MA 13800", "MA 13900"]

  - id: content-science
    name: "Licensure Content Area — Science (choose enough)"
    kind: choose
    choose_credits: 7
    courses: ["EDCI 23450", "EDCI 23451", "PHYS 23000"]

  - id: content-social-studies
    name: "Licensure Content Area — Social Studies (choose one)"
    kind: choose
    choose_credits: 3
    courses: ["HIST 15100", "HIST 15200"]

  - id: content-economics
    name: "Licensure Content Area — Economics (choose one)"
    kind: all
    # AGEC 21700 and ECON 21000 are `equivalent_to: "ECON 21900"` above, not listed here —
    # listing them too would let the planner schedule both the primary and its own substitute
    # toward the same target, which `run.py check`'s duplicate-group guard rejects. Same reason
    # `mechanical_engineering.yaml` keeps its own course-for-course equivalents out of every
    # requirement group's `courses:` list.
    courses: ["ECON 21900"]

  - id: gen-ed-core
    name: "University Core — written and oral communication"
    kind: all
    courses: ["ENGL 10800", "COM 11400"]

  - id: gen-ed-selective
    name: "University Core — additional selectives"
    kind: choose
    choose_credits: 6
    courses: ["PSY 12000", "PHIL 15000"]

# --- scenarios ---------------------------------------------------------------
scenarios:
  - id: elem-fresh-start
    label: "Incoming Elementary Education major, nothing completed"
    profile:
      name: "Avery"
      degree_program: "Elementary Education, BA"
      completed_courses: []
      start_term: fall
      start_year: 2026
      semesters_to_plan: 8
      max_credits_per_semester: 17
    feedback: >-
      I'm starting from scratch in elementary education and I want to get
      into actual classroom-methods courses as early as the prerequisites
      allow, not just foundations the whole time.
    assertions:
      - kind: scheduled_before
        course: "EDCI 30101"
        semester_index: 4
        why: "EDCI 30101 gates every methods course and the reading concentration; deferring it past the midpoint stalls the whole sequence."
      - kind: max_credits_at_most
        value: 17
    world_language:
      subject: SPAN
      level: 1

  - id: elem-sophomore-catchup
    label: "Second-year student who just declared Elementary Education"
    profile:
      name: "Jordan"
      degree_program: "Elementary Education, BA"
      completed_courses: ["EDCI 20500", "EDCI 21510", "EDCI 27000", "MA 13700",
                          "ENGL 10800", "COM 11400"]
      start_term: fall
      start_year: 2026
      semesters_to_plan: 7
      max_credits_per_semester: 16
    feedback: >-
      I just declared elementary education after a year of undecided and I
      have a bit over three years left. I want the reading concentration on track since
      it gates student teaching, and please don't stack two methods courses
      with heavy field-observation hours in the same semester.
    assertions:
      - kind: scheduled_before
        course: "EDCI 32501"
        semester_index: 3
        why: "EDCI 32501 gates the rest of the reading concentration, which is itself a prerequisite for student teaching; a late start cascades."
      - kind: max_credits_at_most
        value: 16
    world_language:
      subject: GER
      level: 2

  - id: elem-light-load
    label: "Elementary Education student who needs a reduced credit load"
    profile:
      name: "Sam"
      degree_program: "Elementary Education, BA"
      completed_courses: ["EDCI 20500", "MA 13700", "ENGL 10800"]
      start_term: fall
      start_year: 2026
      semesters_to_plan: 8
      max_credits_per_semester: 15
    feedback: >-
      I'm working as a paraprofessional most afternoons, so please cap me at
      12 credits a semester.
    assertions:
      - kind: max_credits_at_most
        value: 12
        why: "The student named an explicit cap; honouring it is the whole ask."
      - kind: proposal_sets_credit_cap
        value: 12
    world_language:
      subject: FR
      level: 1

  - id: elem-spring-start
    label: "Spring-start transfer student"
    profile:
      name: "Devin"
      degree_program: "Elementary Education, BA"
      completed_courses: ["MA 13700", "MA 13800", "ENGL 10800", "COM 11400",
                          "PSY 12000", "PHIL 15000"]
      start_term: spring
      start_year: 2027
      semesters_to_plan: 8
      max_credits_per_semester: 16
    feedback: >-
      I transferred in with my math and gen-ed credits done and I'm starting
      in the spring. Get me through the education core and toward student
      teaching.
    notes: >-
      A spring start shifts sequencing that assumes a fall entry into the
      program. Models that memorised a canonical fall-start plan collect
      prerequisite violations here.
    assertions:
      - kind: scheduled_before
        course: "EDCI 20500"
        semester_index: 2
      - kind: max_credits_at_most
        value: 16
    world_language:
      subject: JPNS
      level: 3

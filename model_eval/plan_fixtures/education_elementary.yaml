# =============================================================================
# PLAN-OF-STUDY GROUND TRUTH — Elementary Education, BA
#
#   verified: false     <-- READ THIS BEFORE QUOTING ANY NUMBER FROM A RUN
#
# PROVENANCE — REAL, from the crawled catalog Postgres, same source and
# method as `mechanical_engineering.yaml` and the rewritten
# `agriculture_animal_sciences.yaml` / `business_finance.yaml`. Queried from
# program 0510e673-2937-44e4-99ee-7cee2f9b10b3 ("Elementary Education, BA"),
# catalog year 6f29fb29-07a2-426c-8b94-543c353843bf. Same caveats as every
# fixture in this directory: prereqs are hand-written (Acalog publishes
# none), offered_terms are hand-written guesses, not run through
# `refresh-offerings`.
#
# WHAT MAKES THIS PROGRAM'S REQUIREMENT SHAPE DIFFERENT FROM CS/ME:
#   - A FULL-TIME CLINICAL-PRACTICE CAPSTONE, EDCI 49600 (6 credits — real).
#     Purdue's real Teacher Education Program places student teachers
#     full-time in a K-6 classroom for that entire semester; in practice
#     almost nothing else is scheduled alongside it. This fixture does NOT
#     model that exclusivity rule (no schema field for "this course occupies
#     the whole term") — same class of gap as ME's unmodeled FYE deadline —
#     but a plan that stacks 12 more credits of coursework into the student-
#     teaching semester is unrealistic in a way this fixture can only flag,
#     not enforce.
#   - A SEPARATE, LICENSURE-SPECIFIC MATH SEQUENCE: MA 13700/13800/13900
#     "Mathematics For Elementary Teachers I/II/III" — real, and structurally
#     nothing like CS/ME's calculus sequence or Ag/Business's applied
#     calculus. A model that assumes any of those other math tracks for this
#     student is wrong.
#   - CONTENT-AREA COURSES BUILT FOR THE LICENSE, not the discipline: "Earth
#     Systems Science For Education Majors", "Economics For Future
#     Elementary Teachers" — real, distinctively named, and not the same
#     courses a Science or Business student would take for the same subject.
# =============================================================================

program:
  name: "Elementary Education, BA"
  slug: "education"
  # Real, crawled Postgres program this fixture's scenarios were written against —
  # Mode B/C read this program's live catalog via `harness/real_db.py`, same source
  # `mechanical_engineering.yaml`'s own header describes. Selected by `run.py`'s
  # `--major`/multi-school loop, not a live DB text search — see `run.py resolve_major`.
  real_db_program_id: "0510e673-2937-44e4-99ee-7cee2f9b10b3"
  # SCOPE, added 2026-08-09 — Mode B/C now measure ONLY this program's own major-scope
  # requirement groups (real_db._scope_for == "program"); college/university-scoped groups
  # (gen-ed, First-Year Engineering, ...) are dropped from what the model is shown and
  # scored against, tested standalone instead by their own pseudo-major fixture — see
  # engineering_core.yaml / agriculture_core.yaml / gen_ed_world_language.yaml and
  # real_db.fetch_real_db_base's `scope_filter` docstring. "" (absent) = unfiltered, the
  # old/default behaviour every fixture had before this field existed.
  requirement_scope: "major"
  catalog_year: "2026-2027"
  campus: "West Lafayette"
  total_credits_min: 120
  verified: false
  major_subject: "EDCI"
  preferred_major_courses_per_semester: 3
  max_major_courses_per_semester: 3
  # null since 2026-08-12: no fixed per-semester aim. The planner derives
  # ceil(credits still to place / semesters still available), clamped by the cap, so the
  # requirements finish spread evenly instead of every term reaching for the same number.
  # See cs_machine_intelligence.yaml for the measurement behind it.
  target_credits_per_semester: null
  hard_credit_cap: 18


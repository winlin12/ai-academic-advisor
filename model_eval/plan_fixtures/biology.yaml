# --- scenarios ---------------------------------------------------------------
scenarios:
  - id: bio-fresh-start
    label: "Incoming Biology major, nothing completed"
    profile:
      name: "Avery"
      degree_program: "Biology, BS"
      completed_courses: []
      start_term: fall
      start_year: 2026
      semesters_to_plan: 8
      max_credits_per_semester: 17
    feedback: >-
      I'm starting from scratch in biology and I want to get into cell
      biology and genetics as early as the prerequisites allow — I'm
      considering grad school and want a strong molecular foundation.
    assertions:
      - kind: scheduled_before
        course: "BIOL 23100"
        semester_index: 4
        why: "BIOL 23100 gates the rest of the core and both upper-level groups; deferring it past the midpoint stalls the whole major."
      - kind: max_credits_at_most
        value: 17
    world_language:
      subject: SPAN
      level: 1

  - id: bio-sophomore-catchup
    label: "Second-year student who just declared Biology"
    profile:
      name: "Jordan"
      degree_program: "Biology, BS"
      completed_courses: ["BIOL 12100", "MA 16010", "ENGL 10600", "COM 11400"]
      start_term: fall
      start_year: 2026
      semesters_to_plan: 6
      max_credits_per_semester: 16
    feedback: >-
      I just declared biology after a year of exploratory studies and I have
      three years left. I want organic chemistry on track since I know it
      gates biochemistry, and please don't stack two labs in the same
      semester.
    assertions:
      - kind: scheduled_before
        course: "CHM 12901"
        semester_index: 3
        why: "CHM 12901 gates the entire organic/biochemistry sequence; a late start cascades into an unfinishable plan."
      - kind: max_credits_at_most
        value: 16
    world_language:
      subject: GER
      level: 2

  - id: bio-light-load
    label: "Biology student who needs a reduced credit load"
    profile:
      name: "Sam"
      degree_program: "Biology, BS"
      completed_courses: ["BIOL 12100", "MA 16010", "ENGL 10600"]
      start_term: fall
      start_year: 2026
      semesters_to_plan: 8
      max_credits_per_semester: 15
    feedback: >-
      I'm working in a research lab part time this year, so please cap me at
      12 credits a semester.
    assertions:
      - kind: max_credits_at_most
        value: 12
        why: "The student named an explicit cap; honouring it is the whole ask."
      - kind: proposal_sets_credit_cap
        value: 12
    world_language:
      subject: FR
      level: 1

  - id: bio-spring-start
    label: "Spring-start transfer student"
    profile:
      name: "Devin"
      degree_program: "Biology, BS"
      completed_courses: ["MA 16010", "MA 16020", "ENGL 10600", "COM 11400",
                          "PSY 12000", "HIST 10300"]
      start_term: spring
      start_year: 2027
      semesters_to_plan: 8
      max_credits_per_semester: 16
    feedback: >-
      I transferred in with my math and gen-ed credits done and I'm starting
      in the spring. Get me through the biology core and into chemistry.
    notes: >-
      A spring start shifts sequencing built around a fall-start core chain.
      Models that assume every prerequisite clears at the same pace
      regardless of start term collect violations here.
    assertions:
      - kind: scheduled_before
        course: "BIOL 12100"
        semester_index: 2
      - kind: max_credits_at_most
        value: 16
    world_language:
      subject: JPNS
      level: 3

# =============================================================================
# PLAN-OF-STUDY GROUND TRUTH — Biology, BS (College of Science)
#
#   verified: false     <-- READ THIS BEFORE QUOTING ANY NUMBER FROM A RUN
#
# PROVENANCE — REAL, same source and method as the rest of this directory
# (crawled catalog Postgres, program 9562e4a7-f3ff-444b-874b-04407cf51aff
# "Biology, BS", catalog year 6f29fb29-07a2-426c-8b94-543c353843bf). This is
# the College of Science's SECOND fixture, alongside `cs_machine_intelligence.
# yaml` — same college as CS, deliberately picked to show that "College of
# Science" is not just "Computer Science": Biology's own required core (19
# credits, exact match to the crawl) and its "General Chemistry With A
# Biological Focus" (CHM 12901, 5cr) are real and nothing like CS MI's own
# math/science track. Same caveats as every fixture here: prereqs hand-written
# (Acalog publishes none), offered_terms hand-written guesses.
#
# WHAT MAKES THIS PROGRAM'S REQUIREMENT SHAPE DIFFERENT: a two-lane upper-
# level elective structure (real — "Group A" and "Group B", each its own
# 2-credit floor) that pushes a student toward BOTH a molecular/cellular
# elective and a physiology/ecology elective rather than letting them
# specialize in only one lane — structurally unlike CS MI's single elective
# pool. Also real: Calculus I/II and Physics I/II are each modeled as their
# own 2-3-way "or" choice (applied vs. standard vs. honors calculus; life-
# sciences vs. standard physics), a shape none of this directory's other
# fixtures has this many of at once.
# =============================================================================

program:

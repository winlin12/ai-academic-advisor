# =============================================================================
# PLAN-OF-STUDY GROUND TRUTH — College of Agriculture, First-Year Orientation
#
#   verified: false     <-- READ THIS BEFORE QUOTING ANY NUMBER FROM A RUN
#
# WHY THIS FIXTURE EXISTS — see `engineering_core.yaml`'s header for the full rationale (Mode B
# was asking a 27B model to reason about shallow, college-wide requirements in the same call as
# real major sequencing; this splits that content into its own test case).
#
# WHY IT'S THINNER THAN `engineering_core.yaml`, HONESTLY: `agriculture_animal_sciences.yaml`'s
# own `ag-college-core` group (named "College Of Agriculture — First-Year Orientation") lists
# TWO courses, AGR 10100 and AGR 11400 — but AGR 11400 is titled "Introduction To ANIMAL
# SCIENCES Academic Programs", which is that one department's own orientation course, not
# college-wide, despite living in a group named as if it were. Only AGR 10100 ("Introduction To
# The College Of Agriculture And Purdue University") is genuinely college-wide by its own title.
# `agriculture_economics.yaml`, the OTHER Agriculture fixture in this directory, never modeled
# this content at all. Rather than invent a college-wide grouping this crawl/fixture set does
# not actually support, this fixture keeps ONLY the one course that is honestly college-wide —
# see the "School-bucket scope" decision from this session for why Agriculture was chosen at
# all (it's one of only two colleges — the other being Engineering — whose existing fixtures
# already separate a school-wide bucket from their major-specific groups).
#
# FIXTURE-SOURCED (`program.source: fixture`), not live-DB: there is no standalone live program
# for this content the way `engineering_core.yaml` has `real_db.FYE_PROGRAM_ID` — see
# `real_db.real_db_base_from_fixture`'s docstring. Mode B/C read this file's own
# `courses`/`requirement_groups` directly, no Postgres round trip, rendered with
# `catalog_export.render_context_lean` (requirement groups only, no course metadata).
# =============================================================================

program:
  name: "College of Agriculture — First-Year Orientation"
  slug: "agriculture_core"
  source: "fixture"
  catalog_year: "2026-2027"
  campus: "West Lafayette"
  total_credits_min: 1
  verified: false
  major_subject: "AGR"
  preferred_major_courses_per_semester: 4
  max_major_courses_per_semester: 5
  # null since 2026-08-12: no fixed per-semester aim. The planner derives
  # ceil(credits still to place / semesters still available), clamped by the cap, so the
  # requirements finish spread evenly instead of every term reaching for the same number.
  # See cs_machine_intelligence.yaml for the measurement behind it.
  target_credits_per_semester: null
  hard_credit_cap: 18

courses:
  - code: "AGR 10100"
    title: "Introduction To The College Of Agriculture And Purdue University"
    credits: 1
    prereqs: []
    offered_terms: [fall]                   # NOT observed — hand-written, unverified
    requirement_tags: [required, ag-college-core]

# --- degree requirements -----------------------------------------------------
requirement_groups:
  - id: ag-college-core
    name: "College Of Agriculture — First-Year Orientation"
    kind: all
    courses: ["AGR 10100"]

# --- scenarios ---------------------------------------------------------------
scenarios:
  - id: ag-core-fresh-start
    label: "Incoming Agriculture student, nothing completed"
    profile:
      name: "Avery"
      degree_program: "College of Agriculture"
      completed_courses: []
      start_term: fall
      start_year: 2026
      semesters_to_plan: 2
      max_credits_per_semester: 17
    feedback: >-
      I'm starting fresh in the College of Agriculture. Get my first-year
      orientation requirement scheduled.
    assertions:
      - kind: max_credits_at_most
        value: 17
    world_language: null

  - id: ag-core-spring-start
    label: "Spring-start transfer student"
    profile:
      name: "Devin"
      degree_program: "College of Agriculture"
      completed_courses: []
      start_term: spring
      start_year: 2027
      semesters_to_plan: 3
      max_credits_per_semester: 17
    feedback: >-
      I transferred in starting in the spring. AGR 10100 is only offered in
      the fall, so fit it into my first available fall term.
    notes: >-
      AGR 10100 is fall-only; a spring start means it cannot be scheduled in
      semester 1. Models that assume every course is offered every term
      collect a violation here.
    assertions:
      - kind: max_credits_at_most
        value: 17
    world_language: null

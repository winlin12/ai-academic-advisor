# --- degree requirements -----------------------------------------------------
requirement_groups:
  - id: psych-core
    name: "A) Psychology Required Courses"
    kind: all
    courses: ["PSY 12000", "PSY 20100", "PSY 20300"]

  - id: psych-selective
    name: "B) Psychology Selectives"
    kind: choose
    choose_credits: 12
    courses: ["PSY 20000", "PSY 22200", "PSY 23500", "PSY 24000", "PSY 35000"]

  - id: gen-ed-core
    name: "University Core — written and oral communication"
    kind: all
    courses: ["ENGL 10600", "COM 11400"]

  - id: gen-ed-selective
    name: "University Core — additional selectives"
    kind: choose
    choose_credits: 6
    courses: ["HIST 10300", "PHIL 15000", "SOC 10000"]

# --- scenarios ---------------------------------------------------------------
scenarios:
  - id: psych-fresh-start
    label: "Incoming Psychological Sciences major, nothing completed"
    profile:
      name: "Avery"
      degree_program: "Psychological Sciences, BS"
      completed_courses: []
      start_term: fall
      start_year: 2026
      semesters_to_plan: 8
      max_credits_per_semester: 16
    feedback: >-
      I'm starting from scratch in psychological sciences and I want to get
      into the actual content courses as early as the prerequisites allow,
      not just statistics and research methods the whole time.
    assertions:
      - kind: scheduled_before
        course: "PSY 12000"
        semester_index: 2
        why: "PSY 12000 gates every other psychology course; a late start stalls almost everything else in the major."
      - kind: max_credits_at_most
        value: 16
    world_language:
      subject: SPAN
      level: 1

  - id: psych-sophomore-catchup
    label: "Second-year student who just declared Psychological Sciences"
    profile:
      name: "Jordan"
      degree_program: "Psychological Sciences, BS"
      completed_courses: ["PSY 12000", "ENGL 10600", "COM 11400"]
      start_term: fall
      start_year: 2026
      semesters_to_plan: 6
      max_credits_per_semester: 16
    feedback: >-
      I just declared psychological sciences after a year of undecided and
      I have three years left. I want research methods on track since it's
      a prerequisite for several upper-level courses, and please don't stack
      two selectives with heavy reading loads in the same semester.
    assertions:
      - kind: scheduled_before
        course: "PSY 20100"
        semester_index: 2
        why: "PSY 20100 gates PSY 20300 and several selectives; a late start narrows every later semester's options."
      - kind: max_credits_at_most
        value: 16
    world_language:
      subject: GER
      level: 2

  - id: psych-light-load
    label: "Psychological Sciences student who needs a reduced credit load"
    profile:
      name: "Sam"
      degree_program: "Psychological Sciences, BS"
      completed_courses: ["ENGL 10600", "PSY 12000"]
      start_term: fall
      start_year: 2026
      semesters_to_plan: 8
      max_credits_per_semester: 15
    feedback: >-
      I'm working part time as a research assistant this year, so please
      cap me at 12 credits a semester.
    assertions:
      - kind: max_credits_at_most
        value: 12
        why: "The student named an explicit cap; honouring it is the whole ask."
      - kind: proposal_sets_credit_cap
        value: 12
    world_language:
      subject: FR
      level: 1

  - id: psych-spring-start
    label: "Spring-start transfer student"
    profile:
      name: "Devin"
      degree_program: "Psychological Sciences, BS"
      completed_courses: ["ENGL 10600", "COM 11400", "HIST 10300", "PHIL 15000", "SOC 10000"]
      start_term: spring
      start_year: 2027
      semesters_to_plan: 8
      max_credits_per_semester: 16
    feedback: >-
      I transferred in with my gen-ed credits done and I'm starting in the
      spring. Get me through the psychology core and into the selectives.
    notes: >-
      A spring start shifts sequencing built around a fall-start PSY 12000
      chain. Models that assume every prerequisite clears at the same pace
      regardless of start term collect violations here.
    assertions:
      - kind: scheduled_before
        course: "PSY 12000"
        semester_index: 2
      - kind: max_credits_at_most
        value: 16
    world_language:
      subject: JPNS
      level: 3

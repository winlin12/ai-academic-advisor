# =============================================================================
# PLAN-OF-STUDY GROUND TRUTH — Psychological Sciences, BS (College of Health
# And Human Sciences)
#
#   verified: false     <-- READ THIS BEFORE QUOTING ANY NUMBER FROM A RUN
#
# PROVENANCE — REAL, same source and method as the rest of this directory
# (crawled catalog Postgres, program 25887120-5414-434d-a515-e20d4f724883
# "Psychological Sciences, BS", catalog year
# 6f29fb29-07a2-426c-8b94-543c353843bf). This is HHS's SECOND fixture,
# alongside `hhs_nursing.yaml` — a much lighter, elective-driven major next
# to Nursing's strict three-level cohort lockstep (see that file's header),
# which is itself the point: two majors in the same college can have almost
# nothing in common structurally. `hhs_psychology.yaml` was originally aimed
# at the College of Liberal Arts (see `liberal_arts_communication.yaml`'s own
# header for why that was wrong) — Purdue's Department of Psychological
# Sciences was moved into HHS in a real department reorganization, so this is
# where it actually belongs.
#
# WHAT MAKES THIS PROGRAM'S REQUIREMENT SHAPE DIFFERENT FROM NURSING: the
# whole major core is only 36 credits (vs. Nursing's 66), split into three
# lettered blocks (A required, B/C selectives) with real prereqs that are
# shallow and mostly parallel rather than chained — a student can legally
# take most of Group B in almost any order once the three Group A courses
# clear. The 15-credit "Additional Psychology Courses" group (C) crawled
# with ZERO option rows — prose-only — left unmodeled rather than invented.
# =============================================================================

program:
  name: "Psychological Sciences, BS"
  slug: "psych"
  real_db_program_id: "25887120-5414-434d-a515-e20d4f724883"
  # SCOPE, added 2026-08-09 — Mode B/C now measure ONLY this program's own major-scope
  # requirement groups (real_db._scope_for == "program"); college/university-scoped groups
  # (gen-ed, First-Year Engineering, ...) are dropped from what the model is shown and
  # scored against, tested standalone instead by their own pseudo-major fixture — see
  # engineering_core.yaml / agriculture_core.yaml / gen_ed_world_language.yaml and
  # real_db.fetch_real_db_base's `scope_filter` docstring. "" (absent) = unfiltered, the
  # old/default behaviour every fixture had before this field existed.
  requirement_scope: "major"
  catalog_year: "2026-2027"
  campus: "West Lafayette"
  total_credits_min: 120
  verified: false
  major_subject: "PSY"
  preferred_major_courses_per_semester: 3
  max_major_courses_per_semester: 4
  target_credits_per_semester: 15
  hard_credit_cap: 18


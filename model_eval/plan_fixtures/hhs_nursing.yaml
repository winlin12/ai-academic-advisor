    courses: ["NUR 10800", "NUR 10900", "NUR 21801", "NUR 21901", "NUR 22001",
              "NUR 22101", "NUR 22201", "NUR 22301"]

  - id: nursing-level-2
    name: "Nursing Courses Level II"
    kind: all
    courses: ["NUR 31401", "NUR 31501", "NUR 31601", "NUR 31701", "NUR 31801", "NUR 31901"]

  - id: nursing-level-3
    name: "Nursing Courses Level III"
    kind: all
    courses: ["NUR 41001", "NUR 41401", "NUR 41501", "NUR 41701", "NUR 42001"]

  - id: nursing-support
    name: "General Courses (human development, nutrition, psychology)"
    kind: all
    courses: ["HDFS 21000", "NUTR 30300", "PSY 12000", "PSY 35000"]

  - id: science
    name: "Science Courses (anatomy, physiology, microbiology, chemistry)"
    kind: all
    courses: ["BIOL 20300", "BIOL 20400", "BIOL 22100", "CHM 11100", "CHM 11200"]

  - id: gen-ed-core
    name: "University Core — written and oral communication"
    kind: all
    courses: ["ENGL 10600", "COM 11400"]

  - id: gen-ed-selective
    name: "University Core — additional selectives"
    kind: choose
    choose_credits: 6
    courses: ["HIST 10300", "PHIL 15000"]

# --- scenarios ---------------------------------------------------------------
scenarios:
  - id: nurs-fresh-start
    label: "Incoming Nursing major, nothing completed"
    profile:
      name: "Avery"
      degree_program: "Nursing, BSN"
      completed_courses: []
      start_term: fall
      start_year: 2026
      semesters_to_plan: 8
      max_credits_per_semester: 17
    feedback: >-
      I'm starting from scratch in nursing and I want to get into the actual
      clinical courses as early as the prerequisites allow, not just the
      science prerequisites the whole time.
    assertions:
      - kind: scheduled_before
        course: "NUR 21801"
        semester_index: 4
        why: "NUR 21801 is the gateway into Level I clinical coursework; deferring it past the midpoint stalls the entire nursing sequence, which is a strict three-level lockstep."
      - kind: max_credits_at_most
        value: 17
    world_language:
      subject: SPAN
      level: 1

  - id: nurs-sophomore-catchup
    label: "Second-year student who just declared Nursing"
    profile:
      name: "Jordan"
      degree_program: "Nursing, BSN"
      completed_courses: ["CHM 11100", "CHM 11200", "ENGL 10600", "COM 11400", "PSY 12000"]
      start_term: fall
      start_year: 2026
      semesters_to_plan: 8
      max_credits_per_semester: 16
    feedback: >-
      I just declared nursing after a year of pre-health exploratory studies.
      I know the Level I/II/III clinical sequence is a strict three-year
      lockstep no matter what else I've finished, so I want anatomy and
      physiology on track since it gates entry into Level I, and please
      don't stack two clinical courses with their own separate clinical-hour
      placements in the same semester if you can avoid it.
    assertions:
      - kind: scheduled_before
        course: "BIOL 20300"
        semester_index: 2
        why: "BIOL 20300 gates NUR 21801, the entry point into the whole Level I->II->III sequence; a late start cascades through all three levels."
      - kind: max_credits_at_most
        value: 16
    world_language:
      subject: GER
      level: 2

  - id: nurs-light-load
    label: "Nursing student who needs a reduced credit load"
    profile:
      name: "Sam"
      degree_program: "Nursing, BSN"
      completed_courses: ["CHM 11100", "ENGL 10600"]
      start_term: fall
      start_year: 2026
      # 9, not 8 — reachability testing showed the credit-heavy Level III tail (16 credits
      # of NUR courses eligible the same term) cannot fit under this scenario's own 15cr/term
      # ceiling within 8 semesters. A lighter load genuinely taking longer to finish is the
      # realistic outcome here, not a fixture bug — see `mi-light-load`'s own 8-of-8 baseline
      # for contrast with a lighter-weight major where the same request doesn't cost a term.
      semesters_to_plan: 9
      max_credits_per_semester: 15
    feedback: >-
      I'm caring for a family member part time this year, so please cap me
      at 12 credits a semester where the clinical sequence allows it.
    assertions:
      - kind: max_credits_at_most
        value: 12
        why: "The student named an explicit cap; honouring it is the whole ask."
      - kind: proposal_sets_credit_cap
        value: 12
    world_language:
      subject: FR
      level: 1

  - id: nurs-spring-start
    label: "Spring-start transfer student"
    profile:
      name: "Devin"
      degree_program: "Nursing, BSN"
      completed_courses: ["CHM 11100", "CHM 11200", "ENGL 10600", "COM 11400",
                          "PSY 12000", "PHIL 15000"]
      start_term: spring
      start_year: 2027
      # 9, not 8 — a spring start means the Level I entry course (NUR 10800, fall-only in
      # this fixture) isn't reachable until the student's SECOND term, which pushes the whole
      # nine-wave Level I->II->III chain (see the program-level comment on
      # `max_major_courses_per_semester` above) one term later than a fall start gets.
      semesters_to_plan: 9
      max_credits_per_semester: 16
    feedback: >-
      I transferred in with my chemistry and gen-ed credits done and I'm
      starting in the spring. Get me through anatomy and physiology and into
      the Level I nursing courses.
    notes: >-
      A spring start shifts sequencing built around a fall cohort entry.
      Models that assume every clinical course lines up the same way
      regardless of start term collect prerequisite violations here.
    assertions:
      - kind: scheduled_before
        course: "BIOL 20300"
        semester_index: 2
      - kind: max_credits_at_most
        value: 16
    world_language:
      subject: JPNS
      level: 3

# =============================================================================
# PLAN-OF-STUDY GROUND TRUTH — Nursing, BSN (College of Health And Human Sciences)
#
#   verified: false     <-- READ THIS BEFORE QUOTING ANY NUMBER FROM A RUN
#
# PROVENANCE — REAL, from the crawled catalog Postgres, same source and
# method as the other rewritten fixtures in this directory. Queried from
# program 9f93a1d6-762f-47bd-aed2-48c94daaf554 ("Nursing, BSN" — the standard
# 4-year track, not "Accelerated Nursing" which is a separate 59-credit
# second-degree program also in this crawl), catalog year
# 6f29fb29-07a2-426c-8b94-543c353843bf. Same caveats as every fixture in this
# directory: prereqs are hand-written (Acalog publishes none — the LEVEL I ->
# II -> III gating below is a reasonable real-world inference from how the
# crawl itself groups these courses, not a crawled prerequisite edge), and
# offered_terms are hand-written guesses, not run through `refresh-offerings`.
#
# WHAT MAKES THIS PROGRAM'S REQUIREMENT SHAPE DIFFERENT FROM CS/ME: the
# crawl itself organizes the 66-credit nursing core into three named,
# sequential blocks — "Nursing Courses Level I/II/III" — which is a much
# stricter, cohort-style lockstep than any elective-driven CS/ME sequencing:
# a real BSN student cannot get ahead by "front-loading" Level II courses the
# way a CS student can front-load AI electives once CS 25100 clears, because
# every Level II course gates on Level I as a block, not course-by-course.
# This fixture models that as each level's anchor courses requiring the
# level below's own anchor courses — an approximation, not a crawled edge,
# same status as every other prereq in this file.
#
# The health-sciences chemistry sequence (CHM 11100/11200) is also its own,
# different track from Ag/ME's CHM 11510/11610 or CS's none at all — real,
# from this program's own crawled "Science Courses" group.
# =============================================================================

program:
  name: "Nursing, BSN"
  slug: "hhs"
  # Real, crawled Postgres program this fixture's scenarios were written against —
  # Mode B/C read this program's live catalog via `harness/real_db.py`, same source
  # `mechanical_engineering.yaml`'s own header describes. Selected by `run.py`'s
  # `--major`/multi-school loop, not a live DB text search — see `run.py resolve_major`.
  real_db_program_id: "9f93a1d6-762f-47bd-aed2-48c94daaf554"
  # SCOPE, added 2026-08-09 — Mode B/C now measure ONLY this program's own major-scope
  # requirement groups (real_db._scope_for == "program"); college/university-scoped groups
  # (gen-ed, First-Year Engineering, ...) are dropped from what the model is shown and
  # scored against, tested standalone instead by their own pseudo-major fixture — see
  # engineering_core.yaml / agriculture_core.yaml / gen_ed_world_language.yaml and
  # real_db.fetch_real_db_base's `scope_filter` docstring. "" (absent) = unfiltered, the
  # old/default behaviour every fixture had before this field existed.
  requirement_scope: "major"
  catalog_year: "2026-2027"
  campus: "West Lafayette"
  total_credits_min: 120
  verified: false
  major_subject: "NUR"
  # 3/5, not CS MI's 2/3 default — raised after `run.py check`-equivalent reachability testing
  # showed the 19-course, three-level NUR sequence spilling a 9th semester past the fixture's
  # 8-semester horizon at a tighter cap: the last Level III wave (NUR 31901/41001/41401/41501/
  # 41701, all five eligible the same term once Level II's anchors clear) kept losing the last
  # cap slot to earlier courses and pushing the capstone off the end of the horizon. NUR
  # courses are credit-heavy but modest per-course (1-6cr), so 5 in one term is a genuinely
  # heavy but real nursing-heavy semester, not a loophole — max_credits_per_semester still caps
  # the total.
  preferred_major_courses_per_semester: 3
  max_major_courses_per_semester: 5
  # null since 2026-08-12: no fixed per-semester aim. The planner derives
  # ceil(credits still to place / semesters still available), clamped by the cap, so the
  # requirements finish spread evenly instead of every term reaching for the same number.
  # See cs_machine_intelligence.yaml for the measurement behind it.
  target_credits_per_semester: null
  hard_credit_cap: 18


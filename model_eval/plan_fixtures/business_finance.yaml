# =============================================================================
# PLAN-OF-STUDY GROUND TRUTH — Finance, BS (Mitch Daniels School of Business)
#
#   verified: false     <-- READ THIS BEFORE QUOTING ANY NUMBER FROM A RUN
#
# PROVENANCE — REAL, from the crawled catalog Postgres (rewritten 2026-08-08;
# the first version of this file guessed a "MGMT"-prefixed course list that
# does not exist in the real catalog — Daniels School courses are split across
# ACCT/DSB/ECON/FIN/MIS/MKTG/OBHR/SCOM/STRT/QM). Queried from program
# c1e3bffd-f4e1-46fd-8f63-8293f6ed865f ("Finance, BS"), same catalog year as
# `agriculture_animal_sciences.yaml`. Same caveats as every fixture in this
# directory: prereqs are hand-written (Acalog publishes none), offered_terms
# are hand-written guesses, not run through `refresh-offerings`.
#
# WHAT MAKES THIS PROGRAM'S REQUIREMENT SHAPE DIFFERENT FROM CS/ME:
#   - A BROAD CROSS-FUNCTIONAL CORE before the concentration even starts —
#     accounting, econ, MIS, marketing, law, OB, ops, and strategy are all
#     required regardless of concentration. Real, from the crawled "Required
#     Major Courses (54 credits)" group.
#   - That same crawled group embeds FOUR small "pick one" clusters (an AI
#     course, a "data tools" course, a business-writing course, an
#     intermediate-accounting course) with no sub-group markup at all — the
#     crawl lists all options flat with `is_selective_option: false`. Modeled
#     here with `equivalent_to`, same mechanism `cs_machine_intelligence.yaml`
#     uses for MA 16100/MA 16500: one option anchors the requirement, the
#     others count as the same thing. Which option anchors vs. which is the
#     "alternate" is an editorial call, not a crawled fact.
#   - A CAPSTONE with THREE converging prereq roots (marketing + finance +
#     operations) rather than one deep chain — a different sequencing shape
#     than CS 25200 or ME 46300's single long chain.
#   - Its own math track, MA 16010 "Applied Calculus I" — same lighter track
#     `agriculture_animal_sciences.yaml` uses, real for this program too.
# =============================================================================

program:
  name: "Finance, BS"
  slug: "business"
  # Real, crawled Postgres program this fixture's scenarios were written against —
  # Mode B/C read this program's live catalog via `harness/real_db.py`, same source
  # `mechanical_engineering.yaml`'s own header describes. Selected by `run.py`'s
  # `--major`/multi-school loop, not a live DB text search — see `run.py resolve_major`.
  real_db_program_id: "c1e3bffd-f4e1-46fd-8f63-8293f6ed865f"
  # SCOPE, added 2026-08-09 — Mode B/C now measure ONLY this program's own major-scope
  # requirement groups (real_db._scope_for == "program"); college/university-scoped groups
  # (gen-ed, First-Year Engineering, ...) are dropped from what the model is shown and
  # scored against, tested standalone instead by their own pseudo-major fixture — see
  # engineering_core.yaml / agriculture_core.yaml / gen_ed_world_language.yaml and
  # real_db.fetch_real_db_base's `scope_filter` docstring. "" (absent) = unfiltered, the
  # old/default behaviour every fixture had before this field existed.
  requirement_scope: "major"
  catalog_year: "2026-2027"
  campus: "West Lafayette"
  total_credits_min: 120
  verified: false
  major_subject: "FIN"
  preferred_major_courses_per_semester: 3
  max_major_courses_per_semester: 4
  # null since 2026-08-12: no fixed per-semester aim. The planner derives
  # ceil(credits still to place / semesters still available), clamped by the cap, so the
  # requirements finish spread evenly instead of every term reaching for the same number.
  # See cs_machine_intelligence.yaml for the measurement behind it.
  target_credits_per_semester: null
  hard_credit_cap: 18


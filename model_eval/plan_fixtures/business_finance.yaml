# --- degree requirements -----------------------------------------------------
requirement_groups:
  - id: business-core
    name: "Business Core (all Daniels School concentrations)"
    kind: all
    courses: ["ACCT 20000", "ACCT 20100", "DSB 25500", "DSB 29500", "ECON 25100",
              "ECON 25200", "FIN 25300", "FIN 31000", "MIS 38200", "MKTG 32400",
              "OBHR 33000", "SCOM 36100", "STRT 25400", "STRT 35200", "QM 30500",
              "ECON 36000", "FIN 25800", "FIN 24500", "ENGL 42000", "ACCT 35000"]

  - id: finance-required
    name: "Finance Concentration — required"
    kind: all
    courses: ["FIN 41100", "FIN 41300", "FIN 41310"]

  - id: finance-elective
    name: "Finance Concentration — selectives"
    kind: choose
    choose_credits: 12
    courses: ["FIN 39000", "FIN 41150", "FIN 41200", "FIN 41220", "FIN 41250",
              "FIN 41350", "FIN 41500", "FIN 41601", "FIN 41650", "FIN 43800", "FIN 43900"]

  - id: mathematics
    name: "Mathematics"
    kind: all
    courses: ["MA 16010"]

  - id: gen-ed-core
    name: "University Core — written and oral communication"
    kind: all
    courses: ["ENGL 10600", "COM 11400"]

  - id: gen-ed-selective
    name: "University Core selectives, standing in for the College's own Cultural Competency Selective"
    kind: choose
    choose_credits: 6
    courses: ["PSY 12000", "SOC 10000", "HIST 10300", "PHIL 15000"]

# --- scenarios ---------------------------------------------------------------
scenarios:
  - id: fin-fresh-start
    label: "Incoming Finance major, nothing completed"
    profile:
      name: "Avery"
      degree_program: "Finance, BS"
      completed_courses: []
      start_term: fall
      start_year: 2026
      semesters_to_plan: 8
      max_credits_per_semester: 16
    feedback: >-
      I'm starting from scratch in finance and I want to get into the actual
      finance courses as early as the prerequisites allow, not just the
      general business core the whole time.
    assertions:
      - kind: scheduled_before
        course: "FIN 31000"
        semester_index: 5
        why: "FIN 31000 gates every 41xxx finance course; deferring it past the midpoint stalls the whole concentration."
      - kind: max_credits_at_most
        value: 16
    world_language:
      subject: FR
      level: 1

  - id: fin-sophomore-catchup
    label: "Second-year student who just declared Finance"
    profile:
      name: "Jordan"
      degree_program: "Finance, BS"
      completed_courses: ["ACCT 20000", "MA 16010", "ENGL 10600", "COM 11400", "ECON 25100"]
      start_term: fall
      start_year: 2026
      semesters_to_plan: 6
      max_credits_per_semester: 16
    feedback: >-
      I just declared finance after a year of undecided business and I have
      three years left. I want the core on track so the finance electives
      aren't blocked, and please don't stack two accounting courses back to
      back.
    assertions:
      - kind: scheduled_before
        course: "ACCT 20100"
        semester_index: 3
        why: "ACCT 20100 gates Intermediate Accounting and is a slow-moving prereq root; a late start cascades."
      - kind: max_credits_at_most
        value: 16
    world_language:
      subject: GER
      level: 2

  - id: fin-light-load
    label: "Finance student who needs a reduced credit load"
    profile:
      name: "Sam"
      degree_program: "Finance, BS"
      completed_courses: ["MA 16010", "ENGL 10600"]
      start_term: fall
      start_year: 2026
      semesters_to_plan: 8
      max_credits_per_semester: 15
    feedback: >-
      I'm working a part-time internship at a credit union this year, so
      please cap me at 12 credits a semester.
    assertions:
      - kind: max_credits_at_most
        value: 12
        why: "The student named an explicit cap; honouring it is the whole ask."
      - kind: proposal_sets_credit_cap
        value: 12
    world_language:
      subject: SPAN
      level: 3

  - id: fin-spring-start
    label: "Spring-start transfer student"
    profile:
      name: "Devin"
      degree_program: "Finance, BS"
      completed_courses: ["MA 16010", "ENGL 10600", "COM 11400", "PSY 12000",
                          "PHIL 15000", "HIST 10300"]
      start_term: spring
      start_year: 2027
      semesters_to_plan: 8
      max_credits_per_semester: 16
    feedback: >-
      I transferred in with my math and gen-ed credits done and I'm starting
      in the spring. Get me through the business core and into finance.
    notes: >-
      A spring start shifts every fall-only course (FIN 41150 among them) by
      one position. Models that assume a canonical fall-start sequence collect
      term violations here.
    assertions:
      - kind: scheduled_before
        course: "ACCT 20000"
        semester_index: 2
      - kind: max_credits_at_most
        value: 16
    world_language:
      subject: JPNS
      level: 3

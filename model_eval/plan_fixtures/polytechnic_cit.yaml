# --- scenarios ---------------------------------------------------------------
scenarios:
  - id: cit-fresh-start
    label: "Incoming CIT major, nothing completed"
    profile:
      name: "Avery"
      degree_program: "Computer and Information Technology, BS"
      completed_courses: []
      start_term: fall
      start_year: 2026
      semesters_to_plan: 8
      max_credits_per_semester: 16
    feedback: >-
      I'm starting from scratch in computer and information technology and I
      want to get into the systems and networking courses as early as the
      prerequisites allow.
    assertions:
      - kind: scheduled_before
        course: "CNIT 17600"
        semester_index: 3
        why: "CNIT 17600 gates system administration, cybersecurity, and networking; deferring it stalls most of the core."
      - kind: max_credits_at_most
        value: 16
    world_language:
      subject: FR
      level: 1

  - id: cit-sophomore-catchup
    label: "Second-year student who just declared CIT"
    profile:
      name: "Jordan"
      degree_program: "Computer and Information Technology, BS"
      completed_courses: ["CNIT 10500", "MA 16010", "ENGL 10600", "COM 11400"]
      start_term: fall
      start_year: 2026
      semesters_to_plan: 6
      max_credits_per_semester: 16
    feedback: >-
      I just declared CIT after a year of exploratory studies and I have
      three years left. I want the database and networking core on track so
      the upper-level courses aren't blocked, and please don't stack two
      project-heavy courses in the same semester.
    assertions:
      - kind: scheduled_before
        course: "CNIT 27200"
        semester_index: 3
        why: "CNIT 27200 gates the entire database track; a late start narrows every later semester's options."
      - kind: max_credits_at_most
        value: 16
    world_language:
      subject: GER
      level: 2

  - id: cit-light-load
    label: "CIT student who needs a reduced credit load"
    profile:
      name: "Sam"
      degree_program: "Computer and Information Technology, BS"
      completed_courses: ["CNIT 10500", "MA 16010", "ENGL 10600"]
      start_term: fall
      start_year: 2026
      semesters_to_plan: 8
      max_credits_per_semester: 15
    feedback: >-
      I'm working a part-time IT help-desk job this year, so please cap me
      at 12 credits a semester.
    assertions:
      - kind: max_credits_at_most
        value: 12
        why: "The student named an explicit cap; honouring it is the whole ask."
      - kind: proposal_sets_credit_cap
        value: 12
    world_language:
      subject: SPAN
      level: 3

  - id: cit-spring-start
    label: "Spring-start transfer student"
    profile:
      name: "Devin"
      degree_program: "Computer and Information Technology, BS"
      completed_courses: ["MA 16010", "ENGL 10600", "COM 11400", "PSY 12000",
                          "HIST 10300"]
      start_term: spring
      start_year: 2027
      semesters_to_plan: 8
      max_credits_per_semester: 16
    feedback: >-
      I transferred in with my math and gen-ed credits done and I'm starting
      in the spring. Get me through the CIT core and into the database and
      networking tracks.
    notes: >-
      A spring start shifts sequencing built around a fall-start core chain.
      Models that assume every prerequisite clears at the same pace
      regardless of start term collect violations here.
    assertions:
      - kind: scheduled_before
        course: "CNIT 10500"
        semester_index: 2
      - kind: max_credits_at_most
        value: 16
    world_language:
      subject: JPNS
      level: 3

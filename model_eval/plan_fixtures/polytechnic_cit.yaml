# =============================================================================
# PLAN-OF-STUDY GROUND TRUTH — Computer And Information Technology, BS
# (Purdue Polytechnic Institute)
#
#   verified: false     <-- READ THIS BEFORE QUOTING ANY NUMBER FROM A RUN
#
# PROVENANCE — REAL, from the crawled catalog Postgres, same source and
# method as the other rewritten fixtures in this directory. Queried from
# program e110f64d-8580-4b24-b7af-800fb4eddfbd ("Computer and Information
# Technology, BS"), catalog year 6f29fb29-07a2-426c-8b94-543c353843bf. Same
# caveats as every fixture in this directory: prereqs are hand-written
# (Acalog publishes none), offered_terms are hand-written guesses, not run
# through `refresh-offerings`.
#
# WHAT MAKES THIS PROGRAM'S REQUIREMENT SHAPE DIFFERENT FROM CS: CIT and
# Computer Science share a campus and a subject-matter neighborhood but are
# different colleges with a genuinely different course list — CNIT/CGT
# prefixes, not CS, apart from one real embedded choice (CIT's own
# intro-programming requirement can be satisfied by CS 15900, CS 17700, or
# CS 18000 alongside the CNIT-native options — real, from the crawl, modeled
# here as a `cit-intro-programming` choose group, not `equivalent_to`: unlike
# MA 16100/MA 16500 in `cs_machine_intelligence.yaml`, these five options
# aren't substitutes for one designated primary, they're a genuine five-way
# selective). Two more real, distinctive pieces:
#   - "AI Fundamentals: Literacy, Applications And Responsible Use" (CNIT
#     11000) is a required 1-credit FIRST course, not an elective add-on —
#     real, and unlike anything in CS MI or ME.
#   - The "Other Departmental" layer includes Purdue's real TDM "Corporate
#     Partners" sequence (TDM 11100 through 41200) — an actual paid,
#     multi-year industry-partnership program specific to Polytechnic/Data
#     Mine students. NOT modeled as a requirement here (it crawled as one
#     option among many electives, not a mandatory sequence for this major),
#     but flagged because a model that has memorized "Data Mine" content from
#     training data may over-schedule it.
# =============================================================================


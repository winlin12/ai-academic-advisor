# =============================================================================
# PLAN-OF-STUDY GROUND TRUTH — Agricultural Economics: Quantitative Data
# Analytics Concentration, BS (College of Agriculture)
#
#   verified: false     <-- READ THIS BEFORE QUOTING ANY NUMBER FROM A RUN
#
# PROVENANCE — REAL, same source and method as the rest of this directory
# (crawled catalog Postgres, program 1c28851f-0ca6-45a6-9b01-a91612842f96
# "Agricultural Economics: Quantitative Data Analytics Concentration, BS",
# catalog year 6f29fb29-07a2-426c-8b94-543c353843bf). This is the College of
# Agriculture's SECOND fixture, alongside `agriculture_animal_sciences.yaml`
# — same college-wide layer (see that file's header), a quant/business-flavor
# major instead of a pre-med/bio one. Same caveats as every fixture here:
# prereqs hand-written (Acalog publishes none), offered_terms hand-written
# guesses.
#
# WHAT MAKES THIS PROGRAM'S REQUIREMENT SHAPE DIFFERENT: the concentration's
# own required block again embeds an economics-selective sub-choice exactly
# like `agriculture_animal_sciences.yaml`'s own "Required Major Courses"
# does (crawled flat, no sub-group markup — see that file's header for the
# same pattern), and adds a REAL Data Mine "Corporate Partners"
# (TDM-prefixed) option inside its OWN concentration coursework, not just as
# an outside elective the way `polytechnic_cit.yaml`'s header flags it. The
# "AGEC Departmental Selectives (14 credits)" group crawled with ZERO option
# rows — prose-only — left unmodeled rather than invented.
# =============================================================================

program:
  name: "Agricultural Economics: Quantitative Data Analytics Concentration, BS"
  slug: "agecon"
  real_db_program_id: "1c28851f-0ca6-45a6-9b01-a91612842f96"
  # SCOPE, added 2026-08-09 — Mode B/C now measure ONLY this program's own major-scope
  # requirement groups (real_db._scope_for == "program"); college/university-scoped groups
  # (gen-ed, First-Year Engineering, ...) are dropped from what the model is shown and
  # scored against, tested standalone instead by their own pseudo-major fixture — see
  # engineering_core.yaml / agriculture_core.yaml / gen_ed_world_language.yaml and
  # real_db.fetch_real_db_base's `scope_filter` docstring. "" (absent) = unfiltered, the
  # old/default behaviour every fixture had before this field existed.
  requirement_scope: "major"
  catalog_year: "2026-2027"
  campus: "West Lafayette"
  total_credits_min: 120
  verified: false
  major_subject: "AGEC"
  preferred_major_courses_per_semester: 3
  max_major_courses_per_semester: 4
  # null since 2026-08-12: no fixed per-semester aim. The planner derives
  # ceil(credits still to place / semesters still available), clamped by the cap, so the
  # requirements finish spread evenly instead of every term reaching for the same number.
  # See cs_machine_intelligence.yaml for the measurement behind it.
  target_credits_per_semester: null
  hard_credit_cap: 18


# --- degree requirements -----------------------------------------------------
requirement_groups:
  - id: agec-core
    name: "Agricultural Economics — Required Major Courses"
    kind: all
    courses: ["AGEC 20201", "AGEC 29800", "AGEC 30300"]

  - id: economics-selective
    name: "Economics Selective (choose one)"
    kind: choose
    choose_credits: 3
    courses: ["AGEC 20300", "AGEC 20400", "AGEC 21700", "ECON 21000", "ECON 25100", "ECON 25200"]

  - id: agec-quant
    name: "Quantitative Data Analytics Concentration — required"
    kind: all
    courses: ["AGEC 32700", "AGEC 35200", "AGEC 45100", "AGEC 42900"]

  - id: agec-quant-elective
    name: "Quantitative Data Analytics Concentration — electives"
    kind: choose
    choose_credits: 8
    courses: ["AGEC 37500", "TDM 10100", "TDM 10200", "TDM 41100", "TDM 41200"]

  - id: mathematics
    name: "Mathematics"
    kind: all
    courses: ["MA 16010"]

  - id: gen-ed-core
    name: "University Core — written and oral communication"
    kind: all
    courses: ["ENGL 10800", "COM 11400"]

  - id: gen-ed-selective
    name: "University Core — additional selectives"
    kind: choose
    choose_credits: 6
    courses: ["PHIL 15000", "PSY 12000"]

# --- scenarios ---------------------------------------------------------------
scenarios:
  - id: agecon-fresh-start
    label: "Incoming Agricultural Economics major, nothing completed"
    profile:
      name: "Avery"
      degree_program: "Agricultural Economics: Quantitative Data Analytics Concentration, BS"
      completed_courses: []
      start_term: fall
      start_year: 2026
      semesters_to_plan: 8
      max_credits_per_semester: 17
    feedback: >-
      I'm starting from scratch in agricultural economics and I want to get
      into the quantitative analytics courses as early as the prerequisites
      allow.
    assertions:
      - kind: scheduled_before
        course: "AGEC 30300"
        semester_index: 4
        why: "AGEC 30300 gates the entire quant concentration; deferring it past the midpoint stalls the whole major."
      - kind: max_credits_at_most
        value: 17
    world_language:
      subject: SPAN
      level: 1

  - id: agecon-sophomore-catchup
    label: "Second-year student who just declared Agricultural Economics"
    profile:
      name: "Jordan"
      degree_program: "Agricultural Economics: Quantitative Data Analytics Concentration, BS"
      completed_courses: ["AGEC 20201", "MA 16010", "ENGL 10800", "COM 11400", "ECON 25100"]
      start_term: fall
      start_year: 2026
      semesters_to_plan: 6
      max_credits_per_semester: 16
    feedback: >-
      I just declared agricultural economics after a year of exploratory
      studies and I have three years left. I want the quant core on track,
      and please don't stack two project-heavy courses in the same semester.
    assertions:
      - kind: scheduled_before
        course: "AGEC 30300"
        semester_index: 2
        why: "AGEC 30300 gates AGEC 32700/35200 and the rest of the quant concentration; a late start cascades."
      - kind: max_credits_at_most
        value: 16
    world_language:
      subject: GER
      level: 2

  - id: agecon-light-load
    label: "Agricultural Economics student who needs a reduced credit load"
    profile:
      name: "Sam"
      degree_program: "Agricultural Economics: Quantitative Data Analytics Concentration, BS"
      completed_courses: ["AGEC 20201", "MA 16010", "ENGL 10800"]
      start_term: fall
      start_year: 2026
      semesters_to_plan: 8
      max_credits_per_semester: 15
    feedback: >-
      I'm working a part-time data-analyst internship this year, so please
      cap me at 12 credits a semester.
    assertions:
      - kind: max_credits_at_most
        value: 12
        why: "The student named an explicit cap; honouring it is the whole ask."
      - kind: proposal_sets_credit_cap
        value: 12
    world_language:
      subject: FR
      level: 1

  - id: agecon-spring-start
    label: "Spring-start transfer student"
    profile:
      name: "Devin"
      degree_program: "Agricultural Economics: Quantitative Data Analytics Concentration, BS"
      completed_courses: ["MA 16010", "ENGL 10800", "COM 11400", "PSY 12000", "PHIL 15000"]
      start_term: spring
      start_year: 2027
      semesters_to_plan: 8
      max_credits_per_semester: 16
    feedback: >-
      I transferred in with my math and gen-ed credits done and I'm starting
      in the spring. Get me through the core and into the quant concentration.
    notes: >-
      A spring start shifts sequencing built around a fall-start core chain.
      Models that assume every prerequisite clears at the same pace
      regardless of start term collect violations here.
    assertions:
      - kind: scheduled_before
        course: "AGEC 20201"
        semester_index: 2
      - kind: max_credits_at_most
        value: 16
    world_language:
      subject: JPNS
      level: 3

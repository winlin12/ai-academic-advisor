    # unmet. Same class of bug `liberal_arts_communication.yaml`'s COM 35300 fix documents.
    # The schema has no way to express "any economics-selective option satisfies this," so the
    # prereq is dropped rather than pinned to one option that might not be scheduled.
    prereqs: []

# --- scenarios ---------------------------------------------------------------
scenarios:
  - id: construction-fresh-start
    label: "Incoming Construction Management major, nothing completed"
    profile:
      name: "Avery"
      degree_program: "Construction Management, BS"
      completed_courses: []
      start_term: fall
      start_year: 2026
      semesters_to_plan: 8
      max_credits_per_semester: 17
    feedback: >-
      I'm starting from scratch in construction management and I want to
      get into the field-operations and jobsite-management courses as early
      as the prerequisites allow.
    assertions:
      - kind: scheduled_before
        course: "CM 15000"
        semester_index: 3
        why: "CM 15000 gates most of the rest of the major core; deferring it stalls the whole sequence."
      - kind: max_credits_at_most
        value: 17
    world_language:
      subject: SPAN
      level: 1

  - id: construction-sophomore-catchup
    label: "Second-year student who just declared Construction Management"
    profile:
      name: "Jordan"
      degree_program: "Construction Management, BS"
      completed_courses: ["CM 10000", "MA 16010", "ENGL 10600", "COM 11400"]
      start_term: fall
      start_year: 2026
      semesters_to_plan: 6
      max_credits_per_semester: 16
    feedback: >-
      I just declared construction management after a year of exploratory
      studies and I have three years left. I want estimating and scheduling
      on track since it gates jobsite management and the capstone, and
      please don't stack two lab-heavy courses in the same semester.
    assertions:
      - kind: scheduled_before
        course: "CM 20002"
        semester_index: 3
        why: "CM 20002 gates CM 30002, which itself gates jobsite management and the capstone; a late start cascades."
      - kind: max_credits_at_most
        value: 16
    world_language:
      subject: GER
      level: 2

  - id: construction-light-load
    label: "Construction Management student who needs a reduced credit load"
    profile:
      name: "Sam"
      degree_program: "Construction Management, BS"
      completed_courses: ["CM 10000", "MA 16010", "ENGL 10600"]
      start_term: fall
      start_year: 2026
      semesters_to_plan: 8
      max_credits_per_semester: 15
    feedback: >-
      I'm working a part-time job on a local job site this year, so please
      cap me at 12 credits a semester.
    assertions:
      - kind: max_credits_at_most
        value: 12
        why: "The student named an explicit cap; honouring it is the whole ask."
      - kind: proposal_sets_credit_cap
        value: 12
    world_language:
      subject: FR
      level: 1

  - id: construction-spring-start
    label: "Spring-start transfer student"
    profile:
      name: "Devin"
      degree_program: "Construction Management, BS"
      completed_courses: ["MA 16010", "ENGL 10600", "COM 11400", "PSY 12000", "HIST 10300"]
      start_term: spring
      start_year: 2027
      semesters_to_plan: 8
      max_credits_per_semester: 16
    feedback: >-
      I transferred in with my math and gen-ed credits done and I'm starting
      in the spring. Get me through the construction management core.
    notes: >-
      A spring start shifts sequencing built around a fall-start core chain.
      Models that assume every prerequisite clears at the same pace
      regardless of start term collect violations here.
    assertions:
      - kind: scheduled_before
        course: "CM 10000"
        semester_index: 2
      - kind: max_credits_at_most
        value: 16
    world_language:
      subject: JPNS
      level: 3

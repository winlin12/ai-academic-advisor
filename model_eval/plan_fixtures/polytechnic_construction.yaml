# Polytechnic Institute)
#
#   verified: false     <-- READ THIS BEFORE QUOTING ANY NUMBER FROM A RUN
#
# PROVENANCE — REAL, same source and method as the rest of this directory
# (crawled catalog Postgres, program 27bf0dad-014d-410e-9d66-1205fc1e9174
# "Construction Management, BS", catalog year
# 6f29fb29-07a2-426c-8b94-543c353843bf). This is Polytechnic's SECOND
# fixture, alongside `polytechnic_cit.yaml` — same college, an entirely
# different, hands-on-trades-adjacent course list (CM-prefixed, not CNIT/CGT)
# next to CIT's software/IT-systems track. This is NOT "Construction
# Engineering" (BSCNE, a real, separate College of Engineering program in
# the same crawl) — same-sounding name, different college, different course
# list; do not conflate the two.
#
# WHAT MAKES THIS PROGRAM'S REQUIREMENT SHAPE DIFFERENT: the "Departmental/
# Program Major Courses (65-66 credits)" group crawled as one FLAT list of 19
# real courses with NO sub-group markup at all — modeled here as a single
# `kind: all` block, same simplification `mechanical_engineering.yaml` and
# `education_elementary.yaml` make for their own single unbroken required
# lists. It sums to 62 credits here (documented gap, not fully modeled, same
# status as this directory's other under-modeled totals). The 6-credit
# CM 40000 "Construction Capstone" is real and, at 6 credits, the single
# heaviest course in this entire directory except Nursing's clinical courses.
# =============================================================================

program:

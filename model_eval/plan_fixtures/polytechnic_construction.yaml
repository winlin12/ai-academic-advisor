              "CM 21500", "CM 21601", "CM 27000", "CM 30002", "CM 30101", "CM 31000",
              "CM 36400", "CM 36500", "CM 38000", "CM 40000", "CM 43300", "CM 45001",
              "CM 47500", "CM 45701"]

  - id: mathematics
    name: "Mathematics"
    kind: all
    courses: ["MA 16010"]

  - id: gen-ed-core
    name: "University Core — written and oral communication"
    kind: all

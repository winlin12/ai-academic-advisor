# --- degree requirements -----------------------------------------------------
# `kind: all`    -> every listed course must appear in the plan (or be completed)
# `kind: choose` -> enough listed courses to reach `choose_credits`

requirement_groups:
  # =============================================================================================
  # PART 1 — FIRST-YEAR ENGINEERING (FYE). College of Engineering-wide, not ME-specific: every
  # engineering major (ME, EE, CE, ...) clears this before/while T2M-ing into their major. Purdue
  # publishes it as 8 numbered requirements; ME's own "Other Course Requirements (14-15 credits)"
  # group re-lists the same courses because T2M folds FYE straight into the major's own audit —
  # there is no second, ME-specific version of these courses. Acalog states FYE must be completed
  # in the first year; this fixture does NOT enforce that as a scored deadline (see header).
  # =============================================================================================
  - id: fye-intro-engineering
    name: "First-Year Engineering — Intro to Engineering I & II"
    kind: all
    courses: ["ENGR 13100", "ENGR 13200"]

  - id: fye-chemistry-i
    name: "First-Year Engineering — General Chemistry I With Laboratory"
    kind: all
    courses: ["CHM 11510", "CHM 11520"]

  - id: fye-calculus
    name: "First-Year Engineering — Calculus I And II"
    kind: all
    courses: ["MA 16100", "MA 16200"]

  - id: fye-selective
    name: "First-Year Engineering Selective"
    kind: choose
    # 2026-08-07: replaces the old `chemistry`-group CHM 11610/11620 mandate and the old
    # standalone `intro-programming` CS 15900 mandate — see header's "FYE + Engineering Gen Ed
    # fix" note for why both were wrong. Real Acalog choice: ONE of General Chemistry II (CHM
    # 11610 + its lab), C Programming, Fundamentals of Biology I, or Fundamentals of Biology II,
    # 3-4cr; `choose_credits: 3` is the floor of that range, same convention `gen-ed-selective`
    # below uses for its own 21-credit target.
    choose_credits: 3
    courses: ["CS 15900", "CHM 11610", "CHM 11620", "BIOL 11000", "BIOL 11100"]

  - id: fye-cad-modeling
    name: "First-Year Engineering — CAD / Geometric Modeling"
    kind: all
    courses: ["ME 16400"]

  # =============================================================================================
  # PART 2 — MECHANICAL ENGINEERING MAJOR REQUIREMENTS (post-T2M). ME-specific from here on.
  # =============================================================================================
  - id: me-major-core
    name: "Mechanical Engineering Major Requirements"
    kind: all
    # ORDER MATTERS — same greedy-picker caveat `cs_machine_intelligence.yaml` documents on
    # `cs-elective`. `select_remaining_courses`/`generate_plan` fill each semester from this
    # list in order with no prereq lookahead, so a deep prerequisite root listed LATE starves
    # itself: PHYS 17200 has no prereqs of its own but gates ME 20000, ME 27000, PHYS 24100,
    # and (transitively) everything past them. Listed last, it lost the credit-cap race to
    # zero-prereq courses ranked ahead of it for three straight semesters before finding room —
    # `run.py check` caught every scenario NOT VIABLE on ME 37500/ME 46300 falling off the
    # 8-semester horizon until this list was reordered close to a topological sort.
    courses: ["PHYS 17200", "ME 27000", "ME 27400", "PHYS 24100", "MA 26100", "MA 26500",
              "MA 26600", "ECE 20001", "ECE 20007", "ME 36500", "ME 37500", "ME 20000",
              "ME 26400", "ME 23900", "MSE 23000", "ME 29000", "ME 30800", "ME 30801",
              "ME 32300", "ME 32301", "ME 31500", "ME 35400", "ME 36400", "ME 46300"]

  - id: me-economics-selective
    name: "Economics Selective"
    kind: choose
    # REAL: "Economics Selective - Credit Hours: 3.00" in the crawled "Other Course Requirements"
    # group (see header's 2026-08-07 note) — ECON 25100 or 25200, mandatory, previously unmodeled.
    choose_credits: 3
    courses: ["ECON 25100", "ECON 25200"]

  # "Engineering General Education Requirements (21 credits)" in Acalog — these two groups
  # together ARE that requirement (7cr + 14cr = 21), just under this fixture's own, clearer
  # group names rather than Acalog's generic "General Education I-V". See header's 2026-08-07
  # note for the sub-rules (non-introductory credit floor, Liberal-Arts/Daniels/Honors floor,
  # no-double-counting) this schema cannot express and therefore does not enforce.
  - id: engineering-gen-ed-comm
    name: "Engineering General Education — written and oral communication"
    kind: all
    courses: ["ENGL 10600", "COM 11400"]

  - id: engineering-gen-ed-selective
    name: "Engineering General Education — General Education I-V"
    kind: choose
    choose_credits: 14
    courses: ["PHIL 15000", "PSY 12000", "HIST 10300", "PHIL 11000",
              "POL 10100", "SOC 10000", "ANTH 10000"]

  - id: me-technical-electives
    name: "Mechanical Engineering Technical Electives"
    kind: choose
    choose_credits: 9
    # ORDER MATTERS, same rule and same reason as `cs_machine_intelligence.yaml`'s
    # `cs-elective` group: the greedy picker takes the first `choose_credits` worth in list
    # order for the deterministic baseline, with no lookahead into `offered_terms`. The
    # fall+spring options lead so that pick is two single-term courses (ME 34600 fall-only,
    # ME 41300 spring-only) short of the reachability `run.py check` caught — each only gets
    # one shot per year, and by the last one available every scenario's horizon had already
    # spent that term's room on something else.
    courses: ["ME 36300", "ME 41400", "ME 41500", "ME 45900", "ME 47500",
              "ME 34600", "ME 41300", "ME 43000", "ME 44000", "ME 48900"]

# --- scenarios ---------------------------------------------------------------
# Each scenario is one (profile, ask) pair run against every model, N times.
# See `cs_machine_intelligence.yaml`'s header for what `feedback`/`assertions`
# drive in Mode A vs Mode B.

scenarios:
  - id: me-fresh-start
    label: "Incoming ME major, nothing completed"
    profile:
      name: "Avery"
      degree_program: "Mechanical Engineering, BS"
      completed_courses: []
      start_term: fall
      start_year: 2026
      semesters_to_plan: 8
      # WAS 16 — raised to 17 on 2026-08-07 (still under the program's own `hard_credit_cap: 18`)
      # after adding `me-economics-selective` and fixing `fye-selective` pushed this scenario's
      # true requirement total to 123 credits over 8 semesters. At a 16cr cap (128 capacity) the
      # deterministic planner's own spread-then-pack scheduling — not a genuine degree-total
      # shortfall — stranded 3cr of `me-technical-electives` with nowhere left to go; 17cr
      # (136 capacity) is confirmed VIABLE (`run.py check`). A from-scratch, nothing-completed
      # student needing an occasional 17-credit semester across a full 8-semester ME degree is
      # realistic, not a fixture crutch.
      max_credits_per_semester: 17
    feedback: >-
      I'm starting from scratch in mechanical engineering and I want to get into
      the hands-on design and manufacturing side of the major as early as the
      prerequisites allow.
    assertions:
      - kind: scheduled_before
        course: "ME 26400"
        semester_index: 4
        why: "ME 26400 has almost no prereq chain (just ME 16400); deferring it past the midpoint isn't sequencing, it's neglecting the ask."
      - kind: max_credits_at_most
        value: 17
    world_language:
      subject: FR
      level: 1

  - id: me-sophomore-catchup
    label: "Second-year student who just declared ME"
    profile:
      name: "Jordan"
      degree_program: "Mechanical Engineering, BS"
      completed_courses: ["ENGR 13100", "ENGR 13200", "CHM 11510", "CHM 11520",
                          "CHM 11610", "CHM 11620", "MA 16100", "MA 16200",
                          "ENGL 10600", "COM 11400", "PHYS 17200", "MA 26600"]
      start_term: fall
      start_year: 2026
      semesters_to_plan: 6
      max_credits_per_semester: 16
    feedback: >-
      I just declared mechanical engineering after a year of general engineering
      and I have three years left. I want the major core on track so the
      technical electives aren't blocked, and please don't stack two lab courses
      in the same semester.
    assertions:
      - kind: scheduled_before
        course: "ME 27000"
        semester_index: 2
        why: "Statics gates Dynamics, Mechanics of Materials, and everything past them; a late start here cascades into an unfinishable plan."
      - kind: max_credits_at_most
        value: 16
    world_language:
      subject: GER
      level: 2

  - id: me-light-load

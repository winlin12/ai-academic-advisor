# =============================================================================
# PLAN-OF-STUDY GROUND TRUTH — Mechanical Engineering, BS
#
#   verified: false     <-- READ THIS BEFORE QUOTING ANY NUMBER FROM A RUN
#
# This file is the scoring authority for the plan-of-study eval: every viability
# check (prereqs, term offerings, credit caps, requirement coverage) is decided
# against the rows below and nothing else. If a row here is wrong, every model is
# scored wrong in the same direction — which is survivable for RANKING models
# against each other, and fatal for any claim about real Purdue degree progress.
#
# WHY THIS FILE EXISTS: `real_db.py` fixed a bug (2026-08-07) where its
# requirement-classification heuristics — tuned and verified only against
# Computer Science, Machine Intelligence — misread this program's own 24-course
# required core as an elective menu because it spans 5 subjects (ME/ECE/MA/MSE/
# PHYS) and contains one in-line "or" alternate outside `course_aliases`
# (PHYS 24100 or PHYS 27200). That fix makes MODE B (real_db, free-form) usable
# for this major with no fixture at all. This file is the SEPARATE piece that
# was still missing: MODE A's deterministic-planner grounding check, and the
# scenario profiles (student name, completed courses, feedback, assertions)
# that Modes B/C also reuse — see `cs_machine_intelligence.yaml`'s own header
# for why those cannot be read off the crawl.
#
# PROVENANCE, honestly:
#
#   requirement structure ............. The 24-course "Mechanical Engineering
#                                        Major Requirements (61-62 credits)"
#                                        group and the first-year "Other Course
#                                        Requirements (14-15 credits)" group ARE
#                                        real, read from the live
#                                        catalog_ingestion Postgres DB
#                                        (program 8dee47ad-c8c2-499a-9094-
#                                        541c80ebf9c3, "Mechanical Engineering"),
#                                        the same DB Mode B reads. Codes,
#                                        titles, and credits for every course in
#                                        `me-major-core` and `fye-*` below
#                                        were queried, not recalled.
#   `engineering-gen-ed-*` / `me-technical-electives` ... The crawl's own
#                                        "Engineering General Education
#                                        Requirements (21 credits)" and "Other
#                                        Departmental/Program Course
#                                        Requirements (35-36 credits)" groups
#                                        are PROSE ONLY in this crawl — no course
#                                        list at all (n_opts=0; see
#                                        `unresolved_requirement_groups`). The
#                                        21-credit gen-ed target is modeled
#                                        exactly (engineering-gen-ed-comm 7cr +
#                                        engineering-gen-ed-selective 14cr =
#                                        21), reusing `cs_machine_intelligence.
#                                        yaml`'s own gen-ed pool since those ARE
#                                        university-wide UCC courses, not CS-
#                                        specific. `me-technical-electives`'
#                                        course LIST is my own construction —
#                                        the codes/titles/credits themselves are
#                                        real (pulled from `courses` for
#                                        `ME %`, course_number >= 30000), but
#                                        which ones a real ME student would
#                                        choose from, and the 9-credit target,
#                                        are not verified against the crawl.
#                                        The 35-36 credit prose total is NOT
#                                        fully modeled — same simplification
#                                        `cs_machine_intelligence.yaml` makes
#                                        (its own groups sum to ~85 of its
#                                        stated 120 total_credits_min); the
#                                        remainder is unmodeled free-elective
#                                        credit the deterministic planner never
#                                        sees.
#   FYE + Engineering Gen Ed fix (2026-08-07) ... The requirement_groups below were reorganized
#                                        into two parts — FIRST-YEAR ENGINEERING (FYE), the
#                                        College of Engineering-wide gate every ME/EE/CE/... major
#                                        must clear before/while T2M-ing into the major, and the
#                                        ONGOING MECHANICAL ENGINEERING MAJOR REQUIREMENTS that
#                                        follow — see the two `# === PART` banners below. This
#                                        fixed two real bugs, both DB-verified against program
#                                        8dee47ad-c8c2-499a-9094-541c80ebf9c3:
#                                        (1) "First-Year Engineering Selective" (Acalog: CHM
#                                        11610+11620 OR CS 15900 OR BIOL 11000 OR BIOL 11100 —
#                                        pick ONE path, 3-4cr) was modeled as TWO separate
#                                        mandatory `kind: all` groups (`chemistry` required CHM
#                                        11610/11620 outright; a since-removed `intro-programming`
#                                        group required CS 15900 outright) — a student taking any
#                                        real Purdue-legal path other than "do both" would have
#                                        been scored as short a requirement they never needed.
#                                        Fixed by folding all four options into one new `kind:
#                                        choose` group, `fye-selective`. (2) "Economics Selective"
#                                        (ECON 25100 or 25200, 3cr, mandatory) was not modeled as
#                                        its own requirement at all — ECON was just one option
#                                        among many in the generic 14-credit gen-ed pool, so a
#                                        plan could satisfy 100% coverage while never taking
#                                        economics. Fixed with a new `me-economics-selective`
#                                        group; ECON and BIOL 11000 (now covered by
#                                        `fye-selective`) were removed from `gen-ed-selective`'s
#                                        pool so a single course can no longer count toward two
#                                        groups at once — the real Acalog page states outright
#                                        that "a course is not eligible for [the Engineering Gen
#                                        Ed 21 credits] if that course is used to satisfy a
#                                        different engineering degree requirement." The 21-credit
#                                        "Engineering General Education Requirements" group itself
#                                        was ALREADY modeled correctly, just unlabeled — `gen-ed-
#                                        core` (7cr: written + oral communication) + `gen-ed-
#                                        selective` (14cr: Gen Ed I-V) = 21, matching Acalog
#                                        exactly; both are renamed/commented to say so explicitly.
#                                        NOT modeled, same as `me-technical-electives`' own
#                                        disclaimer: Acalog's "Additional General Education
#                                        Requirements" sub-rules (6cr must be non-introductory;
#                                        9cr must come from Liberal Arts/Daniels/Honors and not be
#                                        primarily STEM) and the standalone "Elective (3 credits)"
#                                        line — both are course-attribute filters (department,
#                                        course level) this schema has no field for, so they are
#                                        UNMODELED free-elective-shaped credit the deterministic
#                                        planner never sees, exactly like CS MI's own unmodeled
#                                        remainder. Also NOT modeled: Acalog does not publish WHEN
#                                        FYE must be completed as a machine-checkable rule beyond
#                                        "before/while declaring the major" — there is no per-
#                                        semester deadline in this schema, so nothing here
#                                        enforces "FYE by the end of year 1" as a scored violation;
#                                        it is a real Purdue rule this fixture only documents.
#   prereq correction (2026-08-07) ..... Discovered while fixing the bug above: ME 23900's and
#                                        MSE 23000's hand-written prereqs (`CS 15900` and `CHM
#                                        11610` respectively) each silently forced ONE specific
#                                        `fye-selective` path — impossible to satisfy for a real
#                                        student who legally chose a different one, and self-
#                                        contradictory with Acalog publishing this as a genuine
#                                        4-way choice. Both were unverified guesses already
#                                        flagged as this file's highest-risk rows (see below);
#                                        cleared to `[]` rather than left compounding a structural
#                                        bug this file otherwise just fixed.
#   prereqs ........................... NOT PUBLISHED in Acalog for this
#                                        program either (same TODO.md §2.5 gap
#                                        as CS MI). Hand-written from the
#                                        Purdue ME curriculum as I know it.
#                                        These are the highest-risk rows in the
#                                        file — spot-check against
#                                        catalog.purdue.edu before quoting a
#                                        prereq-violation number.
#   offered_terms ...................... NOT observed via `run.py
#                                        refresh-offerings` for this program —
#                                        `advisor.course_offering_patterns` in
#                                        this DB only covers the CS MI course
#                                        list. Hand-written: required upper-
#                                        division ME lecture/lab sequences
#                                        marked fall+spring (the normal pattern
#                                        for a required engineering course with
#                                        a lab section), several technical
#                                        electives marked single-term as a
#                                        deliberately unverified guess at a
#                                        realistic constraint — re-run
#                                        `refresh-offerings` before trusting a
#                                        term-violation count involving them.
#
# HOW TO VERIFY: same procedure as `cs_machine_intelligence.yaml` — `python
# run.py fixture-check` diffs codes/credits/titles against `courses` +
# `requirement_options`. Prereqs and offered_terms are not verifiable that way.
#
# Editing this file changes scores. The harness hashes it into every plan
# record (`fixture_hash`) and the report refuses to pool records with
# different hashes.
# =============================================================================

program:
  name: "Mechanical Engineering"
  slug: "me"
  # Real, crawled Postgres program this fixture's scenarios were written against —
  # Mode B/C read this program's live catalog via `harness/real_db.py`, same source
  # `mechanical_engineering.yaml`'s own header describes. Selected by `run.py`'s
  # `--major`/multi-school loop, not a live DB text search — see `run.py resolve_major`.
  real_db_program_id: "8dee47ad-c8c2-499a-9094-541c80ebf9c3"
  # SCOPE, added 2026-08-09 — Mode B/C now measure ONLY this program's own major-scope
  # requirement groups (real_db._scope_for == "program"); college/university-scoped groups
  # (gen-ed, First-Year Engineering, ...) are dropped from what the model is shown and
  # scored against, tested standalone instead by their own pseudo-major fixture — see
  # engineering_core.yaml / agriculture_core.yaml / gen_ed_world_language.yaml and
  # real_db.fetch_real_db_base's `scope_filter` docstring. "" (absent) = unfiltered, the
  # old/default behaviour every fixture had before this field existed.
  requirement_scope: "major"
  catalog_year: "2026-2027"
  campus: "West Lafayette"
  total_credits_min: 128
  verified: false

  # DIVERGES FROM `cs_machine_intelligence.yaml`'s 3/3 — found by `run.py check`, not copied
  # blind. Half of `me-major-core` is a 1-credit lab paired with its own lecture in the SAME
  # term (ME 30800/30801, ME 32300/32301), and ME 23900 is a 1-credit mini-course — all still
  # "ME"-prefixed, so at 3/semester a normal term (one lecture + its lab + one more ME course)
  # already saturates the cap and starves whatever's next (ME 35400/36400/46300 kept losing
  # the race to non-major electives with room to spare — `me-sophomore-catchup` and
  # `me-controls-averse` were NOT VIABLE on ME 46300 with 7 idle credits sitting in the term
  # before it, purely from hitting this count, not the credit cap). CS MI has no lecture+lab
  # split, so 3 real major courses there IS a full load; here it is not. 4 was the smallest
  # bump that made every 6-semester scenario reachable.
  major_subject: "ME"
  preferred_major_courses_per_semester: 4
  max_major_courses_per_semester: 4
  target_credits_per_semester: 15
  hard_credit_cap: 18


                          "MA 26100", "MA 26500", "MA 26600", "ME 16400", "CS 15900",
                          "ENGL 10600", "COM 11400", "PHYS 17200", "PHYS 24100",
                          "ME 20000", "ME 27000", "ME 27400", "ME 26400", "ME 29000",
                          "ME 23900", "MSE 23000", "ECE 20001", "ECE 20007"]
      start_term: fall
      start_year: 2026
      semesters_to_plan: 4
      max_credits_per_semester: 16
    feedback: >-
      I've finished statics, dynamics, thermo, and the rest of the supporting
      coursework, and I want the thermal-fluids sequence and its electives in my
      first two semesters if the prerequisites are already satisfied.
    assertions:
      - kind: scheduled_before
        course: "ME 30800"
        semester_index: 2
        why: "Prereqs (ME 27400 + MA 26600) are already complete — there is no legal excuse to defer it."
      - kind: max_credits_at_most

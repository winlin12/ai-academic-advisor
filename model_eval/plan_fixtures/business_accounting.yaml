# --- scenarios ---------------------------------------------------------------
scenarios:
  - id: acct-fresh-start
    label: "Incoming Accounting major, nothing completed"
    profile:
      name: "Avery"
      degree_program: "Accounting, BS"
      completed_courses: []
      start_term: fall
      start_year: 2026
      semesters_to_plan: 8
      max_credits_per_semester: 17
    feedback: >-
      I'm starting from scratch in accounting and I want to get into the
      intermediate accounting sequence as early as the prerequisites allow
      — I'm aiming for the CPA track.
    assertions:
      - kind: scheduled_before
        course: "ACCT 20100"
        semester_index: 4
        why: "ACCT 20100 gates Intermediate Accounting I and the entire licensure sequence; deferring it past the midpoint stalls the whole major."
      - kind: max_credits_at_most
        value: 17
    world_language:
      subject: FR
      level: 1

  - id: acct-sophomore-catchup
    label: "Second-year student who just declared Accounting"
    profile:
      name: "Jordan"
      degree_program: "Accounting, BS"
      completed_courses: ["ACCT 20000", "MA 16010", "ENGL 10600", "COM 11400", "ECON 25100"]
      start_term: fall
      start_year: 2026
      semesters_to_plan: 6
      max_credits_per_semester: 16
    feedback: >-
      I just declared accounting after a year of undecided business and I
      have three years left. I want the intermediate accounting sequence on
      track since it gates tax and audit, and please don't stack two
      accounting courses back to back.
    assertions:
      - kind: scheduled_before
        course: "ACCT 20100"
        semester_index: 2
        why: "ACCT 20100 gates the entire Intermediate Accounting/Tax/Audit chain; a late start cascades through the rest of the major."
      - kind: max_credits_at_most
        value: 16
    world_language:
      subject: GER
      level: 2

  - id: acct-light-load
    label: "Accounting student who needs a reduced credit load"
    profile:
      name: "Sam"
      degree_program: "Accounting, BS"
      completed_courses: ["MA 16010", "ENGL 10600"]
      start_term: fall
      start_year: 2026
      semesters_to_plan: 8
      max_credits_per_semester: 15
    feedback: >-
      I'm working a part-time bookkeeping job this year, so please cap me at
      12 credits a semester.
    assertions:
      - kind: max_credits_at_most
        value: 12
        why: "The student named an explicit cap; honouring it is the whole ask."
      - kind: proposal_sets_credit_cap
        value: 12
    world_language:
      subject: SPAN
      level: 3

  - id: acct-spring-start
    label: "Spring-start transfer student"
    profile:
      name: "Devin"
      degree_program: "Accounting, BS"
      completed_courses: ["MA 16010", "ENGL 10600", "COM 11400", "PSY 12000",
                          "HIST 10300", "SOC 10000"]
      start_term: spring
      start_year: 2027
      semesters_to_plan: 8
      max_credits_per_semester: 16
    feedback: >-
      I transferred in with my math and gen-ed credits done and I'm starting
      in the spring. Get me through the business core and into the
      accounting sequence.
    notes: >-
      A spring start shifts sequencing built around a fall-start core chain.
      Models that assume every prerequisite clears at the same pace
      regardless of start term collect violations here.
    assertions:
      - kind: scheduled_before
        course: "ACCT 20000"
        semester_index: 2
      - kind: max_credits_at_most
        value: 16
    world_language:
      subject: JPNS
      level: 3

#
#   verified: false     <-- READ THIS BEFORE QUOTING ANY NUMBER FROM A RUN
#
# PROVENANCE — REAL, same source and method as the rest of this directory
# (crawled catalog Postgres, program 5ae3f123-19d9-4598-bd33-7138ac7c7ffc
# "Accounting, BS", catalog year 6f29fb29-07a2-426c-8b94-543c353843bf). This
# is the Daniels School's SECOND fixture, alongside `business_finance.yaml`
# — same cross-functional business core (see that file's header for the
# embedded-choice-cluster pattern), a CPA-track major instead of a finance
# one. Same caveats as every fixture here: prereqs hand-written (Acalog
# publishes none), offered_terms hand-written guesses.
#
# WHAT MAKES THIS PROGRAM'S REQUIREMENT SHAPE DIFFERENT FROM FINANCE: a real,
# named "Careers In Accounting & Finance" 1-credit first course, then a
# genuine Intermediate Accounting I -> II -> (Tax | Audit) chain that is
# nothing like Finance's own 41xxx elective spread — this is the closest
# thing in this directory's Business fixtures to a licensure track (the real
# CPA-eligibility coursework), structurally closer to Nursing's or Elementary
# Education's own required-sequence shape than to Finance's elective-driven
# one. The reused business-core cluster anchors on the ACCOUNTING side of
# each embedded pick-one (ACCT 21000 for the AI pick, ACCT 24900 for the
# data-tools pick) rather than Finance's FIN-side anchors — a different,
# equally legitimate editorial choice, not a crawled fact either way.
# =============================================================================

program:

# --- scenarios ---------------------------------------------------------------
scenarios:
  - id: prevet-fresh-start
    label: "Incoming Pre-Vet Animal Sciences major, nothing completed"
    profile:
      name: "Avery"
      degree_program: "Animal Sciences: Pre-Veterinary Medicine Concentration, BS"
      completed_courses: []
      start_term: fall
      start_year: 2026
      semesters_to_plan: 8
      max_credits_per_semester: 17
    feedback: >-
      I'm starting from scratch in animal sciences, pre-vet track, and I want
      to get into the animal physiology and nutrition courses as early as the
      prerequisites allow — I'll be applying to vet school and don't want
      those pushed late.
    assertions:
      - kind: scheduled_before
        course: "ANSC 23000"
        semester_index: 4
        why: "ANSC 23000 gates ANSC 33300 and the reproduction/breeding sequence; deferring it past the midpoint stalls the pre-vet track."
      - kind: max_credits_at_most
        value: 17
    world_language:
      subject: SPAN
      level: 1

  - id: prevet-sophomore-catchup
    label: "Second-year student who just declared Pre-Vet Animal Sciences"
    profile:
      name: "Jordan"
      degree_program: "Animal Sciences: Pre-Veterinary Medicine Concentration, BS"
      completed_courses: ["AGR 10100", "AGR 11400", "BIOL 11000", "MA 16010",
                          "ENGL 10800", "COM 11400", "ANSC 10200"]
      start_term: fall
      start_year: 2026
      semesters_to_plan: 6
      max_credits_per_semester: 16
    feedback: >-
      I just declared the pre-vet concentration after a year of exploratory
      studies and I have three years left. I want the organic chemistry
      sequence on track since I know it gates everything else, and please
      don't stack two chemistry labs in the same semester.
    assertions:
      - kind: scheduled_before
        course: "CHM 11610"
        semester_index: 3
        why: "CHM 11610 gates the organic chemistry sequence and biochemistry; a late start cascades into an unfinishable plan."
      - kind: max_credits_at_most
        value: 16
    world_language:
      subject: GER
      level: 2

  - id: prevet-light-load
    label: "Pre-Vet student who needs a reduced credit load"
    profile:
      name: "Sam"
      degree_program: "Animal Sciences: Pre-Veterinary Medicine Concentration, BS"
      completed_courses: ["AGR 10100", "AGR 11400", "MA 16010", "ENGL 10800"]
      start_term: fall
      start_year: 2026
      semesters_to_plan: 8
      max_credits_per_semester: 15
    feedback: >-
      I work at a veterinary clinic most afternoons, so please cap me at 12
      credits a semester.
    assertions:
      - kind: max_credits_at_most
        value: 12
        why: "The student named an explicit cap; honouring it is the whole ask."
      - kind: proposal_sets_credit_cap
        value: 12
    world_language:
      subject: FR
      level: 1

  - id: prevet-spring-start
    label: "Spring-start transfer student"
    profile:
      name: "Devin"
      degree_program: "Animal Sciences: Pre-Veterinary Medicine Concentration, BS"
      completed_courses: ["MA 16010", "ENGL 10800", "COM 11400", "PSY 12000",
                          "PHIL 15000", "HIST 10300", "ANTH 10000"]
      start_term: spring
      start_year: 2027
      semesters_to_plan: 8
      max_credits_per_semester: 16
    feedback: >-
      I transferred in with my math and gen-ed credits done and I'm starting
      in the spring. Get me through the animal sciences core and into the
      pre-vet chemistry sequence.
    notes: >-
      A spring start shifts every fall-only course (ANSC 31100 among them) by
      one position. Models that assume a canonical fall-start sequence collect
      term violations here.
    assertions:
      - kind: scheduled_before
        course: "ANSC 10200"
        semester_index: 2
      - kind: max_credits_at_most
        value: 16
    world_language:
      subject: JPNS
      level: 3

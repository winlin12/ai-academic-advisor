# =============================================================================
# PLAN-OF-STUDY GROUND TRUTH — Animal Sciences: Pre-Veterinary Medicine
# Concentration, BS (College of Agriculture)
#
#   verified: false     <-- READ THIS BEFORE QUOTING ANY NUMBER FROM A RUN
#
# PROVENANCE — REAL, from the crawled catalog Postgres this time (rewritten
# 2026-08-08; the first version of this file was hand-guessed and got the
# department's own course prefix wrong — ANIMAL SCIENCES COURSES ARE "ANSC",
# NOT "ASL"). Codes/titles/credits below were queried from program
# a21780e8-4232-4308-a66f-5dfc57c89da8 ("Animal Sciences: Pre-Veterinary
# Medicine Concentration", catalog year 6f29fb29-07a2-426c-8b94-543c353843bf)
# in the same `catalog-ingestion-postgres` database `mechanical_engineering.
# yaml` reads from — see that file's header for the query pattern
# (`requirement_groups` -> `requirement_options` -> `courses`). Same caveats
# apply: prereqs are Acalog-unpublished (hand-written, flagged below),
# offered_terms are hand-written guesses (not run through `refresh-offerings`,
# which only covers the CS MI course list), and two real requirement groups
# were crawled with NO option rows at all (prose-only in Acalog) — left
# unmodeled rather than invented; see the comments where they'd go.
#
# WHAT MAKES THIS PROGRAM'S REQUIREMENT SHAPE DIFFERENT FROM CS/ME:
#   - A LIGHTER, DIFFERENT MATH TRACK: MA 16010 "Applied Calculus I", not the
#     MA 16100/16200 engineering sequence CS/ME both require.
#   - A college-wide half-credit orientation pair (AGR 10100 + AGR 11400) —
#     the loader casts `credits` to `int`, so the real 0.5-credit value is
#     rounded up to 1 here; flagged inline.
#   - A required ECONOMICS SELECTIVE (pick one of six AGEC/ECON courses) —
#     structurally the same shape as `mechanical_engineering.yaml`'s own
#     `me-economics-selective`, real for this program too.
#   - A SPECIES-MANAGEMENT SELECTIVE (pick one of seven ANSC 44xxx courses)
#     folded into the otherwise-required major core to reach its real 30-
#     credit total — the crawl lists all seven as flat options with no
#     sub-group, so which one is "the elective" is an editorial read, not a
#     crawled fact.
#   - College preferred a specific WRITTEN COMPOSITION course (ENGL 10800,
#     not CS/ME's ENGL 10600) — real, from this program's own crawled text.
# =============================================================================

program:

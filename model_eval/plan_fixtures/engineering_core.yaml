# =============================================================================
# PLAN-OF-STUDY GROUND TRUTH — First-Year Engineering (College of Engineering core gate)
#
#   verified: false     <-- READ THIS BEFORE QUOTING ANY NUMBER FROM A RUN
#
# WHY THIS FIXTURE EXISTS. Added 2026-08-09 alongside `agriculture_core.yaml` and
# `gen_ed_world_language.yaml`, splitting out of the 16 major fixtures (which now set
# `requirement_scope: major` — see their own headers) a domain a 27B model was being asked to
# reason about in the SAME call as real prerequisite sequencing, despite it having almost none
# of its own: "pick 8 shallow, mostly-parallel requirements from an intro-level menu" is a
# different task from "sequence a major's multi-year prerequisite chain," and bundling them was
# part of what produced qwen3.6-27b's Mode B catalog-echo duplicates (see that investigation).
#
# UNLIKE `agriculture_core.yaml`/`gen_ed_world_language.yaml`, this one is LIVE-SOURCED
# (`program.source` left at its default "real_db"), not fixture-sourced — Purdue's own crawl
# already has First-Year Engineering as its OWN standalone program (not a subgroup of any major's
# tree; see `real_db.FYE_PROGRAM_ID`/`is_college_of_engineering`'s docstrings for why a College
# of Engineering major has no FK to it), so Mode B/C read it exactly the way any other major is
# read, live, real, no hand-curation needed for the requirement content itself.
#
# PROVENANCE: `courses`/`requirement_groups` below are a representative subset of
# `real_db_program_id`'s own 8 "Requirement #N" groups, read live 2026-08-09 (see this file's
# own scenarios for the shape) — a hand-authored MIRROR for Mode A/the scorer, same relationship
# every other fixture in this directory has to its own live program. Every FYE requirement is,
# by Purdue's own framing, meant to clear within the student's FIRST TWO SEMESTERS — that is
# this fixture's `semesters_to_plan`, not the usual 6-8, because "does it all fit in the real
# window" is itself part of what this test case measures.
# =============================================================================

program:
  name: "First-Year Engineering"
  slug: "engineering_core"
  real_db_program_id: "bebe0ff3-d003-4d43-8674-3b39cc11407d"
  catalog_year: "2026-2027"
  campus: "West Lafayette"
  total_credits_min: 30
  verified: false
  major_subject: "ENGR"
  preferred_major_courses_per_semester: 4
  max_major_courses_per_semester: 5
  # null since 2026-08-12: no fixed per-semester aim. The planner derives
  # ceil(credits still to place / semesters still available), clamped by the cap, so the
  # requirements finish spread evenly instead of every term reaching for the same number.
  # See cs_machine_intelligence.yaml for the measurement behind it.
  target_credits_per_semester: null
  hard_credit_cap: 18


    name: "Requirement #8: Written and Oral Communication"
    kind: all
    courses: ["SCLA 11000", "SCLA 11100"]

  - id: fye-intro-1
    name: "Requirement #1: Intro to Engineering I"
    kind: choose
    choose_credits: 2
    courses: ["ENGR 13100", "ENGR 16100", "EPCS 11100"]

  - id: fye-intro-2
    name: "Requirement #2: Intro to Engineering II"
    kind: choose
    choose_credits: 2
    courses: ["ENGR 13200", "ENGR 16200"]

  - id: fye-calc-1
    name: "Requirement #3: Calculus I"
    kind: all
    courses: ["MA 16100"]

  - id: fye-calc-2
    name: "Requirement #4: Calculus II"
    kind: all
    courses: ["MA 16200"]

  - id: fye-chemistry
    name: "Requirement #5: Chemistry"
    kind: choose
    choose_credits: 4
    courses: ["CHM 11510", "CHM 11100"]

  - id: fye-physics
    name: "Requirement #6: Physics"
    kind: choose
    choose_credits: 4
    courses: ["PHYS 17200"]

  - id: fye-selective
    name: "Requirement #7: First-Year Engineering Selective"
    kind: choose
    choose_credits: 3
    courses: ["CHM 11610", "CS 15900", "BIOL 11000"]

# --- scenarios ---------------------------------------------------------------
scenarios:
  - id: fye-fresh-start
    label: "Incoming engineering student, nothing completed"
    profile:
      name: "Avery"
      degree_program: "First-Year Engineering"
      completed_courses: []
      start_term: fall
      start_year: 2026
      semesters_to_plan: 2
      max_credits_per_semester: 17
    feedback: >-
      I'm starting from scratch and want everything on the First-Year
      Engineering checklist done within my first two semesters, like the
      college requires.
    assertions:
      - kind: max_credits_at_most
        value: 17
    world_language: null

  - id: fye-ap-credit
    label: "Incoming student with AP credit for calculus and chemistry"
    profile:
      name: "Jordan"
      degree_program: "First-Year Engineering"
      completed_courses: ["MA 16100", "CHM 11510"]
      start_term: fall
      start_year: 2026
      semesters_to_plan: 2
      max_credits_per_semester: 17
    feedback: >-
      I came in with AP credit for Calc I and general chemistry already
      done. Get me through everything else on the checklist in two
      semesters.
    assertions:
      - kind: max_credits_at_most
        value: 17
    world_language: null

  - id: fye-light-load
    label: "Engineering student who needs a reduced credit load"
    profile:
      name: "Sam"
      degree_program: "First-Year Engineering"
      completed_courses: ["SCLA 11000"]
      start_term: fall
      start_year: 2026
      semesters_to_plan: 3
      max_credits_per_semester: 14
    feedback: >-
      I'm on a modified course load this year, so please cap me at 14
      credits a semester even if that pushes finishing FYE into a third
      semester.
    assertions:
      - kind: max_credits_at_most
        value: 14
        why: "The student named an explicit cap; honouring it is the whole ask."
      - kind: proposal_sets_credit_cap
        value: 14
    world_language: null

  - id: fye-spring-start
    label: "Spring-start transfer student"
    profile:
      name: "Devin"
      degree_program: "First-Year Engineering"
      completed_courses: ["MA 16100", "MA 16200", "SCLA 11000", "SCLA 11100"]
      start_term: spring
      start_year: 2027
      semesters_to_plan: 2
      max_credits_per_semester: 17
    feedback: >-
      I transferred in with both calculus courses and my communication
      sequence already done, starting in the spring. Finish the rest of
      FYE for me.
    notes: >-
      A spring start shifts ENGR 16100/16200's fall/spring-only offerings —
      models that assume every FYE selective is offered every term collect
      violations here.
    assertions:
      - kind: max_credits_at_most
        value: 17
    world_language: null

# --- scenarios ---------------------------------------------------------------
scenarios:
  - id: englished-fresh-start
    label: "Incoming English Education major, nothing completed"
    profile:
      name: "Avery"
      degree_program: "English Education, BA"
      completed_courses: []
      start_term: fall
      start_year: 2026
      semesters_to_plan: 8
      max_credits_per_semester: 17
    feedback: >-
      I'm starting from scratch in English education and I want to get into
      classroom-methods courses as early as the prerequisites allow, not
      just literature survey courses the whole time.
    assertions:
      - kind: scheduled_before
        course: "EDCI 33300"
        semester_index: 4
        why: "EDCI 33300 gates every methods course and the assessment courses; deferring it past the midpoint stalls the whole sequence."
      - kind: max_credits_at_most
        value: 17
    world_language:
      subject: SPAN
      level: 1

  - id: englished-sophomore-catchup
    label: "Second-year student who just declared English Education"
    profile:
      name: "Jordan"
      degree_program: "English Education, BA"
      completed_courses: ["EDCI 20500", "ENGL 20500", "ENGL 10600", "COM 11400"]
      start_term: fall
      start_year: 2026
      semesters_to_plan: 7
      max_credits_per_semester: 16
    feedback: >-
      I just declared English education after a year of undecided and I
      have a bit over three years left. I want the methods sequence on
      track since it gates student teaching, and please don't stack two
      writing-heavy courses in the same semester.
    assertions:
      - kind: scheduled_before
        course: "EDCI 33300"
        semester_index: 3
        why: "EDCI 33300 gates EDCI 38100 and everything past it, including student teaching; a late start cascades."
      - kind: max_credits_at_most
        value: 16
    world_language:
      subject: GER
      level: 2

  - id: englished-light-load
    label: "English Education student who needs a reduced credit load"
    profile:
      name: "Sam"
      degree_program: "English Education, BA"
      completed_courses: ["EDCI 20500", "ENGL 20500", "ENGL 10600"]
      start_term: fall
      start_year: 2026
      semesters_to_plan: 8
      max_credits_per_semester: 15
    feedback: >-
      I'm tutoring at the writing lab most afternoons, so please cap me at
      12 credits a semester.
    assertions:
      - kind: max_credits_at_most
        value: 12
        why: "The student named an explicit cap; honouring it is the whole ask."
      - kind: proposal_sets_credit_cap
        value: 12
    world_language:
      subject: FR
      level: 1

  - id: englished-spring-start
    label: "Spring-start transfer student"
    profile:
      name: "Devin"
      degree_program: "English Education, BA"
      completed_courses: ["ENGL 10600", "COM 11400", "PSY 12000", "PHIL 15000"]
      start_term: spring
      start_year: 2027
      semesters_to_plan: 8
      max_credits_per_semester: 16
    feedback: >-
      I transferred in with my gen-ed credits done and I'm starting in the
      spring. Get me through the education core and toward student teaching.
    notes: >-
      A spring start shifts sequencing built around a fall entry into the
      program. Models that memorised a canonical fall-start plan collect
      prerequisite violations here.
    assertions:
      - kind: scheduled_before
        course: "EDCI 20500"
        semester_index: 2
      - kind: max_credits_at_most
        value: 16
    world_language:
      subject: JPNS
      level: 3

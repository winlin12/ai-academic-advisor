# =============================================================================
# PLAN-OF-STUDY GROUND TRUTH — English Education, BA
#
#   verified: false     <-- READ THIS BEFORE QUOTING ANY NUMBER FROM A RUN
#
# PROVENANCE — REAL, same source and method as the rest of this directory
# (crawled catalog Postgres, program 58b067aa-027a-45a5-aada-9f2224f8a898
# "English Education, BA", catalog year 6f29fb29-07a2-426c-8b94-543c353843bf).
# This is Education's SECOND fixture, alongside `education_elementary.yaml`
# — a SECONDARY licensure track instead of elementary, sharing some of the
# same EDCI/EDPS foundations course codes but with real, secondary-specific
# variants (EDPS 43010 "Secondary Creating And Managing Learning
# Environments" instead of Elementary's EDPS 43000; EDCI 33300 instead of
# EDCI 30101/30102) and a content major built from real ENGL courses instead
# of licensure-specific ones. Same caveats as every fixture here: prereqs
# hand-written (Acalog publishes none), offered_terms hand-written guesses.
#
# WHAT MAKES THIS PROGRAM'S REQUIREMENT SHAPE DIFFERENT FROM ELEMENTARY: the
# "Literary Traditions (6 credits)" requirement is real but crawled as TWO
# separate 3-ish-option lists ("List A", "List B") with no crawled rule for
# how many credits come from each — modeled here as one pooled 6-credit
# choose group rather than guessing an A/B split the crawl doesn't state (an
# editorial simplification, not a crawled fact). The clinical capstone here
# is EDCI 49800 "Supervised Teaching" (6 credits, real) — the secondary
# counterpart to Elementary's EDCI 49600, with the exact same real-world
# caveat: a real student teaching semester is close to full-time and this
# fixture cannot enforce that exclusivity (see `education_elementary.yaml`'s
# header).
# =============================================================================


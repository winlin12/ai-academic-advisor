# =============================================================================
# PLAN-OF-STUDY GROUND TRUTH — University Core (gen-ed) + world language
#
#   verified: false     <-- READ THIS BEFORE QUOTING ANY NUMBER FROM A RUN
#
# WHY THIS FIXTURE EXISTS — see `engineering_core.yaml`'s header for the full rationale.
#
# PROVENANCE — NOT a single live program, unlike `engineering_core.yaml`. Purdue's own crawl
# has almost no schedulable gen-ed content at the university level: queried live 2026-08-09,
# `requirement_type = 'university'` rows have real course options on 0 of 886, and
# `'world_language'`-typed rows on only 6 of 307 — university core is stated in PROSE in this
# crawl (see `real_db.py`'s `unresolved_groups`/`_clean_ucc_row`), not as a course list Mode B
# could plan against directly. The gen-ed-core/gen-ed-selective content that DOES exist in this
# directory today is the same hand-curated workaround every one of the 16 major fixtures already
# used before this file existed — this fixture is that workaround, isolated into its own test
# case instead of repeated once per major, plus a real per-major variation it papers over:
#   - COM 11400 is common to every one of the 15 non-ME major fixtures' `gen-ed-core`.
#   - ENGL 10600 vs ENGL 10800 vary BY MAJOR (a real Purdue distinction — 10800 is the
#     accelerated track some programs point students toward) — modeled here as a choice
#     between the two rather than picking one and hiding the other.
#   - `gen-ed-selective` menus vary in size (2-9 options) and content per major; the six
#     courses below (HIST 10300, PHIL 15000, PSY 12000, SOC 10000, ANTH 10000, POL 10100) are
#     the ones that recur across the MOST fixtures — a representative pool, not exhaustive, and
#     not claimed to be any specific major's actual menu.
#
# WORLD LANGUAGE — only Spanish is modeled (SPAN 10100/10200/20100), as a representative case
# exercising the same `real_db.build_scenario_database`/`_language_path_options` machinery every
# live-sourced fixture's `world_language` scenario field already uses; this fixture is
# fixture-sourced (see below) so nothing here comes from a live crawl. Extending to every
# language Purdue offers is real future work, not attempted in this first pass.
#
# FIXTURE-SOURCED (`program.source: fixture`) — same reasoning as `agriculture_core.yaml`: no
# Postgres round trip, Mode B/C read this file's own `courses`/`requirement_groups` directly,
# rendered with `catalog_export.render_context_lean`.
# =============================================================================

program:
  name: "University Core Requirements + World Language"
  slug: "gen_ed_world_language"
  source: "fixture"
  catalog_year: "2026-2027"
  campus: "West Lafayette"
  total_credits_min: 16
  verified: false
  major_subject: "NONE"
  preferred_major_courses_per_semester: 5
  max_major_courses_per_semester: 5
  target_credits_per_semester: 15
  hard_credit_cap: 18


# --- degree requirements -----------------------------------------------------
requirement_groups:
  - id: gen-ed-writing
    name: "University Core — written communication"
    kind: choose
    choose_credits: 4
    courses: ["ENGL 10600", "ENGL 10800"]

  - id: gen-ed-oral
    name: "University Core — oral communication"
    kind: all
    courses: ["COM 11400"]

  - id: gen-ed-selective
    name: "University Core — additional selectives"
    kind: choose
    choose_credits: 6
    courses: ["HIST 10300", "PHIL 15000", "PSY 12000", "SOC 10000", "ANTH 10000", "POL 10100"]

  - id: world-language
    name: "World Language — Spanish"
    kind: choose
    choose_credits: 9
    courses: ["SPAN 10100", "SPAN 10200", "SPAN 20100"]

# --- scenarios ---------------------------------------------------------------
scenarios:
  - id: genedwl-fresh-start
    label: "Incoming student, nothing completed, starting Spanish from scratch"
    profile:
      name: "Avery"
      degree_program: "University Core Requirements + World Language"
      completed_courses: []
      start_term: fall
      start_year: 2026
      semesters_to_plan: 4
      max_credits_per_semester: 16
    feedback: >-
      I haven't done any of my gen-ed or language requirements yet. Spread
      them out — don't front-load everything into my first semester.
    assertions:
      - kind: max_credits_at_most
        value: 16
    world_language:
      subject: SPAN
      level: 1

  - id: genedwl-partial-credit
    label: "Student with AP writing credit and one semester of Spanish already done"
    profile:
      name: "Jordan"
      degree_program: "University Core Requirements + World Language"
      completed_courses: ["ENGL 10600", "SPAN 10100"]
      start_term: fall
      start_year: 2026
      semesters_to_plan: 3
      max_credits_per_semester: 16
    feedback: >-
      I have AP credit for composition and already took Spanish I. Finish
      the rest of my gen-ed and language requirement.
    assertions:
      - kind: max_credits_at_most
        value: 16
    world_language:
      subject: SPAN
      level: 2

  - id: genedwl-light-load
    label: "Student who needs a reduced credit load"
    profile:
      name: "Sam"
      degree_program: "University Core Requirements + World Language"
      completed_courses: ["COM 11400"]
      start_term: fall
      start_year: 2026
      semesters_to_plan: 4
      max_credits_per_semester: 15
    feedback: >-
      I'm working part time, so please cap me at 12 credits a semester.
    assertions:
      - kind: max_credits_at_most
        value: 12
        why: "The student named an explicit cap; honouring it is the whole ask."
      - kind: proposal_sets_credit_cap
        value: 12
    world_language:
      subject: SPAN
      level: 1

  - id: genedwl-spring-start
    label: "Spring-start transfer student"
    profile:
      name: "Devin"
      degree_program: "University Core Requirements + World Language"
      completed_courses: ["HIST 10300", "PHIL 15000", "PSY 12000"]
      start_term: spring
      start_year: 2027
      semesters_to_plan: 4
      max_credits_per_semester: 16
    feedback: >-
      I transferred in with three of my gen-ed selectives already done,
      starting in the spring. Finish the rest, including the language
      requirement.
    assertions:
      - kind: max_credits_at_most
        value: 16
    world_language:
      subject: SPAN
      level: 1

    name: "A. Required Foundation Course"
    kind: all
    courses: ["POL 10100"]

  - id: polsci-intro
    name: "A. Introductory Political Science (choose one)"
    kind: choose
    choose_credits: 3
    courses: ["POL 12000", "POL 13000", "POL 14100", "POL 15000", "POL 20000"]

  - id: polsci-methods
    name: "B. Introduction To Political Analysis Methods"
    kind: all
    courses: ["POL 30000"]

  - id: polsci-capstone
    name: "D. Capstone (choose enough)"
    kind: choose
    choose_credits: 3
    courses: ["POL 40300", "POL 49100", "POL 49500"]

  - id: amerpol-selective
    name: "American Politics Concentration — Selectives"
    kind: choose
    choose_credits: 9
    courses: ["POL 31400", "POL 37300", "POL 41100"]

  - id: gen-ed-core
    name: "University Core — written composition"
    kind: all
    courses: ["ENGL 10600"]

  - id: gen-ed-selective
    name: "Liberal Arts Core stand-in (NOT a faithful model — see header)"
    kind: choose
    choose_credits: 12
    courses: ["PSY 12000", "SOC 10000", "HIST 10300", "PHIL 15000", "ANTH 10000"]

# --- scenarios ---------------------------------------------------------------
scenarios:
  - id: polisci-fresh-start
    label: "Incoming Political Science major, nothing completed"
    profile:
      name: "Avery"
      degree_program: "Political Science: American Politics Concentration, BA"
      completed_courses: []
      start_term: fall
      start_year: 2026
      semesters_to_plan: 8
      max_credits_per_semester: 16
    feedback: >-
      I'm starting from scratch in political science, American politics
      concentration, and I want to get into the concentration selectives as
      early as the prerequisites allow.
    assertions:
      - kind: scheduled_before
        course: "POL 10100"
        semester_index: 2
        why: "POL 10100 gates the methods course and every American Politics selective; a late start stalls almost everything else in the major."
      - kind: max_credits_at_most
        value: 16
    world_language:
      subject: FR
      level: 1

  - id: polisci-sophomore-catchup
    label: "Second-year student who just declared Political Science"
    profile:
      name: "Jordan"
      degree_program: "Political Science: American Politics Concentration, BA"
      completed_courses: ["POL 10100", "ENGL 10600", "PSY 12000"]
      start_term: fall
      start_year: 2026
      semesters_to_plan: 6
      max_credits_per_semester: 16
    feedback: >-
      I just declared political science after a year of undecided liberal
      arts and I have three years left. I want the methods course on track
      since it gates the capstone, and please don't stack two
      research-heavy courses in the same semester.
    assertions:
      - kind: scheduled_before
        course: "POL 30000"
        semester_index: 3
        why: "POL 30000 gates the capstone and is a slow-moving prereq root; a late start narrows every later semester's options."
      - kind: max_credits_at_most
        value: 16
    world_language:
      subject: GER
      level: 2

  - id: polisci-light-load
    label: "Political Science student who needs a reduced credit load"
    profile:
      name: "Sam"
      degree_program: "Political Science: American Politics Concentration, BA"
      completed_courses: ["ENGL 10600", "PSY 12000"]
      start_term: fall
      start_year: 2026
      semesters_to_plan: 8
      max_credits_per_semester: 15
    feedback: >-
      I'm interning at the state legislature part time this year, so please
      cap me at 12 credits a semester.
    assertions:
      - kind: max_credits_at_most
        value: 12
        why: "The student named an explicit cap; honouring it is the whole ask."
      - kind: proposal_sets_credit_cap
        value: 12
    world_language:
      subject: SPAN
      level: 3

  - id: polisci-spring-start
    label: "Spring-start transfer student"
    profile:
      name: "Devin"
      degree_program: "Political Science: American Politics Concentration, BA"
      completed_courses: ["ENGL 10600", "PSY 12000", "SOC 10000", "HIST 10300", "PHIL 15000"]
      start_term: spring
      start_year: 2027
      semesters_to_plan: 8
      max_credits_per_semester: 16
    feedback: >-
      I transferred in with my gen-ed credits done and I'm starting in the
      spring. Get me through the foundation courses and into the American
      Politics selectives.
    notes: >-
      A spring start shifts sequencing built around a fall-start foundation
      chain. Models that assume every prerequisite clears at the same pace
      regardless of start term collect violations here.
    assertions:
      - kind: scheduled_before
        course: "POL 10100"
        semester_index: 2
      - kind: max_credits_at_most
        value: 16
    world_language:
      subject: JPNS
      level: 3

# here unchanged and is not repeated in full).
#
# WHAT MAKES THIS PROGRAM'S REQUIREMENT SHAPE DIFFERENT FROM COMMUNICATION:
# the major is organized into lettered sub-blocks the same way Communication
# is (A/B/C/D here vs. Communication's A-F), but two of them — "C. Areas of
# Political Science: Breadth (12 credits)" and the concentration's own
# breadth pieces — crawled with NO option rows at all (prose-only, likely
# because the real rule is "one course from each of several subfields," a
# shape the crawl has no way to expose as a flat list). Left unmodeled
# rather than invented. POL 10100 appears in the real crawl as both a
# general intro option AND the concentration's own named "Required
# Foundation Course" — modeled here as required ONLY via the foundation
# slot, with the intro-selective menu narrowed to its other five options, so
# the same course is not double-counted toward two different targets by the
# deterministic planner.
# =============================================================================

program:

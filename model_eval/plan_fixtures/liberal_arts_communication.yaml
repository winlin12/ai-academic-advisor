# --- scenarios ---------------------------------------------------------------
scenarios:
  - id: com-fresh-start
    label: "Incoming Communication major, nothing completed"
    profile:
      name: "Avery"
      degree_program: "Communication: General Communication Concentration, BA"
      completed_courses: []
      start_term: fall
      start_year: 2026
      semesters_to_plan: 8
      max_credits_per_semester: 16
    feedback: >-
      I'm starting from scratch in communication and I want to get into the
      concentration electives as early as the prerequisites allow, not just
      the Pre-Com requirements the whole time.
    assertions:
      - kind: scheduled_before
        course: "COM 10200"
        semester_index: 2
        why: "COM 10200 gates the Pre-Com sequence and most concentration electives; a late start stalls almost everything else in the major."
      - kind: max_credits_at_most
        value: 16
    world_language:
      subject: FR
      level: 1

  - id: com-sophomore-catchup
    label: "Second-year student who just declared Communication"
    profile:
      name: "Jordan"
      degree_program: "Communication: General Communication Concentration, BA"
      completed_courses: ["COM 10200", "ENGL 10600", "PSY 12000"]
      start_term: fall
      start_year: 2026
      semesters_to_plan: 6
      max_credits_per_semester: 16
    feedback: >-
      I just declared communication after a year of undecided liberal arts
      and I have three years left. I want research methods on track since it
      gates the upper-level electives, and please don't stack two
      production-heavy courses in the same semester.
    assertions:
      - kind: scheduled_before
        course: "COM 20400"
        semester_index: 3
        why: "COM 20400 gates COM 30400 (research methods) and several concentration electives; a late start narrows every later semester's options."
      - kind: max_credits_at_most
        value: 16
    world_language:
      subject: GER
      level: 2

  - id: com-light-load
    label: "Communication student who needs a reduced credit load"
    profile:
      name: "Sam"
      degree_program: "Communication: General Communication Concentration, BA"
      completed_courses: ["ENGL 10600", "PSY 12000"]
      start_term: fall
      start_year: 2026
      semesters_to_plan: 8
      max_credits_per_semester: 15
    feedback: >-
      I'm working part time at the student radio station, so please cap me
      at 12 credits a semester.
    assertions:
      - kind: max_credits_at_most
        value: 12
        why: "The student named an explicit cap; honouring it is the whole ask."
      - kind: proposal_sets_credit_cap
        value: 12
    world_language:
      subject: SPAN
      level: 3

  - id: com-spring-start
    label: "Spring-start transfer student"
    profile:
      name: "Devin"
      degree_program: "Communication: General Communication Concentration, BA"
      completed_courses: ["ENGL 10600", "PSY 12000", "SOC 10000", "HIST 10300",
                          "PHIL 15000", "POL 10100"]
      start_term: spring
      start_year: 2027
      semesters_to_plan: 8
      max_credits_per_semester: 16
    feedback: >-
      I transferred in with my gen-ed credits done and I'm starting in the
      spring. Get me through the Pre-Com requirements and into the
      concentration electives.
    notes: >-
      A spring start shifts sequencing built around a fall-start Pre-Com
      chain. Models that assume every prerequisite clears at the same pace
      regardless of start term collect violations here.
    assertions:
      - kind: scheduled_before
        course: "COM 10200"
        semester_index: 2
      - kind: max_credits_at_most
        value: 16
    world_language:
      subject: JPNS
      level: 3

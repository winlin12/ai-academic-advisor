# =============================================================================
# PLAN-OF-STUDY GROUND TRUTH — Communication: General Communication
# Concentration, BA (College of Liberal Arts)
#
#   verified: false     <-- READ THIS BEFORE QUOTING ANY NUMBER FROM A RUN
#
# PROVENANCE — REAL, from the crawled catalog Postgres, same source and
# method as the other rewritten fixtures in this directory. Queried from
# program 3876ea0c-135a-478c-9c39-9ddaf54f6e8d ("Communication: General
# Communication Concentration, BA"), catalog year
# 6f29fb29-07a2-426c-8b94-543c353843bf. Same caveats as every fixture in this
# directory: prereqs are hand-written (Acalog publishes none), offered_terms
# are hand-written guesses, not run through `refresh-offerings`.
#
# NOTE ON PSYCHOLOGICAL SCIENCES: this task originally aimed for a Liberal
# Arts psychology fixture, but Purdue's Department of Psychological Sciences
# was moved into the College of Health And Human Sciences in a real
# department reorganization — it is not a Liberal Arts program any more, so
# it would have been the wrong "school" for this exercise. Communication
# (Brian Lamb School of Communication) is the substitute — genuinely Liberal
# Arts, and one of the college's largest majors.
#
# WHAT MAKES THIS PROGRAM'S REQUIREMENT SHAPE DIFFERENT FROM CS/ME, AND WHAT
# THIS FIXTURE DELIBERATELY DOES NOT MODEL:
#   - The major itself is organized into lettered sub-blocks (A. Pre-Com,
#     B. Introductory, C. Research Methods, D. Writing, E. Experiential
#     Learning) each with its own small credit target — real, from the
#     crawl, and modeled here as separate requirement_groups.
#   - THE LIBERAL ARTS CORE ITSELF (the college-wide "Other Departmental"
#     requirement, real credit range 35-76) IS NOT FAITHFULLY MODELED. It is
#     the single biggest structural feature of this college and, unlike
#     Ag's/Business's/Education's own college-wide layers, it crawled as
#     three huge disciplinary-breadth categories (Core I/II/III) with almost
#     no option rows — genuinely prose, not a gap in this fixture's effort.
#     `gen-ed-selective` below is a thin, honest stand-in (the same reused
#     UCC pool every other fixture in this directory uses for its own
#     prose-only college requirements), not an attempt at the real thing.
#     Treat this fixture as good for exercising the MAJOR's own sequencing
#     and NOT as a credible stand-in for how big or picky Liberal Arts Core
#     actually is.
#   - The concentration's own 15-credit elective pool is real but was crawled
#     with ~64 options; trimmed to 18 representative ones here, same kind of
#     curation `mechanical_engineering.yaml` applies to its own ~90-option
#     technical-elective list.
# =============================================================================


  # ---- MI selectives added 2026-07-31: WIDENING A STARVED CHOICE ---------------
  # THIS CHANGED `fixture_hash`. Every run recorded before 2026-07-31 is no longer
  # comparable to one recorded after.
  #
  # The problem these fix is not accuracy, it is CHOICE. `mi-selective` asked for 6
  # credits from 7 options, `cs-elective` for 6 from 6, and `gen-ed-selective` for 6
  # from 3 — a group where two of the three options are effectively mandatory is not
  # a selective, it is a required block with extra steps. Worse for the thing this
  # eval measures: nearly every cs-elective option sat behind CS 25200, so the only
  # legal placements were late, and a model with a scheduling gap in an early term
  # had nothing it was allowed to put there. Models were being scored on sequencing
  # while being handed a menu that only permitted one sequence.
  #
  # APPENDED, NEVER INSERTED. `select_remaining_courses` (both here and in the app)
  # is a greedy walk down each group's `courses:` list until the credit target is
  # met, so options added at the END are invisible to it: the deterministic planner
  # picks exactly what it picked before, the Mode A baseline is byte-identical, and
  # `run.py parity` still holds. Mode B, where the model picks freely, sees the whole
  # widened menu — which is the arm the change is for.
  #
  # Each new course appears in exactly ONE requirement group. Coverage is computed
  # per group with no cross-group deduction, so listing a course twice would let it
  # satisfy two groups at once; the existing CS 47100/CS 47300 overlap between

# =============================================================================
# PLAN-OF-STUDY GROUND TRUTH — Computer Science BS, Machine Intelligence track
#
#   verified: false     <-- READ THIS BEFORE QUOTING ANY NUMBER FROM A RUN
#
# This file is the scoring authority for the plan-of-study eval: every viability
# check (prereqs, term offerings, credit caps, requirement coverage) is decided
# against the rows below and nothing else. If a row here is wrong, every model is
# scored wrong in the same direction — which is survivable for RANKING models
# against each other, and fatal for any claim about real Purdue degree progress.
#
# PROVENANCE, honestly (this box's catalog Postgres is empty — the 2026-2027
# crawl did not come with the machine, so none of this was derived from it):
#
#   credits, titles, course codes ...... from the Purdue catalog as I know it.
#                                        Spot-check against catalog.purdue.edu.
#   prereqs ........................... NOT PUBLISHED in Acalog (TODO.md §2.5 —
#                                        this is why the app's own catalog has no
#                                        prereq edges at all). Hand-written here
#                                        because a plan eval without prereq edges
#                                        cannot measure sequencing, which is the
#                                        single most important thing a plan of
#                                        study has to get right. These are the
#                                        highest-risk rows in the file.
#   offered_terms ..................... OBSERVED from PurdueIO Classes rows via
#                                        `run.py refresh-offerings` — a course is
#                                        'offered in fall' because it RAN in falls,
#                                        not because anything declares it. The count
#                                        in each row's comment is the evidence: 9
#                                        terms is a pattern, 3 is a hint, and absence
#                                        is the weakest signal of all. Previously
#                                        hand-written, and wrong (CS 47300 was
#                                        recorded spring-only; it runs fall-only).
#   (superseded note) ................. The
#                                        "fall only" / "spring only" entries are
#                                        the ones that make sequencing non-trivial;
#                                        if they are wrong, models are being
#                                        penalised for a constraint that does not
#                                        exist. Treat term-violation counts as the
#                                        softest metric in the report.
#
# HOW TO VERIFY (do this before the write-up, not before the run — the run is
# still useful for ranking while unverified):
#   1. Restore/re-crawl the catalog DB (catalog_ingestion: `make restore`, or
#      `make sync-programs YEAR=2026-2027`).
#   2. `python run.py fixture-check` diffs codes/credits/titles in this file
#      against the `courses` + `requirement_options` tables and prints a report.
#   3. Prereqs and offered_terms will NOT be verifiable that way — the catalog
#      has neither. Those need the course scheduler / department plan of study.
#
# Editing this file changes scores. The harness hashes it into every plan record
# (`fixture_hash`) and the report refuses to pool records with different hashes.
# =============================================================================

program:
  name: "Computer Science, BS — Machine Intelligence concentration"
  slug: "cs"
  # Real, crawled Postgres program this fixture's scenarios were written against —
  # Mode B/C read this program's live catalog via `harness/real_db.py`, same source
  # `mechanical_engineering.yaml`'s own header describes. Selected by `run.py`'s
  # `--major`/multi-school loop, not a live DB text search — see `run.py resolve_major`.
  # RE-POINTED 2026-08-10 for this box's own fresh crawl — see config.yaml's real_db.program_id
  # comment for how this UUID was verified (145 requirement_groups / 19 top-level, matching
  # this program page's own "48 requirement groups (19 top-level)" parse). Old value
  # (4aecc496-3cfd-4090-b822-334e09007668) was the original dev machine's row and does not
  # exist in this database.
  real_db_program_id: "fc72500c-2942-497c-b5bf-411a33700333"
  # SCOPE, added 2026-08-09 — Mode B/C now measure ONLY this program's own major-scope
  # requirement groups (real_db._scope_for == "program"); college/university-scoped groups
  # (gen-ed, First-Year Engineering, ...) are dropped from what the model is shown and
  # scored against, tested standalone instead by their own pseudo-major fixture — see
  # engineering_core.yaml / agriculture_core.yaml / gen_ed_world_language.yaml and
  # real_db.fetch_real_db_base's `scope_filter` docstring. "" (absent) = unfiltered, the
  # old/default behaviour every fixture had before this field existed.
  requirement_scope: "major"
  catalog_year: "2026-2027"
  campus: "West Lafayette"
  total_credits_min: 120
  verified: false

  # MAJOR-COURSE LOAD CAP — added 2026-07-29, and unlike a prerequisite it is a
  # STUDENT-EXPERIENCE rule, not a registration rule: nothing at Purdue stops you enrolling in
  # five CS courses at once. It stayed in the scoring authority as a SOFT signal because the
  # models kept doing it (4- and 5-CS semesters all over the transcripts) and so did this
  # repo's own deterministic planner, and a plan nobody would follow is worth noticing even
  # though it is not illegal.
  #
  #   max_       = 3   Reported by a 4+1 BS/MS student fitting BS and MS courses into the same
  #                    terms, i.e. about the heaviest real load there is. SOFT as of
  #                    2026-08-07 — a fourth CS course in one term no longer makes the plan
  #                    NOT VIABLE (`major_overload_violation` was removed the same way and for
  #                    the same reason as the credit-cap violation: it is a term the student
  #                    can adjust by asking, not a wall they hit). It still counts toward
  #                    `soft_major_overloads`.
  #
  #   preferred_ = 3   EQUAL TO `max_`, i.e. the soft preference is OFF as of 2026-07-31 — see
  #                    git history if re-enabling a stricter preferred value than the (now also
  #                    soft) ceiling above.
  #
  # Scenario profiles inherit these and may override either one (a student who asks for a
  # lighter major load gets it via their own `profile:` block).
  major_subject: "CS"
  preferred_major_courses_per_semester: 3
  max_major_courses_per_semester: 3

  # CREDIT TARGET vs CREDIT CAP — added 2026-07-29, the companion knob to the pair above.
  # `max_credits_per_semester` (on each scenario's profile) says what a semester may never
  # exceed. It says nothing about what a semester should AIM for, and filling every term to the
  # cap is what produced the front-loaded shape the planner had until now: mi-fresh-start put
  # 85 credits into 6 of the student's 8 semesters as [16, 15, 14, 16, 15, 9] and left the last
  # two empty. Legal, and a worse four years than ~11 credits a term.
  #
  # null = DERIVE PER TERM as ceil(credits still to place / semesters still available), clamped
  # by the cap. Deriving beats a fixed number because it self-corrects — a term that cannot
  # reach the target (prereqs unmet, nothing offered) raises the target for the terms after it,
  # so the work lands inside the horizon instead of a 3-credit stub at the end.
  #
  # Measured effect on the deterministic planner, all 9 scenarios: every one now uses its FULL
  # horizon (was 1-3 terms short), credit spread fell from 7-13 to 2-4, coverage and viability
  # unchanged, 0 courses unplanned. Set this to the same value as the cap to get the old
  # front-loading back; set it per scenario to model a student who wants a specific load.
  #
  # Was set to 15 on 2026-08-06 (a typical full-time load, on request) and REVERTED TO null on
  # 2026-08-12, together with the "aim for N per semester" clause in the Mode B prompt. The
  # objective is finishing the requirements, evenly spread — not hitting a per-semester quota,
  # which a scenario with fewer remaining credits than 15 x semesters can only hit by
  # front-loading, the exact shape null was added to fix. Every fixture in this directory is
  # null now; set it back here (or per scenario) to model a student who asks for a specific load.
  target_credits_per_semester: null

  # THE REGISTRAR'S CEILING — added 2026-08-02, the third and last number in this family, and
  # the only one that is a rule about the UNIVERSITY rather than about a student. 18 credits is
  # a normal full-time overload at Purdue; past it you need a dean's signature. That is what
  # makes 19 categorically different from 17, and 17 not different at all.
  #
  # What this fixed: `max_credits_per_semester` (per scenario, 15 or 16 — the number the student
  # ASKS FOR in their own words) was also the viability threshold, so a 17-credit term scored as
  # `credit_cap_violation` and took PLAN_VIABLE to false — the same verdict the scorer gives a
  # course scheduled before its own prerequisite. One of those is a registration wall; the other
  # is a term the student would have to be talked into. Observed on qwen3.6-27b/mi-fresh-start:
  # 100% requirement coverage, a legal 8-semester shape, failed on 17 credits in term 1.
  #
  # It was also double billing. The student's number is ALREADY scored by name, as the
  # `max_credits_at_most` assertion under "did it do what the student asked" — where a plan that
  # ignores a stated preference belongs. It now shows up there and only there, plus a
  # `soft_credit_overages` count, and viability is reserved for what a registrar would refuse.
  #
  # This is deliberately NOT in any prompt. Models are told the student's number and a target to
  # AIM for (ceil(credits outstanding / semesters available)); telling them 18 exists would just
  # hand them a bigger number to fill to, which is the front-loading failure this file spent
  # 2026-07-29 removing. It is a scoring-side constant.
  hard_credit_cap: 18


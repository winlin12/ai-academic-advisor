# --- degree requirements -----------------------------------------------------
# `kind: all`    -> every listed course must appear in the plan (or be completed)
# `kind: choose` -> enough listed courses to reach `choose_credits`
#
# A plan is COMPLETE only when every group below is satisfied. Groups are what
# `requirement_coverage` is computed over, so a model that schedules 8 pretty
# semesters of electives and skips CS 38100 scores badly no matter how legal the
# sequencing is — which is the point.

requirement_groups:
  - id: cs-core
    name: "Computer Science Core"
    kind: all
    courses: ["CS 18000", "CS 18200", "CS 24000", "CS 25000", "CS 25100", "CS 25200", "CS 38100"]

  - id: mi-required
    name: "Machine Intelligence — required"
    kind: all
    courses: ["CS 37300"]

  - id: mi-ai-choice
    name: "Machine Intelligence — AI course (choose one)"
    kind: choose
    choose_credits: 3
    courses: ["CS 47100", "CS 47300"]

  - id: mi-selective
    name: "Machine Intelligence — selectives (choose two)"
    kind: choose
    choose_credits: 6
    courses: ["CS 43900", "CS 44800", "CS 45600", "CS 45800", "CS 48300", "CS 47100", "CS 47300"]

  - id: cs-elective
    name: "Additional CS courses at the 400 level"
    kind: choose
    choose_credits: 6
    # ORDER MATTERS, and not for the reason you'd expect. The app's selective picker
    # (planner_catalog.select_remaining_courses, ported in harness/fixtures.py) is greedy:
    # it takes options in catalog order until the credit target is met, with no lookahead
    # about whether the courses it picked are actually schedulable. CS 35200 is fall-only
    # AND gated behind CS 25200, so putting it first made the deterministic baseline
    # unsatisfiable in five of eight scenarios — `run.py check` caught it. The flexible
    # fall/spring options lead here so the baseline is reachable; the greedy-picker
    # weakness is real and worth fixing in the app, but it is not what this eval measures.
    courses: ["CS 35400", "CS 49000", "CS 42200", "CS 42600", "CS 44000", "CS 35200"]

  - id: mathematics
    name: "Mathematics And Statistics"
    kind: all
    courses: ["MA 16100", "MA 16200", "MA 26100", "MA 26500", "STAT 35000"]

  - id: science
    name: "Laboratory Science Sequence"
    kind: all
    courses: ["PHYS 17200", "PHYS 24100"]

  - id: gen-ed-core
    name: "University Core — written, oral, humanities"
    kind: all
    courses: ["ENGL 10600", "COM 11400", "SCLA 10100"]

  - id: gen-ed-selective
    name: "University Core — additional selectives"
    kind: choose
    choose_credits: 6
    courses: ["PHIL 15000", "ECON 25100", "PSY 12000"]

# --- scenarios ---------------------------------------------------------------
# Each scenario is one (profile, ask) pair run against every model, N times.
#
# `feedback` drives MODE A (the app's real revise-plan path: the model returns a
# PlanEditProposal and the deterministic planner rebuilds the schedule).
# `assertions` are machine-checkable statements about whether the student's ask
# was actually honoured — this is what stops Mode A from scoring every model
# identically just because the planner guarantees legality.
#
# MODE B (free-form: the model emits the whole schedule itself) uses the same
# profile and the same feedback as a stated preference, and is scored on plan
# viability directly.

scenarios:
  - id: mi-fresh-start
    label: "Incoming CS major, MI track, nothing completed"
    profile:
      name: "Avery"
      degree_program: "Computer Science, BS — Machine Intelligence"
      completed_courses: []
      start_term: fall
      start_year: 2026
      semesters_to_plan: 8
      max_credits_per_semester: 16
    feedback: >-
      I'm starting from scratch and I want to concentrate in machine intelligence.
      Please get me into the AI and machine learning courses as early as the
      prerequisites allow, and keep every semester at 16 credits or under.
    assertions:
      - kind: scheduled_before
        course: "CS 37300"
        semester_index: 6
        why: "MI's anchor course; a plan that defers it to the last year is a bad MI plan."
      - kind: max_credits_at_most
        value: 16

  - id: mi-sophomore-catchup
    label: "Second-year student switching into the MI track"
    profile:
      name: "Jordan"
      degree_program: "Computer Science, BS — Machine Intelligence"
      completed_courses: ["CS 18000", "CS 18200", "CS 24000", "MA 16100", "MA 16200", "ENGL 10600"]
      start_term: fall
      start_year: 2026
      semesters_to_plan: 6
      max_credits_per_semester: 15
    feedback: >-
      I just switched into the machine intelligence concentration and I have three
      years left. I care most about finishing the CS core on time so the AI
      electives aren't blocked, and I'd rather not stack two project-heavy courses
      in the same semester.
    assertions:
      - kind: scheduled_before
        course: "CS 25100"
        semester_index: 2
        why: "CS 25100 gates every MI course; late placement cascades into an unfinishable plan."
      - kind: max_credits_at_most
        value: 15

  - id: mi-light-load
    label: "MI student who needs a reduced credit load"
    profile:
      name: "Sam"
      degree_program: "Computer Science, BS — Machine Intelligence"
      completed_courses: ["CS 18000", "MA 16100", "ENGL 10600", "COM 11400"]
      start_term: fall
      start_year: 2026
      semesters_to_plan: 8
      max_credits_per_semester: 15
    feedback: >-
      I'm working part time, so please cap me at 12 credits a semester and push the
      theory-heavy courses later if that's possible.
    assertions:
      - kind: max_credits_at_most
        value: 12
        why: "The student named an explicit cap; honouring it is the whole ask."
      - kind: proposal_sets_credit_cap
        value: 12

  - id: mi-ai-early
    label: "MI student who wants AI coursework front-loaded"
    profile:
      name: "Riley"
      degree_program: "Computer Science, BS — Machine Intelligence"
      completed_courses: ["CS 18000", "CS 18200", "CS 24000", "CS 25000", "CS 25100",
                          "MA 16100", "MA 16200", "MA 26100", "STAT 35000", "ENGL 10600"]
      start_term: fall
      start_year: 2026
      semesters_to_plan: 4
      max_credits_per_semester: 16
    feedback: >-
      I've finished the intro sequence and I want CS 37300 and the AI course in my
      first two semesters if the prerequisites are already satisfied.
    assertions:
      - kind: scheduled_before
        course: "CS 37300"
        semester_index: 2
        why: "Prereqs (CS 25100 + STAT 35000) are already complete — there is no legal excuse to defer it."
      - kind: any_scheduled_before
        courses: ["CS 47100", "CS 47300"]
        semester_index: 2

  - id: mi-summer-accelerate
    label: "MI student compressing the degree using summers"
    profile:
      name: "Casey"
      degree_program: "Computer Science, BS — Machine Intelligence"
      completed_courses: ["CS 18000", "MA 16100", "ENGL 10600"]
      start_term: summer
      start_year: 2026
      semesters_to_plan: 9
      max_credits_per_semester: 16
    feedback: >-
      I want to graduate as fast as possible and I'm happy to take summer classes.
      Please use every term available, including summers.
    notes: >-
      Starting in SUMMER is the trap: several CS core courses are fall/spring only,
      so a model that ignores offered_terms will stuff the first semester and fail.
    assertions:
      - kind: max_credits_at_most
        value: 16

  - id: mi-spring-start
    label: "Spring-start transfer student"
    profile:
      name: "Devin"
      degree_program: "Computer Science, BS — Machine Intelligence"
      completed_courses: ["MA 16100", "MA 16200", "ENGL 10600", "COM 11400", "PSY 12000"]
      start_term: spring
      start_year: 2027
      semesters_to_plan: 8
      max_credits_per_semester: 16
    feedback: >-
      I transferred in with my math and gen-ed credits done and I'm starting in the
      spring. Get me through the CS core and into the machine intelligence courses.
    notes: >-
      A spring start shifts every fall-only course by one position. Models that
      memorised a canonical fall-start plan-of-study reproduce it verbatim here and
      collect term violations.
    assertions:
      - kind: scheduled_before
        course: "CS 18200"
        semester_index: 2
      - kind: max_credits_at_most
        value: 16

  - id: mi-theory-averse
    label: "MI student who wants theory pushed back"
    profile:
      name: "Emerson"
      degree_program: "Computer Science, BS — Machine Intelligence"
      completed_courses: ["CS 18000", "CS 18200", "CS 24000", "MA 16100", "MA 16200",
                          "ENGL 10600", "COM 11400"]
      start_term: fall
      start_year: 2026
      semesters_to_plan: 6
      max_credits_per_semester: 15
    feedback: >-
      Theory-heavy courses are my weakest area. Please schedule them as late as you
      legally can and keep the AI courses early — but I still need to graduate in
      six semesters.
    notes: >-
      Tests whether the model can express a preference (avoid_tags: theory-heavy in
      Mode A) WITHOUT breaking completion — CS 38100 is both theory-heavy and a hard
      prerequisite for CS 48300, so deferring it too far makes the plan unfinishable.
    assertions:
      - kind: max_credits_at_most
        value: 15
      - kind: any_scheduled_before
        courses: ["CS 47100", "CS 47300"]
        semester_index: 4

  - id: mi-tight-horizon
    label: "One semester left, more requirements than fit"
    # Declares to `run.py check` that a viable plan is IMPOSSIBLE here by design, so the
    # reachability check doesn't flag it as a broken scenario. The report reads the same
    # flag and scores this row on violations and honest reporting, not on PLAN_VIABLE.
    expect_unsatisfiable: true
    profile:
      name: "Frankie"
      degree_program: "Computer Science, BS — Machine Intelligence"
      completed_courses: ["CS 18000", "CS 18200", "CS 24000", "CS 25000", "CS 25100",
                          "CS 25200", "MA 16100", "MA 16200", "MA 26100", "MA 26500",
                          "STAT 35000", "ENGL 10600", "COM 11400", "SCLA 10100",
                          "PHYS 17200", "PHYS 24100", "PSY 12000", "ECON 25100"]
      start_term: fall
      start_year: 2026
      semesters_to_plan: 1
      max_credits_per_semester: 15
    feedback: >-
      I have one semester left. Tell me the best I can do and be honest about what
      won't fit.
    notes: >-
      DELIBERATELY UNSATISFIABLE — 21 credits of requirements remain and one
      15-credit semester cannot hold them. The right behaviour is a legal partial plan plus an honest
      "unplanned" list, NOT an invented extra semester or a 21-credit term. Expect
      PLAN_VIABLE = 0% for every model (coverage cannot reach 1.0); the signal here
      is the violation counts and `over_horizon`, so read this row differently from
      the others.
    assertions:
      - kind: max_credits_at_most
        value: 15

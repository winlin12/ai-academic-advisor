# --- degree requirements -----------------------------------------------------
# `kind: all`    -> every listed course must appear in the plan (or be completed)
# `kind: choose` -> enough listed courses to reach `choose_credits`
#
# A plan is COMPLETE only when every group below is satisfied. Groups are what
# `requirement_coverage` is computed over, so a model that schedules 8 pretty
# semesters of electives and skips CS 38100 scores badly no matter how legal the
# sequencing is — which is the point.

requirement_groups:
  - id: cs-core
    name: "Computer Science Core"
    kind: all
    courses: ["CS 18000", "CS 18200", "CS 24000", "CS 25000", "CS 25100", "CS 25200", "CS 38100"]

  - id: mi-required
    name: "Machine Intelligence — required"
    kind: all
    courses: ["CS 37300"]

  - id: mi-ai-choice
    name: "Machine Intelligence — AI course (choose one)"
    kind: choose
    choose_credits: 3
    courses: ["CS 47100", "CS 47300"]

  - id: mi-selective
    name: "Machine Intelligence — selectives (choose two)"
    kind: choose
    choose_credits: 6
    # The last three were APPENDED 2026-07-31 and must stay last: the greedy picker
    # stops as soon as the 6-credit target is met, so anything added at the end is
    # invisible to the deterministic baseline and visible only to Mode B, where the
    # model chooses. Insert one in the middle and every Mode A baseline shifts.
    courses: ["CS 43900", "CS 44800", "CS 45600", "CS 45800", "CS 48300", "CS 47100", "CS 47300",
              "CS 34800", "CS 47500", "STAT 41600"]

  - id: cs-elective
    name: "Additional CS courses at the 400 level"
    kind: choose
    choose_credits: 6
    # ORDER MATTERS, and not for the reason you'd expect. The app's selective picker
    # (planner_catalog.select_remaining_courses, ported in harness/fixtures.py) is greedy:
    # it takes options in catalog order until the credit target is met, with no lookahead
    # about whether the courses it picked are actually schedulable. CS 35200 is fall-only
    # AND gated behind CS 25200, so putting it first made the deterministic baseline
    # unsatisfiable in five of eight scenarios — `run.py check` caught it. The flexible
    # fall/spring options lead here so the baseline is reachable; the greedy-picker
    # weakness is real and worth fixing in the app, but it is not what this eval measures.
    #
    # APPENDED 2026-07-31, same rule as mi-selective — the four new options stay last
    # so the greedy picker still takes CS 35400 + CS 49000 and the baseline does not
    # move. Two of them (CS 31400, CS 33400) are the only electives in this group that
    # do NOT require CS 25200, which is the whole reason they are here.
    courses: ["CS 35400", "CS 49000", "CS 42200", "CS 42600", "CS 44000", "CS 35200",
              "CS 31400", "CS 33400", "CS 30700", "CS 40800"]

  - id: mathematics
    name: "Mathematics And Statistics"
    kind: all
    courses: ["MA 16100", "MA 16200", "MA 26100", "MA 26500", "STAT 35000"]

  - id: science
    name: "Laboratory Science Sequence"
    kind: all
    courses: ["PHYS 17200", "PHYS 24100"]

  - id: gen-ed-core
    name: "University Core — written, oral, humanities"
    kind: all
    courses: ["ENGL 10600", "COM 11400", "SCLA 10100"]

  - id: gen-ed-selective
    name: "University Core — additional selectives"
    kind: choose
    choose_credits: 6
    # Was three options for a 6-credit target — the tightest group in the fixture and
    # the one most often left short. Six APPENDED 2026-07-31 (last, per the rule
    # above): the picker still takes PHIL 15000 + ECON 25100 for the baseline, and
    # Mode B now has nine prereq-free, every-term courses to fill a light term with.
    courses: ["PHIL 15000", "ECON 25100", "PSY 12000",
              "HIST 10300", "PHIL 11000", "POL 10100", "SOC 10000", "ANTH 10000", "ECON 25200"]

# --- scenarios ---------------------------------------------------------------
# Each scenario is one (profile, ask) pair run against every model, N times.
#
# `feedback` drives MODE A (the app's real revise-plan path: the model returns a
# PlanEditProposal and the deterministic planner rebuilds the schedule).
# `assertions` are machine-checkable statements about whether the student's ask
# was actually honoured — this is what stops Mode A from scoring every model
# identically just because the planner guarantees legality.
#
# MODE B (free-form: the model emits the whole schedule itself) uses the same
# profile and the same feedback as a stated preference, and is scored on plan
# viability directly.

scenarios:
  - id: mi-fresh-start
    label: "Incoming CS major, MI track, + Data Science 2nd major + Math minor"
    profile:
      name: "Avery"
      degree_program: "Computer Science, BS — Machine Intelligence"
      completed_courses: []
      start_term: fall
      start_year: 2026
      semesters_to_plan: 8
      max_credits_per_semester: 16
    # SECOND MAJOR + MINOR, added 2026-08-11 — the first scenario in this harness to test one.
    # Keyed on Purdue's own `programs.poid`, not the crawl's surrogate UUID, so a re-crawl does
    # not orphan them the way it orphaned 16 of 19 fixtures' `real_db_program_id`.
    #
    # THIS IS THE HARDEST SCENARIO IN THE SET BY DESIGN, and the point is what it exposes: three
    # programs' requirement groups at once, unlimited double counting between them (a course
    # satisfies every list it appears in), but credits counted once per distinct course toward
    # the graduation minimum. A model that treats the three as independent will schedule the
    # same course three times or blow the 8-semester horizon; a model that over-shares will
    # satisfy every group and land short on real credits. Both failures are visible in
    # `total_credits` / `meets_graduation_credits` against `requirement_coverage`.
    #
    # NOTE the catalog lists two undergraduate "Data Science" programs (poid 35150 and 35637,
    # near-identical option counts). 35150 is used here; if a re-crawl makes them distinguishable
    # this should be revisited rather than assumed still right.
    additional_programs:
      - poid: "35150"
        kind: major
        label: "Data Science"
      - poid: "34871"
        kind: minor
        label: "Mathematics"
    feedback: >-
      I'm starting from scratch and I want to concentrate in machine intelligence.
      I'm also pursuing a second major in Data Science and a minor in Mathematics,
      so please use courses that count toward more than one of those wherever the
      catalog allows it. Please get me into the AI and machine learning courses as
      early as the prerequisites allow.
    assertions:
      - kind: scheduled_before
        course: "CS 37300"
        semester_index: 6
        why: "MI's anchor course; a plan that defers it to the last year is a bad MI plan."
      - kind: max_credits_at_most
        value: 16
    # Starting from scratch — matches this scenario's own feedback text.
    world_language:
      subject: FR
      level: 1

  - id: mi-sophomore-catchup
    label: "Second-year student switching into the MI track"
    profile:
      name: "Jordan"
      degree_program: "Computer Science, BS — Machine Intelligence"
      completed_courses: ["CS 18000", "CS 18200", "CS 24000", "MA 16100", "MA 16200", "ENGL 10600",
                          "COM 11400", "PSY 12000"]
      start_term: fall
      start_year: 2026
      semesters_to_plan: 6
      max_credits_per_semester: 15
    feedback: >-
      I just switched into the machine intelligence concentration and I have three
      years left. I care most about finishing the CS core on time so the AI
      electives aren't blocked, and I'd rather not stack two project-heavy courses
      in the same semester.
    assertions:
      - kind: scheduled_before
        course: "CS 25100"
        semester_index: 2
        why: "CS 25100 gates every MI course; late placement cascades into an unfinishable plan."
      - kind: max_credits_at_most
        value: 15
    world_language:
      subject: GER
      level: 2

  - id: mi-light-load
    label: "MI student who needs a reduced credit load"
    profile:
      name: "Sam"
      degree_program: "Computer Science, BS — Machine Intelligence"
      completed_courses: ["CS 18000", "MA 16100", "ENGL 10600", "COM 11400", "SOC 10000"]
      start_term: fall
      start_year: 2026
      semesters_to_plan: 8
      max_credits_per_semester: 15
    feedback: >-
      I'm working part time, so please cap me at 12 credits a semester and push the
      theory-heavy courses later if that's possible.
    assertions:
      - kind: max_credits_at_most
        value: 12
        why: "The student named an explicit cap; honouring it is the whole ask."
      - kind: proposal_sets_credit_cap
        value: 12
    # Two semesters of Spanish already behind them — see harness/real_db._language_window.
    world_language:
      subject: SPAN
      level: 3

  - id: mi-ai-early
    label: "MI student who wants AI coursework front-loaded"
    profile:
      name: "Riley"
      degree_program: "Computer Science, BS — Machine Intelligence"
      completed_courses: ["CS 18000", "CS 18200", "CS 24000", "CS 25000", "CS 25100",
                          "MA 16100", "MA 16200", "MA 26100", "STAT 35000", "ENGL 10600",
                          "COM 11400", "PHIL 11000", "HIST 10300"]
      start_term: fall
      start_year: 2026
      semesters_to_plan: 4
      max_credits_per_semester: 16
    feedback: >-
      I've finished the intro sequence and I want CS 37300 and the AI course in my
      first two semesters if the prerequisites are already satisfied.
    assertions:
      - kind: scheduled_before
        course: "CS 37300"
        semester_index: 2
        why: "Prereqs (CS 25100 + STAT 35000) are already complete — there is no legal excuse to defer it."
      - kind: any_scheduled_before
        courses: ["CS 47100", "CS 47300"]
        semester_index: 2
    # Free-text theme -> harness/real_db._GEN_ED_THEMES keyword match.
    gen_ed_preference: "more leadership and project-based options"
    world_language:
      subject: CHNS
      level: 2

  - id: mi-summer-accelerate
    label: "MI student compressing the degree using summers"
    profile:
      name: "Casey"
      degree_program: "Computer Science, BS — Machine Intelligence"
      completed_courses: ["CS 18000", "MA 16100", "ENGL 10600", "COM 11400"]
      start_term: summer
      start_year: 2026
      semesters_to_plan: 9
      max_credits_per_semester: 16
    feedback: >-
      I want to graduate as fast as possible and I'm happy to take summer classes.
      Please use every term available, including summers.
    notes: >-
      Starting in SUMMER is the trap: several CS core courses are fall/spring only,
      so a model that ignores offered_terms will stuff the first semester and fail.
    assertions:
      - kind: max_credits_at_most
        value: 16
    world_language:
      subject: ITAL
      level: 1

  - id: mi-spring-start
    label: "Spring-start transfer student"
    profile:
      name: "Devin"
      degree_program: "Computer Science, BS — Machine Intelligence"
      completed_courses: ["MA 16100", "MA 16200", "ENGL 10600", "COM 11400", "PSY 12000",
                          "PHIL 11000", "HIST 10300", "SOC 10000", "POL 10100"]
      start_term: spring
      start_year: 2027
      semesters_to_plan: 8
      max_credits_per_semester: 16
    feedback: >-
      I transferred in with my math and gen-ed credits done and I'm starting in the
      spring. Get me through the CS core and into the machine intelligence courses.
    notes: >-
      A spring start shifts every fall-only course by one position. Models that
      memorised a canonical fall-start plan-of-study reproduce it verbatim here and
      collect term violations.
    assertions:
      - kind: scheduled_before
        course: "CS 18200"
        semester_index: 2
      - kind: max_credits_at_most
        value: 16
    world_language:
      subject: JPNS
      level: 3

  - id: mi-theory-averse
    label: "MI student who wants theory pushed back"
    profile:
      name: "Emerson"
      degree_program: "Computer Science, BS — Machine Intelligence"
      completed_courses: ["CS 18000", "CS 18200", "CS 24000", "MA 16100", "MA 16200",
                          "ENGL 10600", "COM 11400", "PSY 12000"]
      start_term: fall
      start_year: 2026
      semesters_to_plan: 6
      max_credits_per_semester: 15
    feedback: >-
      Theory-heavy courses are my weakest area. Please schedule them as late as you
      legally can and keep the AI courses early — but I still need to graduate in
      six semesters.
    notes: >-
      Tests whether the model can express a preference (avoid_tags: theory-heavy in
      Mode A) WITHOUT breaking completion — CS 38100 is both theory-heavy and a hard
      prerequisite for CS 48300, so deferring it too far makes the plan unfinishable.
    assertions:
      - kind: max_credits_at_most
        value: 15
      - kind: any_scheduled_before
        courses: ["CS 47100", "CS 47300"]
        semester_index: 4
    world_language:
      subject: ARAB
      level: 1

  # REMOVED 2026-08-03 — `mi-tight-horizon` (one semester, 21 credits outstanding).
  # It was the only `expect_unsatisfiable: true` scenario, and it was scored on honest
  # reporting rather than PLAN_VIABLE. The `expect_unsatisfiable` machinery is deliberately
  # LEFT IN PLACE (fixtures.py, report.py, run.py check) so re-adding a scenario like it is a
  # fixture edit and nothing else. Note what leaves with it: no scenario now tests whether a
  # model says "this does not fit" instead of fabricating room for it. Git history has the
  # scenario body if it comes back.
  #
  # This changed `fixture_hash`. Runs recorded before it are not comparable to runs after.

  - id: mi-no-filler
    label: "Student who explicitly refuses the suggested electives"
    profile:
      name: "Kai"
      degree_program: "Computer Science, BS — Machine Intelligence"
      completed_courses: ["CS 18000", "CS 18200", "CS 24000", "MA 16100", "MA 16200",
                          "ENGL 10600", "PHIL 11000"]
      start_term: fall
      start_year: 2026
      semesters_to_plan: 6
      max_credits_per_semester: 99
    feedback: >-
      Please don't put any of the optional seminar or suggested-elective courses in my
      plan — no CS 19300, CS 29100, CS 39100 or COM 21700. I'm paying per credit hour
      and I only want courses that actually count toward my degree requirements.
    notes: >-
      ADDED 2026-07-27 with the suggested electives themselves. Every other scenario
      asks the model to DO something; this one asks it to refrain, which nothing else
      in the fixture tested. The catalog block states these courses are
      `suggested-elective` and no requirement group lists them, so the information
      needed to honour the ask is fully present — a model that schedules one has
      either ignored the student or padded the schedule to look busy.

      READ THIS ROW IN MODE B AND MODE C, NOT MODE A. In Mode A the suggested
      electives are never in `remaining_courses` (they satisfy no requirement group),
      so the deterministic planner cannot schedule them and `none_scheduled` passes
      for every model regardless of what it proposed. It is not evidence there. What
      Mode A can still show is whether the model reached for the
      `avoid_tags: [suggested-elective]` handle, which is visible in the proposal.

      IT IS ALSO THE SHARPEST MODE C PROBE IN THE FIXTURE. The published sample plan
      suggests CS 19300, CS 29100 and CS 39100 by name, in specific semester slots, and
      this student has explicitly refused them. A model that reproduces the template
      schedules exactly the courses the student just said no to — so a Mode C
      `none_scheduled` failure that Mode B did not have is anchoring, caught red-handed
      rather than inferred from the slot-match aggregate.
    assertions:
      - kind: none_scheduled
        courses: ["CS 19300", "CS 29100", "CS 39100", "COM 21700"]
        why: "The student named these four and refused them; scheduling one ignores the ask."
      - kind: max_credits_at_most
        value: 16
    world_language:
      subject: KOR
      level: 2

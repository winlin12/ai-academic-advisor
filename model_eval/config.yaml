llamacpp:
  server_exe: "/home/wylin/ai-academic-advisor/llama.cpp/build/bin/llama-server"
  models_root: "/home/wylin/ai-academic-advisor/models"
  host: "auto"
  port: 8099
  startup_timeout_s: 900
  cooldown_s: 5 
  log_verbosity: 5
  keep_log_lines: 400

run:
  # DROPPED BACK TO 16384, 2026-08-06 — was 32768 since 2026-07-31, when the mock-database
  # export grew past 16384's headroom. That export is gone now: `course_prerequisites` is
  # inlined into `courses` instead of a separate table, `course_planner_terms` was removed
  # outright (no more offering-term scoring — see catalog_export.py's module docstring), and
  # `unresolved_requirement_groups` was trimmed from 8 entries to 1. Measured against the real
  # program (`real_db.program_id` below) at this size: 14311 of 14336 tokens available
  # (num_ctx minus max_plan_tokens), comfortably under, across every `world_language`/
  # `gen_ed_preference` combination tried. Revert to 32768 (or higher) first if Mode B starts
  # exceed_context_size_error-ing again — that error is unambiguous, unlike a silently
  # truncated plan.
  num_ctx: 16384
  parallel: 1
  n_gpu_layers: 999
  n_cpu_moe: 7
  cache_type_k: "f16"
  cache_type_v: "f16"
  temperature: 0.15
  seed: 67
  top_p: 0.9
  max_output_tokens: 1048
  max_plan_tokens: 2048
  runs_per_pair: 1            # N replicates per (model x item) — variance, not luck
  warmup_discard: 2           # generations per model discarded before measurement
  request_timeout_s: 600
  revise_max_iterations: 3
  explain_question: "Why is my plan sequenced this way, and where is it risky?"
  planning_terms: [fall, spring]
  save_transcripts: true
  # plan_a | plan_b | qa | explain | converge (Mode C — see the `convergence:` block below for
  # its own knobs). `run.py run` with no --tasks runs every one of these; `--tasks` narrows it.
  default_tasks: [plan_a, plan_b, qa, explain, converge]

models:
  
  - name: "qwen3.6-27b"
    gguf: "qwen3.6-27b/Qwen3.6-27B-Q4_K_M.gguf"
    bracket: server
    think: false
    # TENSOR-SPLIT SWEEP, 2026-08-09 (RTX 3060 12GB @ CUDA0 / RTX 2060 SUPER 8GB @ CUDA1). Was
    # 0.62,0.38. Measured across 0.45,0.55 -> 0.70,0.30 (400-token /v1/chat/completions bench,
    # server restarted fresh each point): 0.45/0.50 OOM CUDA1 outright, 0.55 crashed (SIGSEGV,
    # right at the edge), 0.60 was the best of everything that ran clean at 19.9 tok/s, then
    # monotonically WORSE moving toward CUDA0 (0.62: 19.3, 0.65: 18.8, 0.70: 17.8) — this model
    # keeps `n_cpu_moe: 7` on top of the split, so loading CUDA0 (the card already doing the
    # most work) further only makes it slower, it does not buy headroom. 0.60 is also not a
    # knife's edge pick: 0.55 already failed, so this sits one full step inside the safe range,
    # not AT the boundary a slightly heavier prompt could cross.
    extra_args: ["--tensor-split", "0.60,0.40"]
  # COMMENTED OUT 2026-08-08 for the school-fixture sweep — only qwen3.6-27b and gemma4-26b are
  # in scope, for time's sake. Uncomment to restore the full model sweep.
  # - name: "qwen3.5-9b"
  #   gguf: "qwen3.5-9b/Qwen3.5-9B-Q4_K_M.gguf"
  #   bracket: 12gb
  #   think: false
  #   extra_args: ["--split-mode", "none", "--main-gpu", "0"]
  #   extra_args: ["--tensor-split", "0.63,0.37"]
  # - name: "gemma4-12b"
  #   gguf: "gemma4-12b/gemma-4-12b-it-IQ4_XS.gguf"
  #   bracket: 12gb
  #   think: false
  #   extra_args: ["--split-mode", "none", "--main-gpu", "0"]
  - name: "gemma4-26b"
    gguf: "gemma4-26b/gemma-4-26B-A4B-it-UD-Q4_K_M.gguf"
    bracket: server
    think: false
    n_cpu_moe: 0
    # TENSOR-SPLIT SWEEP, 2026-08-09 — see qwen3.6-27b's own note just above for the method.
    # Was 0.62,0.38. 0.45/0.50 OOM CUDA1 (this model is fully GPU-resident, `n_cpu_moe: 0`, so
    # it has less slack than qwen's partially-CPU-offloaded footprint). 0.55 and 0.60 tied for
    # best (65.3 / 65.5 tok/s); 0.60 chosen for the same reason as qwen — one step off the
    # observed failure boundary rather than adjacent to it. 0.62 measured 64.1, 0.65 measured
    # 60.6, and 0.70 OOM'd CUDA0 outright (`cudaMalloc failed: out of memory` allocating the KV
    # cache buffer) — this card is the bottleneck past ~0.65, not the one that wants more of
    # the model.
    extra_args: ["--tensor-split", "0.60,0.40"]
  # - name: "qwen3.6-35b-a3b"
  #   gguf: "qwen3.6-35b-a3b/Qwen_Qwen3.6-35B-A3B-Q4_K_M.gguf"
  #   bracket: server
  #   think: false
  #   n_cpu_moe: 9
  #   extra_args: ["--tensor-split", "0.63,0.37"]
  #   # ~5.5 GiB of experts live in system RAM here, past RLIMIT_MEMLOCK; --mlock only produces a
  #   # failed-to-lock warning on every start. The 23.50 above was measured without it.
  #   mlock: false

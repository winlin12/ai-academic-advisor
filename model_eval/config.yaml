# --- HARDWARE, 2026-09-06 ------------------------------------------------------------------
# Two cards: 0 = RTX 3090 Ti (24,564 MiB, sm_86), 1 = RTX 2060 SUPER (8,192 MiB, sm_75).
# The 2060 was added alongside the 3090 Ti, not swapped in. Build is
# -DCMAKE_CUDA_ARCHITECTURES="75;86"; a single-arch binary loads fine and then aborts at the
# first decode with "no kernel image is available for execution on the device".

# --- INFERENCE BACKEND ---------------------------------------------------------------------
# vLLM SINCE 2026-08-22, replacing llama.cpp. The switch was made when the dual-card rig
# (RTX 3060 12 GB + RTX 2060 SUPER 8 GB, both power-limited) was replaced by a single
# RTX 3090 Ti 24 GB. Every llama.cpp knob this file used to carry — `n_gpu_layers`,
# `n_cpu_moe`, `--tensor-split`, `--mlock`, the whole `speculative:` block — existed to fit a
# model across two mismatched cards. On one card with headroom they are all no-ops, and what
# is left to spend is concurrency, which is the thing llama.cpp could not spend: it
# pre-allocated the context window and DIVIDED it between `--parallel` slots, where vLLM pages
# KV per block and gives every concurrent request the full `--max-model-len`.
#
# READ THIS BEFORE COMPARING ANY NUMBER TO AN OLDER RUN. The weights changed with the engine —
# W4A16 `compressed-tensors` here, GGUF Q4_K_M/Q6_K before — so quality numbers recorded under
# this config do NOT pool with anything in `results_full_3060/` or `results_full/`. It is a new
# series. Throughput is not comparable either, and for a second reason: timings are wall-clock
# derived now rather than read from the engine (see harness/vllm_client.py).
vllm:
  # `vllm serve` from the project venv. The harness only ever talks HTTP to the server, so it
  # does not need vLLM importable in its own interpreter — this is the one place the two meet.
  server_exe: "/home/wylin/ai-academic-advisor/.venv/bin/vllm"
  models_root: "/home/wylin/ai-academic-advisor/models"
  host: "auto"
  port: 8099
  # GENEROUS ON PURPOSE. Loading ~19 GB of weights is the small half; vLLM then profiles a
  # forward pass to size the KV pool and captures CUDA graphs, and a model's FIRST launch also
  # populates a compilation cache that later launches reuse. A cold start can be several
  # minutes longer than a warm one, and timing out mid-compile looks exactly like a broken
  # model.
  startup_timeout_s: 1800
  cooldown_s: 5
  keep_log_lines: 400
  gpu_memory_utilization: 0.92
  kv_cache_dtype: "fp8"

# --- ENGINE SELECTION ----------------------------------------------------------------------
# WHICH INFERENCE SERVER `run.py` LAUNCHES. `run.py --engine {llamacpp,vllm}` overrides this
# for one invocation (it sets MODEL_EVAL_ENGINE, the same mechanism `--spec` and `--major` use
# to reach a call chain they do not thread a parameter through).
#
# THE TWO ARE NOT INTERCHANGEABLE AND THE DIFFERENCE IS CONCURRENCY. MEASURED on this box
# 2026-08-26, qwen3.8-27b UD-Q6_K_M fully GPU-resident under llama.cpp:
#
#   load                6 s          (vLLM: minutes — it profiles and captures CUDA graphs)
#   raw prefill       1141 tok/s
#   raw decode        25.9 tok/s
#   8.7k prompt+128    13.7 s serial
#   -c 65536 --parallel 4  ->  CUDA OUT OF MEMORY
#
# That last line is the whole tradeoff. llama.cpp pre-allocates ONE KV pool of `-c` and the
# slots share it (`kv_unified`), so four concurrent 16k requests need `-c 65536`, and 21.49 GiB
# of weights plus that pool does not fit in 23.55 GiB. vLLM pages KV per block, so `parallel: 4`
# costs KV but not window. Under llama.cpp `slot_context` therefore goes back to dividing —
# see harness/server.py.
#
# ⚠ RESULTS DO NOT POOL ACROSS ENGINES, and here not across weights either: GGUF Q6_K here
# against W4A16 compressed-tensors under vLLM. Every `env` record carries `engine` so a file
# can be told apart. This is a THIRD series after `results_full_3060/` and `results_full/`.
engine: llamacpp

# --- WHICH CARDS A MODEL MAY SEE -----------------------------------------------------------
# CUDA_VISIBLE_DEVICES in nvidia-smi numbering (the harness pins CUDA_DEVICE_ORDER=PCI_BUS_ID
# so the two agree). Default is the 3090 Ti alone: a model that already fits on it gets SLOWER
# when llama.cpp is allowed to split layers onto the 8 GB card across a PCIe hop. Per-model
# `gpus:` overrides; no current entry needs to.
gpus: "0"

# --- llama.cpp BACKEND ---------------------------------------------------------------------
llamacpp:
  # Built from source 2026-08-26 against PR #27742 (`model: add Qwen3.8-Flash-Next (qwen4exp)`),
  # a DRAFT branch needed only for Flash-Next. That entry is gone (2026-10-16), so the checkout
  # is free to move to upstream master. CUDA came from
  # pip wheels assembled into `.cudatoolkit` by `.llamacpp-env.sh` — there is no system CUDA and
  # no sudo on this box. Rebuild: see that script, then
  #   cmake -B build -DGGML_CUDA=ON -DCMAKE_CUDA_ARCHITECTURES="75;86" && cmake --build build
  #
  # ⚠ THIS NUMBER HAS TO MATCH THE CARD AND HAS ALREADY BEEN WRONG TWICE. 86 for the 3090 Ti
  # (Ampere), 75 for the 2060 SUPER (Turing). A binary built for the wrong one LOADS THE MODEL
  # AND THEN ABORTS ("no kernel image is available for execution on the device"), so this is the
  # first thing to check when a model that used to work dies in `llama_decode` at startup —
  # it does not present as a build error. Built "75;86" on 2026-09-06; 75 is only needed if a
  # model is pinned to the 2060.
  server_exe: "/home/wylin/ai-academic-advisor/.llamacpp-src/build/bin/llama-server"
  models_root: "/home/wylin/ai-academic-advisor/models"
  host: "auto"
  port: 8098
  # SECONDS. Nothing like vLLM's 1800 is needed — there is no forward-pass profile and no CUDA
  # graph capture, so a 21 GiB model is serving in ~6 s. 900 was sized for the removed
  # Flash-Next (72.5 GB cold read); for every model here now it is pure headroom.
  startup_timeout_s: 900
  cooldown_s: 5
  keep_log_lines: 400
  # KV QUANTIZATION, the llama.cpp spelling of `kv_cache_dtype: fp8`. q8_0 halves KV bytes per
  # token, which is what buys concurrency back on a card this full.
  cache_type_k: "f16"
  cache_type_v: "f16"
  # LAYERS ONTO THE GPU. 99 means "all of them"; a model that does not fit says so at load
  # rather than silently thrashing. Per-model `n_gpu_layers` overrides it.
  n_gpu_layers: 99
  # REQUIRED TO QUANTIZE THE V CACHE, not just a speed knob — `-ctv q8_0` is silently ignored
  # without it. Per-model override exists because an arch with a custom attention path may not
  # support it.
  flash_attn: "on"
  # HOW WEIGHTS REACH MEMORY (`--mlock`/`--no-mmap` are deprecated in this build). `auto` mmaps
  # and lets the OS evict; `mmap+mlock` pins. Pinning is right for a model that FITS and fatal
  # for one that does not (the removed Flash-Next, 72.5-82 GB against ~61 GB RAM, had to stay
  # evictable). `mmap+mlock` is defensible for the entries here, and is untested.
  load_mode: "auto"
  # Verbosity 5 is the only level that logs per-layer device assignment, which is how you tell
  # a fully-offloaded model from one silently half on the CPU.
  log_verbosity: 5

  # --- SPECULATIVE DECODING (restored 2026-08-26) -------------------------------------------
  # MEASURED on the pre-vLLM harness, one ~1841-token plan generation, spec vs --no-spec:
  #
  #   qwen3.6-27b   18.65 -> 25.04 tok/s  (+34%)   96.7% of drafted tokens accepted
  #   qwen3.5-9b    52.44 -> 53.87 tok/s  (+2.7%)  96.0% accepted
  #
  # The gain scales with how expensive the TARGET is per token, which is why it was worth 34%
  # on the 27B and nothing on the 9B. It was worth most of all on qwen3.8-flash-next, whose
  # decode was bound by reading expert weights over DDR4-2666 (+50% at spec_n_max 16); that
  # entry is gone as of 2026-10-16, so the 27B measurement below is the live one.
  #
  # MEASURED AGAIN ON THIS BOX 2026-08-26, qwen3.8-27b UD-Q6_K_M, 12,255-token prompt, 227
  # tokens generated, identical seed and sampler:
  #
  #   --spec-type none          23.0 tok/s   (baseline)
  #   --spec-type draft-simple  47.5 tok/s   +107%   179 of 179 drafts accepted
  #   --spec-type ngram-simple  22.4 tok/s    -3%
  #   --spec-type ngram-cache   18.6 tok/s   -19%    12 of 243 accepted
  #
  # ⚠ THE ngram THEORY DID NOT SURVIVE MEASUREMENT, and the old comment asserting it did is
  # the reason this block now leads with numbers. The argument was that plan output echoes the
  # prompt (course codes appear verbatim in the rendered requirement database), so a
  # prompt-lookup proposer should draft them for free. Acceptance was 4.9%. Free drafting is
  # not free when it is wrong: every rejected token still costs a verification slot, so
  # ngram-cache came out 19% SLOWER than not speculating at all. `none` is the default.
  #
  # `draft-simple` IS THE ONE THAT PAYS, and by more than it used to (+107% here against +34%
  # on the old two-card rig) because a 21.5 GiB Q6_K on one 3090 Ti is even more thoroughly
  # bandwidth-bound — verification of four drafted tokens costs barely more than decoding one.
  # It needs an IDENTICAL vocabulary; llama.cpp aborts at load on a mismatch, which is why it
  # is opt-in per model via `draft: true` and why `run.py check` compares tokenizers first.
  #
  # ⚠ QUALITY DOES NOT POOL ACROSS THIS SETTING. Acceptance depends on the target's sampler
  # agreeing with the proposal, so at temperature 0.15 a speculative run is a near — not exact
  # — reproduction. CONFIRMED on the old stack: two 27B runs, identical prompt and seed,
  # returned different plans. Override per invocation with `run.py run --spec none|ngram|draft`.
  speculative:
    method: "none"
    draft_gguf: "qwen3.5-0.8b-draft/Qwen3.5-0.8B-Q6_K.gguf"
    n_max: 4          # tokens drafted per verification pass
    n_min: 0
    p_min: 0.75       # stop drafting when the proposer's own confidence drops below this
    cache_type_k: "f16"
    cache_type_v: "f16"
    # ALL 24 DRAFT LAYERS ON THE CARD. A partially-offloaded draft adds CPU-speed latency to
    # every verification pass, which is the one thing speculation cannot afford.
    n_gpu_layers_draft: 99
    device_draft: "CUDA0"
  # ⚠ `run.parallel` COSTS VRAM AT LOAD HERE, WHICH IT DOES NOT UNDER vLLM. llama.cpp
  # pre-allocates `num_ctx * parallel` tokens of KV before serving a single request. MEASURED
  # 2026-08-26, qwen3.8-27b UD-Q6_K_M (21.49 GiB of weights) on the 23.55 GiB card:
  #
  #   parallel 1  -c 16384  ->  loads, 22,322 MiB
  #   parallel 2  -c 32768  ->  loads, 22,630 MiB
  #   parallel 3  -c 49152  ->  loads, 23,388 MiB   <- the ceiling at this quant
  #   parallel 4  -c 65536  ->  CUDA error: out of memory
  #
  # `run.parallel` STAYS AT 4 — it is a property of the WORKLOAD ("how many students are on
  # the site at once") and both engines are meant to answer for it. What changes per engine is
  # what can be BOUGHT, so the cap lives here rather than in `run:`. `harness.server.
  # effective_parallel` resolves the two, `runner` records the result as `simulated_users` on
  # every env record, and `start_server` translates the CUDA OOM into the instruction to lower
  # this if a future quant needs it. Raise it if you move to a smaller gguf.
  max_parallel: 1

run:
  # ONE SLOT OF 16384. Reverted 2026-08-11 from the 65536/4 multi-user experiment, on measured
  # evidence that concurrency LOSES throughput on this workload — see `parallel` below. 16384 is
  # a floor, not a preference: Mode B's prompt is ~12.3k tokens (~12.6k for the dual-major
  # scenario) and `max_plan_tokens` is 2048, so a smaller context truncates every plan request
  # and `server.check_slot_context` fails the run rather than let that happen silently.
  num_ctx: 16384
  # HOW MANY STUDENTS ARE ON THE SITE AT ONCE. `runner._run_pool` keeps exactly this many
  # DIFFERENT test cases in flight — four distinct scenarios during the plan stages, four
  # distinct questions during QA. A worker pool, not a batch dump: handing the server every
  # item at once and letting it drain N at a time would measure a backlog draining, which is a
  # different question. Within one scenario the stages stay sequential (plan_a, then plan_b,
  # then explain), because one student does not ask for a plan and its explanation at once.
  #
  # THE MEASUREMENT THAT ORIGINALLY PINNED THIS AT 1 NO LONGER APPLIES. Under llama.cpp:
  #
  #   qwen3.5-9b Mode B, parallel 4:  58.6 s per request -> 4/58.6 = 0.068 req/s
  #   qwen3.5-9b Mode B, serial:      ~12 s per request  -> 1/12   = 0.083 req/s
  #
  # — four-way batching was ~18% SLOWER in aggregate. That was a result about THAT ENGINE:
  # `--parallel 4` cut every request's window to `num_ctx / 4`, four ~12k-token prefills
  # contended on two power-limited cards, and each decode step read the KV of all four over a
  # bus that was already the bottleneck. None of the three is true on vLLM — paged KV does not
  # divide the window, prefix caching prefills the shared prompt once, and continuous batching
  # schedules prefill and decode together. MEASURED at 4 on this card: a 16-program sweep ran
  # ~6.3 min/program against ~69 min/program serially.
  #
  # 1 RIGHT NOW, FOR THE THINKING ARM. Speculation and batching compete for the same spare
  # decode capacity, so an MTP arm measured at 4 reports the leftovers; and a thinking-vs-not
  # comparison is about output QUALITY, where queue time in the latency columns is noise.
  #
  # ⚠ LATENCY AT `parallel > 1` INCLUDES QUEUE TIME and does not pool with a serial run's.
  # Quality is unaffected — same sampler, prompts, schemas. `simulated_users` on every env
  # record says which regime a file was written in.
  parallel: 1
  temperature: 0.15
  seed: 67
  top_p: 0.9
  max_output_tokens: 1048
  # EXPLAIN GETS ITS OWN CEILING. Measured 2026-08-12 on the recorded corpus: at
  # `max_output_tokens` the explain stage truncated on 80-100% of qwen3.5-9b / qwen3.6-27b /
  # qwen3.6-35b-a3b records, every one of them stopping at exactly 1048 tokens. A cut-off
  # explanation is not a worse explanation, it is an unscorable one — the faithfulness and
  # plan-contradiction checks both read a sentence that never finished — so those models were
  # being marked down for a budget rather than for their writing. QA answers are short and
  # stay on `max_output_tokens`.
  max_explain_tokens: 2048
  # STAGE 1 of Mode B/C (course selection). Its output is one line per requirement group with
  # a handful of codes — far shorter than a schedule — but a program with 35 groups still needs
  # room to name them all, and a selection truncated halfway through is scored as a coverage
  # failure that is really a budget failure.
  # How many semantic matches Mode B/C's retrieval adds on top of the exact per-course lookup.
  # 12 keeps the retrieved block to roughly a tenth of the catalog dump it replaced; the exact
  # half is unbounded because every course being placed must appear.
  rag_top_k: 12
  # REASONING BUDGET for the advising stages (QA, explain). 0 = servers launch with
  # `--reasoning off` exactly as before and the stages ask for nothing. Above 0 = every server
  # launches with that budget and QA/explain request reasoning per call, while the plan stages
  # keep asking for it OFF (they are grammar-constrained JSON and a reasoning channel there
  # only starves the output — the muse-glimmer failure, see that entry's history).
  # This is a launch-time switch because a per-request kwarg cannot undo `--reasoning off`.
  #
  # BACK TO 0, 2026-08-14, on wall clock. At 1024 the QA stage went from ~1.1 s to ~8.2 s per
  # question on gemma4-e4b (~568 output tokens for a ~520-character answer), and QA is 39
  # questions x 7 models x 16 programs. Reasoning is worth re-enabling for a targeted
  # experiment on the advising stages — it is not worth paying for on every question of a full
  # sweep before there is any evidence it changes the answers.
  # ABOVE 0 AGAIN, because Mode C needs it: reasoning has to be enabled at LAUNCH for any
  # stage to request it, and Mode C is defined as "Mode B with thinking forced on". The
  # advising stages do NOT ride along — see `advising_thinking` below — so this costs nothing
  # outside Mode C.
  reasoning_budget: 1024
  # Whether QA and explain also request reasoning.
  #
  # THIS IS THE ONE REASONING SWITCH THAT HAS NEVER BEEN MEASURED FOR QUALITY. It was set to
  # false on 2026-08-14 purely on WALL CLOCK — "at 1024 the QA stage went from ~1.1 s to ~8.2 s
  # per question on gemma4-e4b for 39 questions x 7 models x 16 programs, with no evidence yet
  # that the answers improved" — and the same note said to "turn it on for a targeted advising
  # experiment, not for a full sweep". That experiment was never run.
  #
  # IT IS A DIFFERENT QUESTION FROM THE RETIRED PLAN ARM, and the distinction is the whole
  # reason this survived that removal. Plan reasoning had two things working against it that do
  # not apply here: it competed with grammar-constrained JSON for the output budget, and the
  # repair loop already bought what it was supposed to buy (coverage 0.44 -> 0.89) for less.
  # QA and explain are free text with no validator behind them.
  #
  # WHERE THE HEADROOM IS, on the archived vLLM baseline (`results_full_3090_vllm_serial/`):
  # qwen3.8-27b scores `behavior_ok` — did it correctly abstain vs answer — on 294 of 546 QA
  # items (54%), against gemma4-26b's 417 (76%). 18 of the 39 questions are abstain-expected,
  # so that is a judgment failure rather than a knowledge gap, which is the shape of thing
  # pre-answer reasoning is most likely to move.
  advising_thinking: false
  # EXTRA output tokens for QA and explain WHEN `advising_thinking` is on; ignored when it is
  # off. Not a cap — vLLM has no reasoning cap — but headroom, so the reasoning is not paid for
  # out of the answer's budget.
  #
  # 4096 IS SIZED FROM MEASURED REASONING LENGTH, not guessed: qwen3.8-27b reasoned p50 3409,
  # p90 4270, max 5384 tokens across 61 generations. Without this, QA would run with
  # `max_output_tokens` 1048 against ~3400 tokens of reasoning — the answer would be the part
  # that got truncated, and the experiment would measure the ceiling. That is exactly how the
  # plan-reasoning arm produced 3 parseable plans out of 65 on 2026-08-23.
  advising_thinking_headroom: 4096
  max_plan_tokens: 4096
  runs_per_pair: 1            # N replicates per (model x item) — variance, not luck
  warmup_discard: 2           # generations per model discarded before measurement
  request_timeout_s: 600
  revise_max_iterations: 3
  explain_question: "Why is my plan sequenced this way, and where is it risky?"
  planning_terms: [fall, spring]
  save_transcripts: true
  # `plan_b` PRODUCES BOTH MODE B AND MODE C (2026-08-17). Mode B is the model's first,
  # unaided attempt; Mode C is where that same attempt ends up after the validator's findings
  # and `repair_passes` more tries. One generation serves both, so there is no separate task
  # for the retry loop and no `converge` arm any more.
  # `plan_b_thinking` IS BACK OUT of the default sweep (2026-08-21) — MEASURED AND IT DID NOT
  # PAY. See the `thinking:` block for the numbers. It remains available as
  # `--tasks plan_b_thinking` for a targeted re-test; it is simply not worth 3-4x wall clock
  # on every program of every sweep.
  default_tasks: [plan_a, plan_b, qa, explain]
  # EXTRA attempts after the first. 2 gives three total, which is the ceiling worth paying for:
  # measured on the old retry loop, coverage moved on attempts 2 and 3 (0.44 -> 0.67 -> 0.89)
  # and flattened after.
  repair_passes: 2

# --- SPECULATIVE DECODING ------------------------------------------------------------------
# A 0.8B draft model proposes tokens and the model under test verifies them in one batched pass
# (see harness/server.py's own `speculative decoding` section for the mechanism and the flags).
# Generation here is memory-bandwidth-bound, so the verification of four drafted tokens costs
# barely more than decoding one — that is where the wall-clock comes from.
#
# MEASURED ON THIS BOX 2026-08-11, one 8-semester-plan generation (~1841 tokens of JSON, the
# shape every mode here actually produces), same prompt/seed/sampler, spec vs. --no-spec:
#
#   qwen3.6-27b     18.65 -> 25.04 tok/s  (+34%)   96.7% of drafted tokens accepted
#   qwen3.5-9b      52.44 -> 53.87 tok/s  (+2.7%)  96.0% accepted
#

models:
  # qwen3.8-flash-next removed 2026-10-16 (weights deleted). It was the only entry using both
  # cards: `gpus: "0,1"` + `tensor_split: "0.88,0.12"` + `n_cpu_moe: 30`. The 2060 OOMs first
  # at 0.75/0.25 because it also holds its share of the KV pool.
  - name: "qwen3.8-27b"
    model_path: "qwen3.8-27b-gguf/Qwen3.8-27B-UD-Q6_K_M.gguf"
    model_path_vllm: "qwen3.8-27b-awq"
    bracket: server
    think: false
    tool_call_parser: "hermes"
    reasoning_parser: "qwen3"
    draft_model: "qwen3.5-0.8b-draft"
    # hardware swap.
    draft: false
    spec_method: "draft-simple"
    extra_args: []

  - name: "qwen3.8-27b-thinking"
    model_path: "qwen3.8-27b-gguf/Qwen3.8-27B-UD-Q6_K_M.gguf"
    model_path_vllm: "qwen3.8-27b-awq"
    bracket: server
    think: false
    advising_think: true
    tool_call_parser: "hermes"
    reasoning_parser: "qwen3"
    draft_model: "qwen3.5-0.8b-draft"          # vLLM speculative source
    draft: true
    spec_method: "draft-simple"
    extra_args: []

  - name: "gemma4-26b"
    model_path: "gemma4-26b-gguf/gemma-4-26B-A4B-it-UD-Q6_K.gguf"
    model_path_vllm: "gemma4-26b-awq"
    bracket: server
    think: false
    tool_call_parser: "pythonic"
    kv_cache_dtype: "auto"
    extra_args: []

  # Gemma's reasoning variant. Kept for symmetry so the comparison is not qwen-only — but note
  # gemma4-26b produced ZERO reasoning characters when asked (0 of 78 QA records on 2026-08-25),
  # so this arm may simply reproduce the baseline. That is itself the finding for this model:
  # a flat result here means its template opened no reasoning channel, NOT that reasoning was
  # tried and did not help. `reasoning_chars` in the records is what tells the two apart.
  - name: "gemma4-26b-thinking"
    model_path: "gemma4-26b-gguf/gemma-4-26B-A4B-it-UD-Q6_K.gguf"
    model_path_vllm: "gemma4-26b-awq"
    bracket: server
    think: false
    advising_think: true
    tool_call_parser: "pythonic"
    kv_cache_dtype: "auto"
    extra_args: []

paths:
  questions: "questions.yaml"
  results_dir: "results"

# WHAT `run.py run` (no --major) EVALUATES.
#
# TWO CURATED MAJORS PER SCHOOL. These are the rows whose history means something — the same
# programs, sweep after sweep — spread across schools so no one college's quirks stand in for
# the university. They are NAMED here rather than derived because the crawl carries no college:
# every `programs.college_id` is NULL, so which school a program belongs to is knowledge that
# exists in this file and nowhere else. Add a school by adding a key; two entries each is a
# convention, not a limit.
#
# Matched the same way `--major` is (`real_db.resolve_program`: exact name, exact slug, then
# substring), so a name here survives a re-crawl reassigning program UUIDs — which is exactly
# what stranded the old fixture files, every one of which pinned a UUID.
#
# PLUS `random_untested` PROGRAMS DRAWN FRESH EACH SWEEP from everything with no
# `results/results_<slug>/` yet. The curated set was chosen back when each one cost somebody a
# hand-written fixture file, which selects for tidy, well-crawled programs; the random draw is
# the only part of the sweep that puts the harness in front of a program nobody groomed. A
# failure there is a finding, not a broken sweep — `_run_sweep` catches it and carries on.
sweep:
  # PAUSED AT 0, 2026-08-12, pending the registrar conversation about data access and
  # publication. The random draw is the half of the sweep that puts the harness in front of a
  # program nobody groomed, and it is the right default — but until prerequisites exist for
  # more than the curated set (see `real_db._HARDCODED_PREREQS`), a random program would be
  # evaluated with no prerequisite constraints at all and its numbers would not mean what the
  # curated ones mean. Set it back to 2 the moment prerequisite coverage stops being hand-fed.
  random_untested: 0
  curated:
    agriculture:
      - "Animal Sciences: Pre-Veterinary Medicine Concentration"
      - "Agricultural Economics: Applied Agricultural Economics Concentration"
    business:
      - "Accounting"
      - "Finance"
    education:
      - "Elementary Education"
      - "English Education"
    engineering:
      - "Electrical Engineering"
      - "Mechanical Engineering"
    health_human_sciences:
      - "Nursing"
      - "Psychological Sciences"
    liberal_arts:
      # THE CONCENTRATION NAMES, not the bare ones. "Communication" and "Political Science" as
      # exact names are Purdue's GRADUATE programs (MS/PhD/MA); the undergraduate degrees are
      # only ever named by concentration. Resolving the bare name picked the MS and quietly
      # evaluated models against a graduate course list — COM 5xxxx/6xxxx and POL 5xxxx/6xxxx
      # showed up as "required courses" for a student with no bachelor's degree.
      - "Communication: General Communication Concentration"
      - "Political Science: American Politics Concentration"
    polytechnic:
      - "Computer and Information Technology"
      - "Construction Management"
    science:
      - "Computer Science: Machine Intelligence"
      - "Biology"

# Mode B's context: the REAL catalog_ingestion/advisor Postgres DB, read live — no JSON mock
# any more (see harness/real_db.py, harness/catalog_export.py). `program_id` is the real,
# crawled "Computer Science: Machine Intelligence" program (48 requirement groups; NOT the
# 9-group synthetic row that mirrors plan_fixture — see real_db.py's module docstring for why
# that matters for scoring). Override at the CLI with `--major "<search text>"` (interactive
# if it matches more than one program) or MODEL_EVAL_REAL_DB_URL / _PROGRAM_ID directly.
real_db:
  url: "postgresql://catalog:catalog@localhost:5433/catalog_ingestion"
  # RE-POINTED 2026-08-10 for this box's own fresh crawl — program_id is DB-assigned (a plain
  # `sync-program --poid 36006` UUID), not portable between installs. Old value
  # (4aecc496-3cfd-4090-b822-334e09007668) was the original dev machine's row; verified this
  # one instead: `select id from programs where name ilike '%Machine Intelligence%'` ->
  # 145 requirement_groups / 19 top-level, matching this program page's own "48 requirement
  # groups (19 top-level)" parse plus the shared/linked pages it resolves against.
  program_id: "fc72500c-2942-497c-b5bf-411a33700333"
  # UNSET ON PURPOSE. Widens the course universe beyond what a requirement_options row
  # explicitly names — every undergraduate course under these subject prefixes becomes a
  # real, choosable elective, budget permitting — but a FIXED subject applied to every
  # program is wrong the instant `--major` points this at something that isn't CS (see
  # real_db.py's module docstring for the WGSS incident that found this). Leaving this unset
  # auto-detects the one subject required most often by whichever program is actually
  # loaded. Only set it here if you want every run pinned to a specific subject regardless
  # of program — e.g. `broaden_subjects: [CS]` to always widen CS even for a non-CS major.
  # broaden_subjects: [CS]

  # MANUAL OVERRIDE, same spirit as convergence.excluded_prereq_edges below: groups this crawl
  # leaves untyped (requirement_type/credits_min both null) that real_db.py's structural
  # heuristics (container-child, generic "Sequence N"/"Option N" naming, multi-subject) cannot
  # tell apart from a genuine "take every course listed" requirement, because they are
  # single-subject with a descriptive (non-generic) name. Verified by hand for THIS program —
  # confirmed 2026-08-06: "Statistics" is one course, not all five; "PHYSICS I" and "PHYSICS II"
  # are a paired sequence (one course from EACH group -- the group's own name says "Physics I
  # AND Physics II are required for a sequence"), not five PHYS courses combined. Exact
  # requirement_groups.name match; re-verify after any re-crawl since names can drift.
  force_selective_groups:
    - "Statistics"
    - "PHYSICS I - Physics I AND Physics II are required for a sequence."
    - "PHYSICS II - Physics I AND Physics II are required for a sequence."

  # SAME KIND OF MANUAL OVERRIDE, one level down: equivalences the crawl records as separate
  # required courses. `{alias: primary}` — the alias is folded onto the primary everywhere
  # scoring and the rendered database look, exactly like a crawled `course_aliases` row.
  #
  # WHY THIS ONE EXISTS. Purdue's calculus requirement is two ALTERNATIVE SEQUENCES: MA 16100 +
  # MA 16200 (5 credits each) or MA 16500 + MA 16600 (4 each). Acalog lists all four as plain
  # consecutive rows under one "Mathematics" heading with no "or" between them, so the crawl
  # stores four rows with is_required=true and is_selective_option=false — indistinguishable, to
  # `real_db.py`'s chain detector, from a genuine "take all four". The group therefore scored as
  # needing all four, and a plan holding the perfectly valid MA 16100 + MA 16200 was reported
  # `short: missing MA 16500, MA 16600`, dragging down requirement coverage for something no
  # model could have done differently.
  #
  # NOT A GUESS — THE CRAWL ITSELF CORROBORATES BOTH PAIRS, just not in the group that gets
  # scored. Checked against this box's own crawl 2026-08-11: the sibling group "Mathematics
  # (8-10 credits)" stores MA 16100 with is_selective_option=true immediately followed by
  # MA 16500 (and MA 16200 followed by MA 16600) — the "or" chain `real_db.py` already knows how
  # to read — as do the "Fall 1st Year"/"Spring 1st Year" sample-schedule groups. The chain
  # detector only acts on chains found inside a required group, so that evidence never reached
  # the flattened "Mathematics" group. The plan fixture has always modeled this correctly
  # (MA 16500 `equivalent_to: MA 16100`); this is the real-database path agreeing with it.
  #
  # Only applies where the alias is an option of a REQUIRED group of the program being loaded,
  # so this list is safe to share across every school in the multi-school sweep. Re-verify after
  # a re-crawl, same as force_selective_groups above.
  manual_course_aliases:
    "MA 16500": "MA 16100"
    "MA 16600": "MA 16200"

# --- MODE C: retry to convergence -------------------------------------------------------------
# The name is reused: `results_old8/runs_*.jsonl` still holds `"stage": "plan_mode_c"` records
# from the removed reference arm, which measured something else. Those are dead data. What keeps
# them apart is the file (`runs_convergence.jsonl`, not `runs_baseline.jsonl`) and the `variant`
# field, which the old records lack — check for it before pooling. See harness/convergence.py.
convergence:
  # feedback — the model is told what is wrong and must fix it itself.
  # blind    — the model is told nothing; new sample each attempt.
  #
  # "repair" REMOVED 2026-08-08, deliberately, as part of adding multi-school support. It used
  # to also be an option here: the harness deletes violating placements (deterministic; no
  # model needed) and FREEZES everything that validates, so the model is only ever asked to
  # fill what is missing. That auto-repair step has no equivalent in the shipped app —
  # `advisor_agent.revise_plan` never silently deletes and re-plans around a bad placement on
  # the student's behalf — so scoring a model against it was scoring against a capability the
  # product doesn't have. Once every school needs its own plan fixture for Mode C to run at
  # all (see `harness/convergence.locked_slots_path_for`), keeping a variant that measures a
  # non-shippable behavior stopped being worth the added fixture-authoring cost per school.
  # feedback/blind remain — both mirror something a real revise-plan turn can actually do.
  # ONE ARM, 2026-08-13. `blind` / `feedback` / `repair` were three ways of nudging a single
  # fused call that had to choose and sequence at once; with selection split into its own stage,
  # every Mode C pass is the same thing — show the validator's findings, let the model add,
  # remove or move courses. Two arms that behave identically would just buy the same number
  # twice. The field stays so the record shape and the report's per-variant tables are
  # unchanged.
  enabled_variants: [repair]

  # PER TEST CASE, not shared across the batch. A shared budget makes each case's result depend
  # on how slow the previous ones were, which is not a property of the model. 600 s sits in the
  # middle of the specified 5-15 min range and is a whole number of the existing
  # request_timeout_s, so one attempt can never outlive its own case.
  timeout_s: 600

  # CAPPED AT 3, 2026-08-07 (was 10). A model that hasn't converged in 3 tries is not going to be
  # driven to 100% by burning another 7 GPU-minutes on it — in practice a student stops iterating
  # with the assistant and finishes the schedule by hand well before then. Whatever state the case
  # is in at attempt 3 (converged sooner, or not) is now also scored on Mode B's own metrics — see
  # `run_case`'s `real_score`/`rec.update(real_score.as_record())` — so a censored case still
  # yields a comparable viability/coverage snapshot instead of only "did not converge".
  # Independent of the clock, and reported separately (`censor_reason`). A fast model can
  # exhaust 3 attempts well inside 600 s while a slow one times out on attempt 2 — those are
  # different findings and collapsing them into one "did not converge" would hide it.
  max_attempts: 3

  # null = show every violation. A full list makes convergence close to transcription: the
  # model is told exactly which courses are wrong and where, and the mode stops measuring
  # planning. 5 is roughly what an advising UI would surface, and the prompt states how many
  # were withheld so the model knows the list is partial.
  feedback_top_n: 5

  # THE CONVERGENCE CRITERION, as specified: filled slots only, no coverage condition.
  # WARNING: an empty plan satisfies this on attempt 1. `converged_strict` and `degenerate`
  # are recorded next to it for exactly that reason — read all three. Add the other classes
  # (duplicate_course, hallucinated_course, coreq_violation) here to tighten it.
  # credit_cap_violation, term_offering_violation, and major_overload_violation are not valid
  # additions any more — all three were REMOVED 2026-08-07, not just left off this list: none
  # of the three is a registration wall a student can't talk their way around (a heavy
  # semester, credit- or major-course-wise, is the student's own call; a future offering
  # pattern isn't knowable from this data at all), so none of them should decide whether a
  # plan "converged" or is PLAN_VIABLE. See `plan_scorers.py`'s module docstring.
  violation_classes: [prereq_violation]

  # Blind resampling only. The feedback variant holds seed and temperature fixed so its retries
  # differ in CONTEXT alone — otherwise self-correction and resampling luck are confounded.
  # DEADLOCK BREAKER for the repair variant. Freezing on "no violation" is too weak a test: a
  # placement can be legal where it sits and still make the rest of the degree unreachable
  # (CS 25200 validated at semester 7 gates every cs-elective behind it). When a clean plan
  # stops improving its coverage for this many attempts, the frozen courses standing in front
  # of the unmet requirements are released — latest position first — and the model re-places
  # them. Set patience high to approximate the old unconditional ratchet.
  repair_stall_patience: 2
  repair_release_max: 3

  plateau_patience: 3
  plateau_variants: [repair]

  seed_stride: 1000
  temperature_step: 0.05
  temperature_max: 0.80

decision:
  mode_b_viable_floor: 0.90
  mode_a_grounded_floor: 0.90
  plan_viable_gap_pp: 15
  min_plan_scenarios: 8

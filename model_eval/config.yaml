paths:
  plan_fixture: "plan_fixtures/cs_machine_intelligence.yaml"
  questions: "questions.yaml"
  results_dir: "results"

# Mode B's context: the REAL catalog_ingestion/advisor Postgres DB, read live — no JSON mock
# any more (see harness/real_db.py, harness/catalog_export.py). `program_id` is the real,
# crawled "Computer Science: Machine Intelligence" program (48 requirement groups; NOT the
# 9-group synthetic row that mirrors plan_fixture — see real_db.py's module docstring for why
# that matters for scoring). Override at the CLI with `--major "<search text>"` (interactive
# if it matches more than one program) or MODEL_EVAL_REAL_DB_URL / _PROGRAM_ID directly.
real_db:
  url: "postgresql://catalog:catalog@localhost:5433/catalog_ingestion"
  program_id: "4aecc496-3cfd-4090-b822-334e09007668"
  # UNSET ON PURPOSE. Widens the course universe beyond what a requirement_options row
  # explicitly names — every undergraduate course under these subject prefixes becomes a
  # real, choosable elective, budget permitting — but a FIXED subject applied to every
  # program is wrong the instant `--major` points this at something that isn't CS (see
  # real_db.py's module docstring for the WGSS incident that found this). Leaving this unset
  # auto-detects the one subject required most often by whichever program is actually
  # loaded. Only set it here if you want every run pinned to a specific subject regardless
  # of program — e.g. `broaden_subjects: [CS]` to always widen CS even for a non-CS major.
  # broaden_subjects: [CS]

  # MANUAL OVERRIDE, same spirit as convergence.excluded_prereq_edges below: groups this crawl
  # leaves untyped (requirement_type/credits_min both null) that real_db.py's structural
  # heuristics (container-child, generic "Sequence N"/"Option N" naming, multi-subject) cannot
  # tell apart from a genuine "take every course listed" requirement, because they are
  # single-subject with a descriptive (non-generic) name. Verified by hand for THIS program —
  # confirmed 2026-08-06: "Statistics" is one course, not all five; "PHYSICS I" and "PHYSICS II"
  # are a paired sequence (one course from EACH group -- the group's own name says "Physics I
  # AND Physics II are required for a sequence"), not five PHYS courses combined. Exact
  # requirement_groups.name match; re-verify after any re-crawl since names can drift.
  force_selective_groups:
    - "Statistics"
    - "PHYSICS I - Physics I AND Physics II are required for a sequence."
    - "PHYSICS II - Physics I AND Physics II are required for a sequence."

# --- MODE C: retry to convergence -------------------------------------------------------------
# The name is reused: `results_old8/runs_*.jsonl` still holds `"stage": "plan_mode_c"` records
# from the removed reference arm, which measured something else. Those are dead data. What keeps
# them apart is the file (`runs_convergence.jsonl`, not `runs_baseline.jsonl`) and the `variant`
# field, which the old records lack — check for it before pooling. See harness/convergence.py.
convergence:
  # feedback — the model is told what is wrong and must fix it itself.
  # blind    — the model is told nothing; new sample each attempt.
  #
  # "repair" REMOVED 2026-08-08, deliberately, as part of adding multi-school support. It used
  # to also be an option here: the harness deletes violating placements (deterministic; no
  # model needed) and FREEZES everything that validates, so the model is only ever asked to
  # fill what is missing. That auto-repair step has no equivalent in the shipped app —
  # `advisor_agent.revise_plan` never silently deletes and re-plans around a bad placement on
  # the student's behalf — so scoring a model against it was scoring against a capability the
  # product doesn't have. Once every school needs its own plan fixture for Mode C to run at
  # all (see `harness/convergence.locked_slots_path_for`), keeping a variant that measures a
  # non-shippable behavior stopped being worth the added fixture-authoring cost per school.
  # feedback/blind remain — both mirror something a real revise-plan turn can actually do.
  enabled_variants: [feedback, blind]

  # PER TEST CASE, not shared across the batch. A shared budget makes each case's result depend
  # on how slow the previous ones were, which is not a property of the model. 600 s sits in the
  # middle of the specified 5-15 min range and is a whole number of the existing
  # request_timeout_s, so one attempt can never outlive its own case.
  timeout_s: 600

  # CAPPED AT 3, 2026-08-07 (was 10). A model that hasn't converged in 3 tries is not going to be
  # driven to 100% by burning another 7 GPU-minutes on it — in practice a student stops iterating
  # with the assistant and finishes the schedule by hand well before then. Whatever state the case
  # is in at attempt 3 (converged sooner, or not) is now also scored on Mode B's own metrics — see
  # `run_case`'s `real_score`/`rec.update(real_score.as_record())` — so a censored case still
  # yields a comparable viability/coverage snapshot instead of only "did not converge".
  # Independent of the clock, and reported separately (`censor_reason`). A fast model can
  # exhaust 3 attempts well inside 600 s while a slow one times out on attempt 2 — those are
  # different findings and collapsing them into one "did not converge" would hide it.
  max_attempts: 3

  # null = show every violation. A full list makes convergence close to transcription: the
  # model is told exactly which courses are wrong and where, and the mode stops measuring
  # planning. 5 is roughly what an advising UI would surface, and the prompt states how many
  # were withheld so the model knows the list is partial.
  feedback_top_n: 5

  # THE CONVERGENCE CRITERION, as specified: filled slots only, no coverage condition.
  # WARNING: an empty plan satisfies this on attempt 1. `converged_strict` and `degenerate`
  # are recorded next to it for exactly that reason — read all three. Add the other classes
  # (duplicate_course, hallucinated_course, coreq_violation) here to tighten it.
  # credit_cap_violation, term_offering_violation, and major_overload_violation are not valid
  # additions any more — all three were REMOVED 2026-08-07, not just left off this list: none
  # of the three is a registration wall a student can't talk their way around (a heavy
  # semester, credit- or major-course-wise, is the student's own call; a future offering
  # pattern isn't knowable from this data at all), so none of them should decide whether a
  # plan "converged" or is PLAN_VIABLE. See `plan_scorers.py`'s module docstring.
  violation_classes: [prereq_violation]

  # Blind resampling only. The feedback variant holds seed and temperature fixed so its retries
  # differ in CONTEXT alone — otherwise self-correction and resampling luck are confounded.
  # DEADLOCK BREAKER for the repair variant. Freezing on "no violation" is too weak a test: a
  # placement can be legal where it sits and still make the rest of the degree unreachable
  # (CS 25200 validated at semester 7 gates every cs-elective behind it). When a clean plan
  # stops improving its coverage for this many attempts, the frozen courses standing in front
  # of the unmet requirements are released — latest position first — and the model re-places
  # them. Set patience high to approximate the old unconditional ratchet.
  repair_stall_patience: 2
  repair_release_max: 3

  # PLATEAU STOP — give up when the progress metric (violations, coverage) has not moved for
  # this many consecutive attempts. It is recorded as censor_reason "plateau" and is still
  # CENSORED, not a failure: the model might have converged later, we stopped asking. Saves the
  # GPU time that was going into re-confirming a stuck case (gemma4-e4b sat at 88.9% for seven
  # attempts). A deadlock release resets the counter, so the breaker always gets a fair chance.
  plateau_patience: 3
  # `blind` is deliberately absent: repetition IS its measurement — it samples independently to
  # estimate how often a good plan appears by luck, so identical draws are expected and
  # early-stopping on them would truncate the distribution being measured. `repair` dropped
  # 2026-08-08 with the variant itself — see `enabled_variants` above.
  plateau_variants: [feedback]

  seed_stride: 1000
  temperature_step: 0.05
  temperature_max: 0.80

  # Known-bad prerequisite edges to exclude from scoring, as "COURSE->PREREQ".
  # Mode C COMPOUNDS a wrong edge — the same one is re-hit on every attempt, so it costs a
  # model the whole run rather than one violation. Excluding is loud: the list is printed in
  # the report header and stored in meta_convergence.json.
  excluded_prereq_edges: []

  # NO LONGER A CONFIG KEY, as of 2026-08-08 (was a single fixed path here, e.g.
  # "plan_fixtures/cs_machine_intelligence.locked_slots.yaml"). Multi-school support means the
  # active fixture changes per school, so a single hard-coded path stopped making sense — Mode C
  # now looks BY CONVENTION for a "<fixture-stem>.locked_slots.yaml" sibling of whichever fixture
  # is currently loaded (see `harness/convergence.locked_slots_path_for`), and skips the task
  # entirely for a fixture that doesn't have one rather than erroring.

decision:
  mode_b_viable_floor: 0.90
  mode_a_grounded_floor: 0.90
  plan_viable_gap_pp: 15
  min_plan_scenarios: 8

# --- MODE B THINKING EXPERIMENT -----------------------------------------------------------------
# `--tasks plan_b_thinking` only — see harness/runner.run_thinking_experiment. NOT in
# run.default_tasks, so it never runs unless asked for by name. Launches its OWN server per
# model with reasoning ENABLED (`--reasoning-budget budget_tokens`, no `--reasoning off`) —
# completely separate from every other task's server, which still launches exactly as before
# (`--reasoning off --reasoning-budget 0` when the model's own `think: false`). Results go to
# `runs_thinking.jsonl`, never `runs_baseline.jsonl`, so the two settings can never mix in one
# comparison.
#
# WHY THIS EXISTS, not the removed post-hoc `rationale` field it might look like a revival of:
# `rationale` was written AFTER `semesters` was already fixed (prompts.PLAN_SCHEMA's own
# history note) — pure narration, correctly cut for the ~40% wall-clock it cost without ever
# being able to change the plan it explained. Reasoning BEFORE the grammar-constrained JSON
# starts is a different mechanism: it happens before any course is chosen, so it can at least
# in principle change what gets picked. This experiment measures whether it actually does, on
# these two models, against the identical prompt/schema/scorer `plan_b` already uses.
#
# budget_tokens IS A CEILING ON THE REASONING PORTION ONLY. `_run_freeform_plan` widens the
# request's own `max_tokens` by this same amount (`max_plan_tokens + budget_tokens`) so a full
# reasoning budget can never crowd out the JSON plan that has to follow it — without that, a
# truncated plan would be an artifact of too-small a token ceiling, not a finding about
# reasoning itself.
thinking:
  budget_tokens: 512
